<svg xmlns="http://www.w3.org/2000/svg" width="160" height="64" viewBox="0 0 160 64">
  <!-- Base: wall (high HP) brick -->
  <g id="base">
    <rect width="160" height="64" rx="3" fill="#6a6a6a"/>
    <rect x="4" y="4" width="152" height="56" rx="2" fill="#8a8a8a"/>
    <path d="M0 32H160" stroke="#4a4a4a" stroke-width="4"/>
    <rect x="0" y="0" width="160" height="64" rx="3" fill="none" stroke="#3a3a3a" stroke-width="2"/>
  </g>
  <g id="turret">
    <rect x="72" y="16" width="16" height="16" rx="3" fill="#252020"/>
    <rect x="76" y="24" width="8" height="20" rx="2" fill="#3b1f1a"/>
    <rect x="78" y="12" width="4" height="10" fill="#c9c2b6"/>
  </g>

  <!-- Universal Lv2 + Lv3 deltas -->
  <g id="delta-lv2" fill="none">
    <rect x="2" y="2" width="156" height="60" rx="4"
          stroke="#ffffff" stroke-opacity=".25" stroke-width="2"/>
    <rect x="6" y="10" width="8" height="44" fill="#000" opacity=".15"/>
    <rect x="146" y="10" width="8" height="44" fill="#000" opacity=".15"/>
  </g>
  <g id="delta-lv3" fill="none">
    <rect x="1" y="1" width="158" height="62" rx="4"
          stroke="#ffffff" stroke-opacity=".4" stroke-width="3"/>
    <rect x="20" y="6" width="120" height="6" fill="#000" opacity=".18"/>
    <rect x="20" y="52" width="120" height="6" fill="#000" opacity=".18"/>
  </g>

  <!-- Type delta: double band + bolts -->
  <g id="wall-delta">
    <rect x="0" y="24" width="160" height="8" fill="#000" opacity=".25"/>
    <rect x="0" y="36" width="160" height="8" fill="#000" opacity=".25"/>
    <circle cx="32" cy="32" r="2" fill="#222"/>
    <circle cx="80" cy="32" r="2" fill="#222"/>
    <circle cx="128" cy="32" r="2" fill="#222"/>
  </g>
</svg>
