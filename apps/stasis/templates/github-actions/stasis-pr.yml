name: Stasis PR

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: stasis-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Select Stasis release
        id: stasis
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseId = ./tools/resolve-stasis-nightly.ps1
          $message = "Using newest complete published Stasis nightly: $releaseId"
          Write-Host $message
          if ($env:GITHUB_STEP_SUMMARY) { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Stasis toolchain`n$message" }
          "release_id=$releaseId" >> $env:GITHUB_OUTPUT

      - name: Restore verified Stasis toolchain
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/restore-stasis-release.ps1 -ReleaseId '${{ steps.stasis.outputs.release_id }}' -AssetName stasis-nightly-linux-x64.tar.gz

      - name: Verify checked-in vendor snapshot
        shell: pwsh
        run: |
          $statusJson = @(& stasis --json vendor status --workspace .)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect the checked-in Stasis vendor snapshot.' }
          try {
            $status = ($statusJson -join [Environment]::NewLine) | ConvertFrom-Json -ErrorAction Stop
          } catch {
            throw 'Stasis vendor status returned invalid JSON.'
          }
          if ($status.ok -ne $true) { throw 'Stasis vendor status did not report success.' }
          if ($status.result.current -ne $true) { throw 'Checked-in Stasis vendor snapshot is not current.' }

      - name: Check
        run: stasis check
