name: Stasis manual check

on:
  workflow_dispatch:
    inputs:
      pin_only:
        description: Skip game checks for a mechanical Stasis pin-only change
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: stasis-manual-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Stasis manual check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A manual dispatch validates the exact selected ref.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Honor explicit pin-only mode
        id: sentinel
        shell: bash
        env:
          PIN_ONLY: ${{ inputs.pin_only }}
        run: |
          set -euo pipefail
          relevant=true
          if [[ "${PIN_ONLY:-false}" == "true" ]]; then relevant=false; fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "STASIS_MANUAL_CHECK|game_checks=$relevant" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$relevant" != "true" ]]; then
            echo "Pin-only mode requested; no game commands were run. This manual workflow does not provide an automatic pull-request check." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Read checked-in Stasis pin
        if: steps.sentinel.outputs.relevant == 'true'
        id: pin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -LiteralPath stasis.json -Raw | ConvertFrom-Json
          $pin = $manifest.vendor.stasis
          if ($null -eq $pin) { throw 'stasis.json is missing vendor.stasis.' }
          if ([string]$pin.release_id -notmatch '^nightly-[0-9]{8}-[0-9]+$') {
            throw "Invalid checked-in Stasis release: $($pin.release_id)"
          }
          if ([string]$pin.sha256 -notmatch '^[0-9a-f]{64}$') {
            throw 'stasis.json vendor.stasis.sha256 must be a lowercase SHA-256 digest.'
          }
          "release_id=$($pin.release_id)" >> $env:GITHUB_OUTPUT
          "vendor_sha256=$($pin.sha256)" >> $env:GITHUB_OUTPUT

      - name: Check Android launcher resources
        if: steps.sentinel.outputs.relevant == 'true'
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath stasis.json -Raw | ConvertFrom-Json -ErrorAction Stop
          if ($null -ne $manifest.android) {
            $resources = [string]$manifest.android.launcher_resources
            if ([string]::IsNullOrWhiteSpace($resources) -or
                -not (Test-Path -LiteralPath (Join-Path (Get-Location).Path $resources) -PathType Container)) {
              throw "Android launcher resource directory is missing: $resources"
            }
          }

      - name: Restore immutable Stasis release
        if: steps.sentinel.outputs.relevant == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/restore-stasis-release.ps1 -ReleaseId '${{ steps.pin.outputs.release_id }}' -AssetName stasis-nightly-linux-x64.tar.gz

      - name: Verify checked-in vendor snapshot
        if: steps.sentinel.outputs.relevant == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $statusJson = @(& stasis --json vendor status --workspace .)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect the checked-in Stasis vendor snapshot.' }
          try { $status = ($statusJson -join [Environment]::NewLine) | ConvertFrom-Json -ErrorAction Stop }
          catch { throw 'Stasis vendor status returned invalid JSON.' }
          if ($status.ok -ne $true -or $status.result.current -ne $true) {
            throw 'Checked-in Stasis vendor snapshot is not current for the immutable pin.'
          }

      - name: Check formatting
        if: steps.sentinel.outputs.relevant == 'true'
        run: stasis fmt --check

      - name: Check Stasis project
        if: steps.sentinel.outputs.relevant == 'true'
        run: stasis check
