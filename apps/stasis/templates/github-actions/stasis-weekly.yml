name: Stasis Weekly Release

on:
  workflow_dispatch:
    inputs:
      force_release:
        description: Build even when game inputs and the pinned Stasis release are unchanged
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: stasis-weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  decide:
    name: Decide whether a Stasis release is needed
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decision.outputs.should_release }}
      stasis_release: ${{ steps.decision.outputs.stasis_release }}
      pinned_release: ${{ steps.decision.outputs.pinned_release }}
      release_tag: ${{ steps.decision.outputs.release_tag }}
      source_commit: ${{ steps.decision.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide from game and Stasis advances
        id: decision
        shell: pwsh
        env:
          FORCE_RELEASE: ${{ inputs.force_release }}
          RUN_NUMBER: ${{ github.run_number }}
          SOURCE_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -LiteralPath stasis.json -Raw | ConvertFrom-Json
          $pinned = [string]$manifest.vendor.stasis.release_id
          if ($pinned -notmatch '^nightly-[0-9]{8}-[0-9]+$') { throw "Invalid pinned Stasis release: $pinned" }

          # Release tags are created only by this workflow. Comparing the
          # latest qualified published release keeps an unchanged manual
          # dispatch cheap. The checked-in pin is the only Stasis input.
          $tagLines = @(& git tag --merged HEAD --list 'stasis-release-*' --sort=-creatordate)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to list prior Stasis release tags' }
          $lastTag = [string]($tagLines | Select-Object -First 1)
          $lastReleaseStasis = $null
          $lastReleaseSource = $null
          $baselineAvailable = $false
          if ($lastTag) {
            $manifestDir = Join-Path $env:RUNNER_TEMP "stasis-release-manifest-$env:GITHUB_RUN_ID"
            try {
              New-Item -ItemType Directory -Force -Path $manifestDir | Out-Null
              $releaseJson = @(& gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/$env:GITHUB_REPOSITORY/releases/tags/$lastTag")
              if ($LASTEXITCODE -ne 0) { throw "Unable to query the published release for $lastTag" }
              $release = ($releaseJson -join [Environment]::NewLine) | ConvertFrom-Json
              if ($release.draft -ne $false -or [string]::IsNullOrWhiteSpace([string]$release.published_at) -or [string]$release.tag_name -cne $lastTag) { throw "Release $lastTag is not published under the expected tag" }
              $expectedAssets = @('BUILD-MANIFEST.json', 'SHA256SUMS.txt', 'stasis-game-android-arm64-unsigned.apk', 'stasis-game-web.tar.gz', 'stasis-game-win-x64.zip') | Sort-Object -CaseSensitive
              $assets = @($release.assets)
              $assetNames = @($assets | ForEach-Object { [string]$_.name } | Sort-Object -CaseSensitive)
              $assetDifferences = @(Compare-Object -ReferenceObject $expectedAssets -DifferenceObject $assetNames -CaseSensitive)
              if ($assets.Count -ne $expectedAssets.Count -or $assetDifferences.Count -gt 0 -or
                  @($assets | Where-Object { [string]$_.state -cne 'uploaded' -or [int]$_.size -le 0 }).Count -gt 0) {
                throw "Release $lastTag does not contain the complete uploaded release asset set"
              }
              & gh release download $lastTag --repo $env:GITHUB_REPOSITORY --pattern BUILD-MANIFEST.json --pattern SHA256SUMS.txt --pattern stasis-game-android-arm64-unsigned.apk --pattern stasis-game-web.tar.gz --pattern stasis-game-win-x64.zip --dir $manifestDir --clobber
              if ($LASTEXITCODE -ne 0) { throw "Unable to download the complete release evidence for $lastTag" }
              $releaseManifestPath = Join-Path $manifestDir 'BUILD-MANIFEST.json'
              $checksumsPath = Join-Path $manifestDir 'SHA256SUMS.txt'
              if (-not (Test-Path -LiteralPath $releaseManifestPath -PathType Leaf) -or -not (Test-Path -LiteralPath $checksumsPath -PathType Leaf)) { throw "Release $lastTag has no complete baseline files" }
              $releaseManifest = Get-Content -LiteralPath $releaseManifestPath -Raw | ConvertFrom-Json
              $expectedPackages = @('stasis-game-android-arm64-unsigned.apk', 'stasis-game-web.tar.gz', 'stasis-game-win-x64.zip')
              $checksumLines = @(Get-Content -LiteralPath $checksumsPath | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
              if ($checksumLines.Count -ne $expectedPackages.Count) { throw "Release $lastTag checksums do not contain the exact package set" }
              $checksumByName = [System.Collections.Generic.Dictionary[string, string]]::new([StringComparer]::Ordinal)
              foreach ($line in $checksumLines) {
                $checksumMatch = [regex]::Match([string]$line, '^(?<digest>[0-9a-f]{64})  (?<name>[^/\\]+)$')
                if (-not $checksumMatch.Success -or $checksumByName.ContainsKey($checksumMatch.Groups['name'].Value)) { throw "Release $lastTag has malformed or duplicate checksum records" }
                $checksumByName[$checksumMatch.Groups['name'].Value] = $checksumMatch.Groups['digest'].Value
              }
              $checksumNameDifferences = @(Compare-Object -ReferenceObject ($expectedPackages | Sort-Object -CaseSensitive) -DifferenceObject (@($checksumByName.Keys) | Sort-Object -CaseSensitive) -CaseSensitive)
              if ($checksumNameDifferences.Count -gt 0) { throw "Release $lastTag checksums do not match the exact package set" }
              foreach ($packageName in $expectedPackages) {
                $packagePath = Join-Path $manifestDir $packageName
                if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) { throw "Release $lastTag is missing package $packageName" }
                $actualDigest = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
                if ($actualDigest -cne $checksumByName[$packageName]) { throw "Release $lastTag package checksum mismatch: $packageName" }
              }
              $lastReleaseStasis = [string]$releaseManifest.stasis_release
              $lastReleaseSource = [string]$releaseManifest.source_commit
              $runUrl = [string]$releaseManifest.workflow_run
              $runPattern = '^https://github\.com/' + [regex]::Escape($env:GITHUB_REPOSITORY) + '/actions/runs/(?<id>[0-9]+)$'
              $runMatch = [regex]::Match($runUrl, $runPattern)
              $tagMatch = [regex]::Match($lastTag, '^stasis-release-[0-9]{8}-(?<run>[0-9]+)$')
              if ([string]$releaseManifest.schema -cne 'stasis-scheduled-release' -or [int]$releaseManifest.version -ne 1 -or
                  [string]$releaseManifest.repository -cne $env:GITHUB_REPOSITORY -or [string]$releaseManifest.release_tag -cne $lastTag -or
                  $lastReleaseSource -notmatch '^[0-9a-f]{40}$' -or $lastReleaseStasis -notmatch '^nightly-[0-9]{8}-[0-9]+$' -or
                  -not $runMatch.Success -or $runMatch.Groups['id'].Value -eq $env:GITHUB_RUN_ID -or -not $tagMatch.Success) {
                throw "Release $lastTag has incomplete manifest provenance"
              }
              $tagCommit = [string](git rev-list -n 1 $lastTag)
              if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $lastReleaseSource) { throw "Release $lastTag manifest commit does not match its tag" }
              $sourceRunJson = @(& gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/$env:GITHUB_REPOSITORY/actions/runs/$($runMatch.Groups['id'].Value)")
              if ($LASTEXITCODE -ne 0) { throw "Source workflow run for $lastTag is unavailable" }
              $sourceRun = ($sourceRunJson -join [Environment]::NewLine) | ConvertFrom-Json
              if ([string]$sourceRun.path -notmatch '^\.github/workflows/stasis-weekly\.yml@' -or [string]$sourceRun.status -cne 'completed' -or
                  [string]$sourceRun.conclusion -cne 'success' -or [string]$sourceRun.head_sha -cne $lastReleaseSource -or
                  [string]$sourceRun.event -notin @('workflow_dispatch', 'schedule') -or
                  [string]$sourceRun.id -cne $runMatch.Groups['id'].Value -or [string]$sourceRun.repository.full_name -cne $env:GITHUB_REPOSITORY -or
                  [string]$sourceRun.head_repository.full_name -cne $env:GITHUB_REPOSITORY -or [string]$sourceRun.run_number -cne $tagMatch.Groups['run'].Value) {
                throw "Source workflow run for $lastTag did not complete successfully or match release provenance"
              }
              $sourceJobsJson = @(& gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/$env:GITHUB_REPOSITORY/actions/runs/$($runMatch.Groups['id'].Value)/jobs?per_page=100")
              if ($LASTEXITCODE -ne 0) { throw "Source workflow jobs for $lastTag are unavailable" }
              $sourceJobsResponse = ($sourceJobsJson -join [Environment]::NewLine) | ConvertFrom-Json
              $sourceJobs = @($sourceJobsResponse.jobs)
              $releaseJobNames = @('Publish manual release', 'Publish scheduled release')
              $releaseJobs = @($sourceJobs | Where-Object { [string]$_.name -cin $releaseJobNames })
              if ($releaseJobs.Count -ne 1) { throw "Source workflow run for $lastTag does not contain exactly one release job" }
              $requiredJobs = @('Decide whether a Stasis release is needed', 'Build weekly targets (android-web)', 'Build weekly targets (win-x64)', [string]$releaseJobs[0].name)
              $expectedJobs = @(($requiredJobs + 'Skip true no-op') | Sort-Object -CaseSensitive)
              $actualJobs = @($sourceJobs | ForEach-Object { [string]$_.name } | Sort-Object -CaseSensitive)
              $jobDifferences = @(Compare-Object -ReferenceObject $expectedJobs -DifferenceObject $actualJobs -CaseSensitive)
              if ($actualJobs.Count -ne $expectedJobs.Count -or $jobDifferences.Count -gt 0) { throw "Source workflow run for $lastTag does not contain the exact expected job set" }
              foreach ($name in $requiredJobs) {
                $matching = @($sourceJobs | Where-Object { [string]$_.name -ceq $name })
                if ($matching.Count -ne 1 -or [string]$matching[0].conclusion -cne 'success') { throw "Source workflow run for $lastTag lacks successful job '$name'" }
              }
              $noOpJob = @($sourceJobs | Where-Object { [string]$_.name -ceq 'Skip true no-op' })
              if ($noOpJob.Count -ne 1 -or [string]$noOpJob[0].conclusion -cne 'skipped') { throw "Source workflow run for $lastTag was not a release build" }
              $baselineAvailable = $true
            } catch {
              Write-Warning "Latest release $lastTag is not a qualified success baseline; rebuilding conservatively: $($_.Exception.Message)"
              $lastTag = ''
              $lastReleaseStasis = $null
              $lastReleaseSource = $null
            } finally {
              Remove-Item -LiteralPath $manifestDir -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          # Treat every tracked project change as game advancement except the
          # vendored snapshot, whose content is represented by the Stasis pin.
          $gamePaths = @('.', ':(exclude)vendor/stasis/**')
          $gameAdvanced = -not $baselineAvailable
          if ($baselineAvailable) {
            $changed = @(git diff --name-only "$lastTag" HEAD -- $gamePaths)
            if ($LASTEXITCODE -ne 0) { throw "Unable to compare $lastTag with HEAD" }
            $gameAdvanced = $changed.Count -gt 0
            if ($changed -contains 'stasis.json') {
              $before = (git show "${lastTag}:stasis.json" | Out-String | ConvertFrom-Json)
              $after = Get-Content -LiteralPath stasis.json -Raw | ConvertFrom-Json
              $before.vendor.PSObject.Properties.Remove('stasis')
              $after.vendor.PSObject.Properties.Remove('stasis')
              $beforeNonPin = $before | ConvertTo-Json -Depth 32 -Compress
              $afterNonPin = $after | ConvertTo-Json -Depth 32 -Compress
              if ($beforeNonPin -eq $afterNonPin) {
                $gameAdvanced = ($changed | Where-Object { $_ -ne 'stasis.json' }).Count -gt 0
              }
            }
          }
          $stasisAdvanced = -not $baselineAvailable -or $pinned -ne $lastReleaseStasis
          $force = $env:FORCE_RELEASE -eq 'true'
          $shouldRelease = $force -or $gameAdvanced -or $stasisAdvanced
          $releaseTag = "stasis-release-$((Get-Date).ToUniversalTime().ToString('yyyyMMdd'))-$env:RUN_NUMBER"

          "should_release=$($shouldRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "stasis_release=$pinned" >> $env:GITHUB_OUTPUT
          "pinned_release=$pinned" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "source_commit=$env:SOURCE_COMMIT" >> $env:GITHUB_OUTPUT
          if ($shouldRelease) {
            "Release required: game_advanced=$gameAdvanced stasis_advanced=$stasisAdvanced force=$force baseline_stasis=$lastReleaseStasis baseline_source=$lastReleaseSource" >> $env:GITHUB_STEP_SUMMARY
          } else {
            "True no-op: game and Stasis are unchanged since $lastTag; no matrix or release will run." >> $env:GITHUB_STEP_SUMMARY
          }

  build:
    name: Build weekly targets (${{ matrix.platform }})
    needs: decide
    if: needs.decide.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: stasis-nightly-linux-x64.tar.gz
            platform: android-web
          - os: windows-latest
            asset: stasis-nightly-win-x64.zip
            platform: win-x64
            archive: stasis-game-win-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore resolved immutable Stasis release for Linux
        if: matrix.platform == 'android-web'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/restore-stasis-release.ps1 -ReleaseId '${{ needs.decide.outputs.stasis_release }}' -AssetName '${{ matrix.asset }}'

      - name: Verify the checked-in vendor snapshot
        if: matrix.platform == 'android-web'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $statusJson = @(& stasis --json vendor status --workspace .)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect the checked-in Stasis vendor snapshot.' }
          try { $status = ($statusJson -join [Environment]::NewLine) | ConvertFrom-Json -ErrorAction Stop }
          catch { throw 'Stasis vendor status returned invalid JSON.' }
          if ($status.ok -ne $true -or $status.result.current -ne $true) {
            throw 'Checked-in Stasis vendor snapshot is not current for the immutable pin.'
          }

      - name: Check formatting
        if: matrix.platform == 'android-web'
        run: stasis fmt --check

      - name: Check
        if: matrix.platform == 'android-web'
        run: stasis check

      - name: Test
        if: matrix.platform == 'android-web'
        run: stasis test

      - name: Build Windows desktop within 120 seconds
        if: matrix.platform == 'win-x64'
        timeout-minutes: 2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.decide.outputs.stasis_release }}
          ASSET_NAME: ${{ matrix.asset }}
        run: |
          $ErrorActionPreference = 'Stop'
          $budgetSeconds = 120.0
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          $phases = [System.Collections.Generic.List[string]]::new()
          $status = 'failed'
          try {
            $restoreOutput = @(& ./tools/restore-stasis-release.ps1 -ReleaseId $env:RELEASE_ID -AssetName $env:ASSET_NAME)
            if ($restoreOutput.Count -ne 1) { throw "Restore helper returned $($restoreOutput.Count) paths; expected exactly one Stasis executable." }
            $stasisPath = [IO.Path]::GetFullPath([string]$restoreOutput[0])
            if (-not (Test-Path -LiteralPath $stasisPath -PathType Leaf)) { throw "Restored Stasis executable was not found: $stasisPath" }
            $phases.Add(('Restore: {0:N2}s cumulative' -f $timer.Elapsed.TotalSeconds)) | Out-Null

            $statusJson = @(& $stasisPath --json vendor status --workspace .)
            if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect the checked-in Stasis vendor snapshot.' }
            try { $vendorStatus = ($statusJson -join [Environment]::NewLine) | ConvertFrom-Json -ErrorAction Stop }
            catch { throw 'Stasis vendor status returned invalid JSON.' }
            if ($vendorStatus.ok -ne $true -or $vendorStatus.result.current -ne $true) {
              throw 'Checked-in Stasis vendor snapshot is not current for the immutable pin.'
            }
            $phases.Add(('Vendor gate: {0:N2}s cumulative' -f $timer.Elapsed.TotalSeconds)) | Out-Null

            & $stasisPath package --target desktop
            if ($LASTEXITCODE -ne 0) { throw "Windows desktop packaging failed with exit code $LASTEXITCODE." }
            $phases.Add(('Desktop package: {0:N2}s cumulative' -f $timer.Elapsed.TotalSeconds)) | Out-Null

            $packages = @(Get-ChildItem -LiteralPath 'dist' -Directory)
            if ($packages.Count -ne 1) { throw "Expected one desktop package directory, found $($packages.Count)." }
            $archivePath = Join-Path (Get-Location) 'dist/stasis-game-win-x64.zip'
            Compress-Archive -Path (Join-Path $packages[0].FullName '*') -DestinationPath $archivePath -Force
            if (-not (Test-Path -LiteralPath $archivePath -PathType Leaf)) { throw "Windows release archive was not created: $archivePath" }
            $phases.Add(('ZIP archive: {0:N2}s cumulative' -f $timer.Elapsed.TotalSeconds)) | Out-Null
            if ($timer.Elapsed.TotalSeconds -gt $budgetSeconds) { throw "Windows packaging exceeded its $budgetSeconds second total budget." }
            $status = 'passed'
          }
          finally {
            $timer.Stop()
            $summaryLines = @(
              '### Windows package time budget',
              "- Result: **$status**",
              ("- Total: {0:N2}s / {1:N0}s" -f $timer.Elapsed.TotalSeconds, $budgetSeconds)
            ) + @($phases | ForEach-Object { "- $_" })
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($summaryLines -join [Environment]::NewLine)
          }

      - name: Setup Java
        if: matrix.platform == 'android-web'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        if: matrix.platform == 'android-web'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        if: matrix.platform == 'android-web'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Install Android build components
        if: matrix.platform == 'android-web'
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Install web optimizer
        if: matrix.platform == 'android-web'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes binaryen
          wasm-opt --version

      - name: Package Android arm64 and web within 180 seconds
        if: matrix.platform == 'android-web'
        timeout-minutes: 3
        shell: bash
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          set -euo pipefail
          readonly budget_ms=180000
          total_start_ns="$(date +%s%N)"
          phase_results=()
          record_phase() {
            local elapsed_ms=$((( $(date +%s%N) - total_start_ns) / 1000000))
            phase_results+=("$1: ${elapsed_ms} ms cumulative")
          }
          finish() {
            local result=$? elapsed_ms status
            trap - EXIT
            elapsed_ms=$((( $(date +%s%N) - total_start_ns) / 1000000))
            if (( result == 0 && elapsed_ms > budget_ms )); then result=1; fi
            if (( result == 0 )); then status=passed; else status=failed; fi
            {
              printf '### Linux Android and web package time budget\n'
              printf -- '- Result: **%s**\n- Total: %d ms / %d ms\n' "$status" "$elapsed_ms" "$budget_ms"
              for phase in "${phase_results[@]}"; do printf -- '- %s\n' "$phase"; done
            } >> "$GITHUB_STEP_SUMMARY" || true
            exit "$result"
          }
          trap finish EXIT

          stasis package --target android-arm64 --out dist/stasis-android
          record_phase 'Android project generation'

          gradle -p dist/stasis-android/android :app:assembleRelease --no-daemon --max-workers=2 --console=plain
          record_phase 'Gradle APK assembly'

          unsigned_apk=dist/stasis-android/android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$unsigned_apk"
          cp "$unsigned_apk" dist/stasis-game-android-arm64-unsigned.apk
          echo "Android APK is unsigned and cannot be installed or used to upgrade an existing app. A persistent Android app keystore and Gradle signing configuration are required before distributing an installable APK." >> "$GITHUB_STEP_SUMMARY"
          record_phase 'Unsigned APK copy'

          stasis package --target web --out dist/stasis-web | tee "$RUNNER_TEMP/stasis-web-package.log"
          grep -F 'wasm-opt -Oz' "$RUNNER_TEMP/stasis-web-package.log"
          record_phase 'Optimized web package'

          test -f dist/stasis-web/index.html
          tar -czf dist/stasis-game-web.tar.gz -C dist/stasis-web .
          record_phase 'Web archive'
          elapsed_ms=$((( $(date +%s%N) - total_start_ns) / 1000000))
          if (( elapsed_ms > budget_ms )); then echo "Packaging exceeded the ${budget_ms} ms total budget." >&2; exit 1; fi

      - name: Upload desktop release candidate
        uses: actions/upload-artifact@v4
        if: matrix.platform == 'win-x64'
        with:
          name: stasis-weekly-${{ needs.decide.outputs.release_tag }}-${{ matrix.platform }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android and web release candidates
        uses: actions/upload-artifact@v4
        if: matrix.platform == 'android-web'
        with:
          name: stasis-weekly-${{ needs.decide.outputs.release_tag }}-${{ matrix.platform }}
          path: |
            dist/stasis-game-android-arm64-unsigned.apk
            dist/stasis-game-web.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish manual release
    needs: [decide, build]
    if: needs.decide.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stasis-weekly-${{ needs.decide.outputs.release_tag }}-*
          path: dist
          merge-multiple: true

      - name: Write immutable release manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
          STASIS_RELEASE: ${{ needs.decide.outputs.stasis_release }}
          SOURCE_COMMIT: ${{ needs.decide.outputs.source_commit }}
        run: |
          set -euo pipefail
          expected=(
            stasis-game-android-arm64-unsigned.apk
            stasis-game-web.tar.gz
            stasis-game-win-x64.zip
          )
          mapfile -t actual < <(find dist -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected release files. Expected:\n%s\nActual:\n%s\n' "${expected[*]}" "${actual[*]}" >&2
            exit 1
          fi
          if find dist -mindepth 1 -maxdepth 1 -type d -print -quit | grep -q .; then
            echo 'Unexpected directory in downloaded release artifacts.' >&2
            exit 1
          fi
          printf '%s\n' "${expected[@]}" > dist/ARTIFACT-NAMES.txt
          test -s dist/ARTIFACT-NAMES.txt
          while IFS= read -r artifact; do sha256sum "dist/${artifact}"; done < dist/ARTIFACT-NAMES.txt > dist/SHA256SUMS.txt
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg source "$SOURCE_COMMIT" \
            --arg stasis "$STASIS_RELEASE" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{schema:"stasis-scheduled-release",version:1,repository:$repository,release_tag:$tag,source_commit:$source,stasis_release:$stasis,workflow_run:$run}' > dist/BUILD-MANIFEST.json
          rm dist/ARTIFACT-NAMES.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
          STASIS_RELEASE: ${{ needs.decide.outputs.stasis_release }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Stasis game $RELEASE_TAG" \
            --notes "Scheduled game release built with complete Stasis $STASIS_RELEASE. The Android APK is unsigned and cannot be installed or used to upgrade an existing app; a persistent Android app keystore and Gradle signing configuration are required before distribution." \
            --prerelease

  no-op:
    name: Skip true no-op
    needs: decide
    if: needs.decide.outputs.should_release != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'No game or Stasis advance; skipped full release matrices.'
