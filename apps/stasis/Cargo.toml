[package]
name = "stasis"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
packaged-desktop-acceptance = []

[lints]
workspace = true

[dependencies]
stasis_runner = { path = "../../crates/stasis_runner" }
stasis_jit = { path = "../../crates/stasis_jit" }
stasis_lsp = { path = "../../crates/stasis_lsp" }
stasis_language_service = { path = "../../crates/stasis_language_service" }
stasis_compiler = { path = "../../crates/stasis_compiler" }
notify.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
flate2 = "1.1"
oxc_allocator = "=0.125.0"
oxc_codegen = "=0.125.0"
oxc_minifier = "=0.125.0"
oxc_parser = "=0.125.0"
oxc_span = "=0.125.0"
stasis_dynload = { path = "../../crates/stasis_dynload", features = ["network"] }
stasis_assets = { path = "../../crates/stasis_assets" }
stasis_network = { path = "../../crates/stasis_network" }
image = { workspace = true, features = ["jpeg"] }
atomic-write-file.workspace = true


[dev-dependencies]
object = "0.36"
winit = { version = "0.29", default-features = false, features = ["rwh_06"] }
tungstenite.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "stasis"
path = "src/main.rs"
