[workspace]
resolver = "2"
members = [
  "apps/stasis",
  "crates/stasis_assets",
  "crates/stasis_compiler",
  "crates/stasis_dynload",
  "crates/stasis_android_bridge",
  "crates/stasis_jit",
  "crates/stasis_language_service",
  "crates/stasis_runner",
  "crates/stasis_ai",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
notify = "6.1"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
atomic-write-file = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }

cranelift-codegen = { version = "0.117", features = ["arm64"] }
cranelift-frontend = "0.117"
cranelift-jit = "0.117"
cranelift-module = "0.117"
cranelift-native = "0.117"
cranelift-object = "0.117"
target-lexicon = "0.13"

winit = "0.29"
glutin = "0.31"
glutin-winit = "0.4"
glow = "0.13"
raw-window-handle = "0.5"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
strip = "symbols"
