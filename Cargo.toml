[workspace]
resolver = "2"
members = [
  "apps/stasis",
  "crates/stasis_compiler",
  "crates/stasis_jit",
  "crates/stasis_runner",
]
exclude = [
  "tools/cranelift-aot",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
notify = "6.1"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

cranelift-codegen = "0.117"
cranelift-frontend = "0.117"
cranelift-jit = "0.117"
cranelift-module = "0.117"

winit = "0.29"
glutin = "0.31"
glutin-winit = "0.4"
glow = "0.13"
raw-window-handle = "0.5"
