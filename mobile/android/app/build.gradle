plugins {
    id 'com.android.application'
}

def repoRootDir = rootProject.projectDir.parentFile.parentFile
def publishedAotDir = layout.buildDirectory.dir('generated/stasisAot/publishedArm64')
def workshopAssetsDir = layout.buildDirectory.dir('generated/stasisAssets/workshop')
def pongReleaseProjectDir = file('src/main/assets/workshop_sample')

android {
    namespace 'com.stasislang.workshop'
    compileSdk = (project.findProperty('stasis.compileSdk') ?: '35').toString().toInteger()

    defaultConfig {
        applicationId 'com.stasislang.workshop'
        minSdk = (project.findProperty('stasis.minSdk') ?: '26').toString().toInteger()
        targetSdk = (project.findProperty('stasis.targetSdk') ?: '35').toString().toInteger()
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DSTASIS_ANDROID_SMOKE_ONLY=ON'
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions 'mode'
    productFlavors {
        workshop {
            dimension 'mode'
            applicationId 'com.stasislang.workshop'
            manifestPlaceholders = [appLabel: 'Stasis Workshop']
            buildConfigField 'boolean', 'STASIS_PUBLISHED_BUILD', 'false'
            buildConfigField 'String', 'STASIS_GAME_ID', '""'
            externalNativeBuild {
                cmake {
                    arguments '-DSTASIS_ANDROID_PUBLISHED_AOT=OFF'
                }
            }
        }
        published {
            dimension 'mode'
            applicationId 'com.stasislang.pong'
            manifestPlaceholders = [appLabel: 'Stasis Pong']
            buildConfigField 'boolean', 'STASIS_PUBLISHED_BUILD', 'true'
            buildConfigField 'String', 'STASIS_GAME_ID', '"pong"'
            externalNativeBuild {
                cmake {
                    arguments '-DSTASIS_ANDROID_PUBLISHED_AOT=ON', "-DSTASIS_PUBLISHED_AOT_DIR=${projectDir}/build/generated/stasisAot/publishedArm64"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }

    sourceSets {
        main.assets.setSrcDirs([])
        workshop.assets.setSrcDirs([workshopAssetsDir.get().asFile])
        published.assets.setSrcDirs([])
    }
}

tasks.register('prepareWorkshopAssets', Sync) {
    from(file('src/main/assets')) {
        exclude 'workshop_sample/build/**'
    }
    into(workshopAssetsDir)
}

tasks.register('generatePublishedAotBundle', Exec) {
    def outputDir = publishedAotDir.get().asFile
    inputs.dir(pongReleaseProjectDir)
    outputs.dir(outputDir)
    workingDir repoRootDir
    commandLine 'cargo', 'run', '-p', 'stasis', '--', 'android-aot-bundle',
            '--project-dir', pongReleaseProjectDir.absolutePath,
            '--out-dir', outputDir.absolutePath
}

tasks.configureEach { task ->
    if (task.name.startsWith('preWorkshop')) {
        task.dependsOn(tasks.named('prepareWorkshopAssets'))
    }
    if (task.name.startsWith('prePublished') || (task.name.startsWith('configureCMake') && task.name.contains('Published'))) {
        task.dependsOn(tasks.named('generatePublishedAotBundle'))
    }
}
