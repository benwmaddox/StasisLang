<svg xmlns="http://www.w3.org/2000/svg" width="160" height="64" viewBox="0 0 160 64">
  <!-- Base: basic shot brick -->
  <g id="base">
    <rect width="160" height="64" rx="4" fill="#a45745"/>
    <rect x="4" y="4" width="152" height="56" rx="3" fill="#c16550"/>
    <path d="M0 32H160" stroke="#7a3d30" stroke-width="3"/>
  </g>
  <g id="turret">
    <rect x="72" y="24" width="16" height="16" rx="2" fill="#3b1f1a"/>
  </g>

  <!-- Universal Lv2 delta -->
  <g id="delta-lv2" fill="none">
    <rect x="2" y="2" width="156" height="60" rx="4"
          stroke="#ffffff" stroke-opacity=".25" stroke-width="2"/>
    <rect x="6" y="10" width="8" height="44" fill="#000" opacity=".15"/>
    <rect x="146" y="10" width="8" height="44" fill="#000" opacity=".15"/>
  </g>

  <!-- Type-specific delta: double slit -->
  <g id="basic-shot-delta">
    <rect x="60" y="24" width="8" height="16" fill="#1a0f0c"/>
    <rect x="92" y="24" width="8" height="16" fill="#1a0f0c"/>
  </g>
</svg>
