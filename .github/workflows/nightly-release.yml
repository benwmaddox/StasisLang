name: Nightly Release

env:
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read
  pull-requests: read
  actions: read

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  integration_seams:
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    uses: ./.github/workflows/nightly-validation.yml

  performance_benchmarks:
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    uses: ./.github/workflows/perf-ci.yml

  network_browser_acceptance:
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    uses: ./.github/workflows/network-browser-acceptance.yml

  android_device_seams:
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    uses: ./.github/workflows/android-device-seams.yml

  detect:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.meta.outputs.should_release }}
      nightly_tag: ${{ steps.meta.outputs.nightly_tag }}
      last_tag: ${{ steps.meta.outputs.last_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine if nightly release is needed
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          # Use the most recent nightly tag reachable from HEAD.
          # This avoids false-positive "changes detected" when dispatching
          # from refs that do not contain the newest global nightly tag.
          last_tag="$(git tag --merged HEAD --list 'nightly-*' --sort=-creatordate | head -n1 || true)"
          if [ -z "${last_tag}" ]; then
            should_release="true"
          else
            commit_count="$(git rev-list "${last_tag}..HEAD" --count)"
            if [ "${commit_count}" -gt 0 ]; then
              should_release="true"
            else
              should_release="false"
            fi
          fi

          date_tag="$(date -u +'%Y%m%d')"
          nightly_tag="nightly-${date_tag}-${GITHUB_RUN_NUMBER}"

          echo "last_tag=${last_tag}" >> "$GITHUB_OUTPUT"
          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"
          echo "nightly_tag=${nightly_tag}" >> "$GITHUB_OUTPUT"

          echo "last nightly tag: ${last_tag:-<none>}"
          echo "should release: ${should_release}"
          echo "new nightly tag: ${nightly_tag}"

  mobile_network_support:
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust targets
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install pinned Android NDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Build Android network support
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-26" "ndk;27.0.12077973"
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          ndk_root="${android_sdk}/ndk/27.0.12077973"
          clang="${ndk_root}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          test -x "${clang}"
          mkdir -p network-artifact/include network-artifact/android-arm64 network-artifact/android-x86_64
          cp crates/stasis_network/include/stasis_network.h network-artifact/include/
          for target in aarch64-linux-android x86_64-linux-android; do
            api_target="${target}26"
            linker_key="CARGO_TARGET_$(echo "${target}" | tr '[:lower:]-' '[:upper:]_')_LINKER"
            env "${linker_key}=${clang}" \
              "CC_${target}=${clang}" \
              "CXX_${target}=${clang}" \
              "CFLAGS_${target}=--target=${api_target}" \
              RUSTFLAGS="-C link-arg=--target=${api_target} -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-soname,libstasis_network_v1.so" \
              cargo build -p stasis_network --target "${target}" --release
          done
          cp target/aarch64-linux-android/release/libstasis_network.so network-artifact/android-arm64/libstasis_network_v1.so
          cp target/x86_64-linux-android/release/libstasis_network.so network-artifact/android-x86_64/libstasis_network_v1.so

      - name: Upload immutable mobile network support
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: mobile-network-support-android
          path: network-artifact
          if-no-files-found: error
          retention-days: 14

  android_runtime_support:
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pinned SDL3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: libsdl-org/SDL
          ref: 8e37db5e797b6167f3a00d697d816a684bd259c7
          path: target/android-runtime-source/SDL

      - name: Checkout pinned SDL3_image
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: libsdl-org/SDL_image
          ref: bec9134a26c7d0f31b36d6083c25296e04cabff5
          path: target/android-runtime-source/SDL_image

      - name: Install pinned Android runtime toolchain
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Build immutable Android arm64 runtime
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"
          sdkmanager "platforms;android-26" "ndk;27.0.12077973" "cmake;3.22.1"
          setup_finished="$(date +%s)"
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          cmake_root="${android_sdk}/cmake/3.22.1/bin"
          fingerprint="$(python3 tools/compute_toolchain_fingerprint.py \
            --source-commit "${GITHUB_SHA}" \
            --release-id "${{ needs.detect.outputs.nightly_tag }}")"
          python3 tools/build_android_runtime.py \
            --runtime-source runtime \
            --sdl3-source target/android-runtime-source/SDL \
            --sdl3-image-source target/android-runtime-source/SDL_image \
            --network-include crates/stasis_network/include \
            --ndk-root "${android_sdk}/ndk/27.0.12077973" \
            --cmake "${cmake_root}/cmake" \
            --ninja "${cmake_root}/ninja" \
            --release-id "${{ needs.detect.outputs.nightly_tag }}" \
            --source-commit "${GITHUB_SHA}" \
            --build-fingerprint "${fingerprint}" \
            --out android-runtime-artifact/arm64-v8a
          build_finished="$(date +%s)"
          artifact_bytes="$(du -sb android-runtime-artifact/arm64-v8a | cut -f1)"
          {
            echo "### Android runtime cold phase timing"
            echo ""
            echo "| Phase | Seconds |"
            echo "| --- | ---: |"
            echo "| SDK/NDK/CMake install | $((setup_finished - started)) |"
            echo "| Three runtime variants + common dependencies | $((build_finished - setup_finished)) |"
            echo "| Total | $((build_finished - started)) |"
            echo ""
            echo "Uncompressed runtime kit bytes: ${artifact_bytes}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload immutable Android runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: android-runtime-arm64
          path: android-runtime-artifact
          if-no-files-found: error
          retention-days: 14

  build:
    needs: [detect, mobile_network_support, android_runtime_support]
    if: needs.detect.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            archive: stasis-nightly-linux-x64
            ext: tar.gz
            bundle_platform: linux
          - os: windows-2022
            rust_target: x86_64-pc-windows-msvc
            archive: stasis-nightly-win-x64
            ext: zip
            bundle_platform: windows
          - os: macos-15
            rust_target: aarch64-apple-darwin
            archive: stasis-nightly-osx-arm64
            ext: tar.gz
            bundle_platform: macos
    runs-on: ${{ matrix.os }}
    env:
      STASIS_RELEASE_ID: ${{ needs.detect.outputs.nightly_tag }}
      STASIS_SOURCE_COMMIT: ${{ github.sha }}
      STASIS_BUILD_TARGET: ${{ matrix.rust_target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute shared toolchain fingerprint
        shell: bash
        run: |
          fingerprint="$(python3 tools/compute_toolchain_fingerprint.py --source-commit "$STASIS_SOURCE_COMMIT" --release-id "$STASIS_RELEASE_ID")"
          echo "STASIS_BUILD_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"

      - name: Download immutable mobile network support
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mobile-network-support-android
          path: mobile/network

      - name: Download immutable Android arm64 runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-runtime-arm64
          path: mobile/android-runtime

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install SDL development packages (linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes pkg-config
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev
          libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libegl1 libgl1-mesa-dri
          xvfb binaryen

      - name: Install SDL development packages (macos)
        if: runner.os == 'macOS'
        run: brew install pkg-config

      - name: Setup MSVC dev environment (windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Build stasis (release)
        run: cargo build -p stasis --release --target ${{ matrix.rust_target }}

      - name: Build native AOT bridge (unix)
        if: runner.os != 'Windows'
        run: cargo rustc -p stasis_dynload --release --target ${{ matrix.rust_target }} -- --crate-type staticlib

      - name: Build native AOT bridge (windows)
        if: runner.os == 'Windows'
        run: cargo build -p stasis_dynload --release --target ${{ matrix.rust_target }}

      - name: Build desktop network support (unix)
        if: runner.os != 'Windows'
        run: python tools/cargo_cache.py run -- cargo build -p stasis_network --release --target ${{ matrix.rust_target }}

      - name: Build desktop network support (windows)
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: python tools/cargo_cache.py run -- cargo build -p stasis_network --release --target ${{ matrix.rust_target }} --features supervision-cli

      - name: Build stasis_graphics runtime (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $buildDir = "runtime/build_ci"
          $generator = (& powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tools/windows/select-cmake-vs-generator.ps1).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Visual Studio generator detection failed." }
          cmake -S runtime -B $buildDir -G $generator -A x64 `
            -DSTASIS_GRAPHICS_BUNDLE_SDL=ON `
            -DSTASIS_GRAPHICS_BUILD_SHARED=ON `
            -DSTASIS_GRAPHICS_BUILD_STATIC=OFF `
            -DSTASIS_RELEASE_ID="${{ needs.detect.outputs.nightly_tag }}" `
            -DSTASIS_BUILD_FINGERPRINT="$env:STASIS_BUILD_FINGERPRINT" `
            -DSTASIS_MOBILE_RUNTIME_BUILD_TESTS=ON `
            -DSTASIS_BUILD_MOBILE_RUNTIME=ON `
            -DSTASIS_BUILD_RUNNER=ON `
            -DSTASIS_BUILD_SYS=OFF

          cmake --build $buildDir --config Release --target stasis_graphics stasis_runner stasis_mobile_runtime stasis_render_contract_test stasis_asset_path_test
          if ($LASTEXITCODE -ne 0) { throw "Windows runtime targets failed to build" }
          ctest --test-dir $buildDir -C Release -R "stasis_(render_command|asset_path)_contract" --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Windows runtime contract checks failed" }
          $exportLibDir = "$buildDir/export/lib"
          New-Item -ItemType Directory -Force -Path $exportLibDir | Out-Null
          foreach ($name in @("stasis_mobile_runtime.lib", "SDL3-static.lib", "SDL3_image-static.lib", "stasis_thorvg.lib")) {
            $matches = @(Get-ChildItem -Path $buildDir -Recurse -File -Filter $name | Where-Object { $_.FullName -notlike "*$([IO.Path]::DirectorySeparatorChar)export$([IO.Path]::DirectorySeparatorChar)*" })
            if ($matches.Count -eq 0) { throw "Prebuilt Windows monolith runtime did not produce $name" }
            $releaseMatches = @($matches | Where-Object { $_.FullName -match "[\\/]Release[\\/]" })
            $artifact = if ($releaseMatches.Count -gt 0) { $releaseMatches[0] } else { $matches[0] }
            Copy-Item $artifact.FullName (Join-Path $exportLibDir $name) -Force
          }
          $exportIncludeDir = "$buildDir/export/include"
          New-Item -ItemType Directory -Force -Path $exportIncludeDir | Out-Null
          foreach ($headerDir in @(
            "runtime/build_ci/_deps/stasis_sdl3-src/include/SDL3",
            "runtime/build_ci/_deps/stasis_sdl3_image-src/include/SDL3_image"
          )) {
            if (-not (Test-Path $headerDir)) { throw "Prebuilt Windows monolith headers are missing: $headerDir" }
            Copy-Item -LiteralPath $headerDir -Destination $exportIncludeDir -Recurse -Force
          }

      - name: Build stasis_graphics runtime (unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S runtime -B runtime/build_ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTASIS_GRAPHICS_BUILD_SHARED=ON \
            -DSTASIS_GRAPHICS_BUILD_STATIC=OFF \
            -DSTASIS_GRAPHICS_BUNDLE_SDL=ON \
            -DSTASIS_BUILD_RUNNER=ON \
            -DSTASIS_BUILD_SYS=OFF \
            -DSTASIS_RELEASE_ID="${{ needs.detect.outputs.nightly_tag }}" \
            -DSTASIS_BUILD_FINGERPRINT="${STASIS_BUILD_FINGERPRINT}"
          cmake --build runtime/build_ci --config Release --target stasis_graphics stasis_runner
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            test "$(plutil -extract NSHighResolutionCapable raw runtime/build_ci/bin/Release/stasis_runner.app/Contents/Info.plist)" = "true"
          fi

      - name: Assemble bundle (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          out="dist/${{ matrix.archive }}"
          mkdir -p "${out}/bin"
          cp "target/${{ matrix.rust_target }}/release/stasis" "${out}/bin/"
          cp "target/${{ matrix.rust_target }}/release/libstasis_dynload.a" "${out}/bin/"
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            graphics_dylib=runtime/build_ci/bin/Release/libstasis_graphics.dylib
            if [[ ! -f "${graphics_dylib}" ]]; then
              graphics_dylib=runtime/build_ci/bin/libstasis_graphics.dylib
            fi
            test -f "${graphics_dylib}"
            cp "${graphics_dylib}" "${out}/bin/"
            cp -R runtime/build_ci/bin/Release/stasis_runner.app "${out}/bin/"
          else
            cp runtime/build_ci/bin/libstasis_graphics.so "${out}/bin/"
            cp runtime/build_ci/bin/Release/stasis_runner "${out}/bin/"
          fi
          cp README.md "${out}/"
          cp LICENSE "${out}/"
          # Ship the stdlib + samples so relative imports keep working in the bundle.
          cp -R src "${out}/"
          python3 tools/copy_release_samples.py --source samples --destination "${out}/samples"
          mkdir -p "${out}/mobile"
          cp -R mobile/shells "${out}/mobile/"
          test -f mobile/android-runtime/arm64-v8a/manifest.json
          cp -R mobile/android-runtime "${out}/mobile/"
          test -f mobile/network/include/stasis_network.h
          test -f mobile/network/android-arm64/libstasis_network_v1.so
          test -f mobile/network/android-x86_64/libstasis_network_v1.so
          cp -R mobile/network "${out}/mobile/"
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            network_target=macos-arm64
            network_shared=libstasis_network.dylib
          else
            network_target=linux-x86_64
            network_shared=libstasis_network.so
          fi
          mkdir -p "${out}/desktop/network/${network_target}" "${out}/desktop/network/include"
          cp "build/codex-cargo-target/${{ matrix.rust_target }}/release/${network_shared}" "${out}/desktop/network/${network_target}/"
          cp crates/stasis_network/include/stasis_network.h "${out}/desktop/network/include/"
          mkdir -p "${out}/runtime"
          cp runtime/CMakeLists.txt runtime/MINIMP3-LICENSE.txt runtime/minimp3.h runtime/minimp3_ex.h runtime/cJSON.c runtime/cJSON.h runtime/stasis_svg.cpp runtime/stasis_svg.h runtime/stasis_asset_path.h runtime/stasis_display_scale.h runtime/stasis_render_contract.h runtime/stasis_renderer_lifecycle.h runtime/stasis_performance_metrics.h runtime/stasis_package_provenance_reader.h runtime/stasis_audio_assets.c runtime/stasis_audio_assets.h runtime/stasis_recording_audio.h runtime/stasis_graphics.c runtime/stasis_mixed_quad_planner.h runtime/stasis_sprite_atlas_policy.h runtime/stasis_image_writer.c runtime/stasis_image_writer.h runtime/stasis_runner.manifest runtime/stasis_runner_macos.plist.in runtime/stasis_mobile_aot_runtime.c runtime/stasis_mobile_aot_runtime.h runtime/stasis_mobile_runtime.c runtime/stasis_mobile_runtime.h runtime/stasis_replay_consumer.c runtime/stasis_replay_consumer.h runtime/stasis_network_join_card.h runtime/stasis_platform_storage.c runtime/stasis_platform_storage.h runtime/stasis_platform_services.c runtime/stasis_platform_services.h runtime/stb_truetype.h "${out}/runtime/"
          cp -R runtime/third_party "${out}/runtime/"
          mkdir -p "${out}/docs"
          cp docs/agent_workflow.md docs/mobile_packaging.md docs/mobile_packaging_abi.md docs/mobile_aot_artifacts.md docs/release_provenance.md docs/sdl3_migration.md docs/web_packaging.md docs/web_ads.md "${out}/docs/"
          cp -R docs/knowledge "${out}/docs/"
          python3 tools/generate_release_provenance.py \
            --archive-root "${out}" \
            --release-tag "${{ needs.detect.outputs.nightly_tag }}" \
            --source-commit "${{ github.sha }}" \
            --compiler "bin/stasis" \
            --dependency "sdl3=3.4.10-static" \
            --dependency "sdl3_image=3.4.4-static"
          tar -C dist -czf "dist/${{ matrix.archive }}.${{ matrix.ext }}" "${{ matrix.archive }}"
          python3 tools/audit_release_bundle.py \
            --root "${out}" \
            --platform "${{ matrix.bundle_platform }}" \
            --archive "dist/${{ matrix.archive }}.${{ matrix.ext }}" \
            --output "bundle-audit/${{ matrix.archive }}.json" \
            --max-archive-bytes 41943040

      - name: Assemble bundle (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "dist/${{ matrix.archive }}"
          New-Item -ItemType Directory -Force -Path "$out/bin" | Out-Null
          Copy-Item "target/${{ matrix.rust_target }}/release/stasis.exe" "$out/" -Force
          Copy-Item "target/${{ matrix.rust_target }}/release/stasis_dynload.dll" "$out/" -Force
          Copy-Item "target/${{ matrix.rust_target }}/release/stasis_dynload.dll.lib" "$out/" -Force
          # Keep the runtime DLL beside stasis.exe so `stasis.exe play ...` works from the archive root.
          Copy-Item "runtime/build_ci/bin/Release/*.dll" "$out/" -Force
          Copy-Item "runtime/build_ci/bin/Release/stasis_runner.exe" "$out/" -Force
          Copy-Item README.md "$out/" -Force
          Copy-Item LICENSE "$out/" -Force
          Copy-Item THIRD_PARTY_NOTICES.md "$out/" -Force
          New-Item -ItemType Directory -Force -Path "$out/tools/windows" | Out-Null
          Copy-Item tools/windows/stasis-signing.ps1 "$out/tools/windows/" -Force
          # Ship the stdlib + samples so relative imports keep working in the bundle.
          Copy-Item src "$out/" -Recurse -Force
          python tools/copy_release_samples.py --source samples --destination "$out/samples"
          New-Item -ItemType Directory -Force -Path "$out/mobile" | Out-Null
          Copy-Item mobile/shells "$out/mobile/" -Recurse -Force
          if (-not (Test-Path "mobile/android-runtime/arm64-v8a/manifest.json")) { throw "prebuilt Android runtime manifest missing" }
          Copy-Item mobile/android-runtime "$out/mobile/" -Recurse -Force
          @(
            "mobile/network/include/stasis_network.h",
            "mobile/network/android-arm64/libstasis_network_v1.so",
            "mobile/network/android-x86_64/libstasis_network_v1.so"
          ) | ForEach-Object {
            if (-not (Test-Path $_)) { throw "mobile network support missing: $_" }
          }
          Copy-Item mobile/network "$out/mobile/" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$out/desktop/network/windows-x86_64", "$out/desktop/network/include" | Out-Null
          Copy-Item -Path "build/codex-cargo-target/${{ matrix.rust_target }}/release/stasis_network.dll", "build/codex-cargo-target/${{ matrix.rust_target }}/release/stasis_network.dll.lib" -Destination "$out/desktop/network/windows-x86_64/" -ErrorAction Stop
          Copy-Item crates/stasis_network/include/stasis_network.h "$out/desktop/network/include/" -ErrorAction Stop
          Copy-Item "build/codex-cargo-target/${{ matrix.rust_target }}/release/stasis-network-supervise.exe" "$out/" -ErrorAction Stop
          Copy-Item tools/diagnose_desktop_network.ps1 "$out/tools/" -ErrorAction Stop
          New-Item -ItemType Directory -Force -Path "$out/runtime" | Out-Null
          @('CMakeLists.txt', 'MINIMP3-LICENSE.txt', 'minimp3.h', 'minimp3_ex.h', 'cJSON.c', 'cJSON.h', 'stasis_svg.cpp', 'stasis_svg.h', 'stasis_asset_path.h', 'stasis_display_scale.h', 'stasis_render_contract.h', 'stasis_renderer_lifecycle.h', 'stasis_performance_metrics.h', 'stasis_package_provenance_reader.h', 'stasis_audio_assets.c', 'stasis_audio_assets.h', 'stasis_recording_audio.h', 'stasis_graphics.c', 'stasis_mixed_quad_planner.h', 'stasis_sprite_atlas_policy.h', 'stasis_image_writer.c', 'stasis_image_writer.h', 'stasis_runner.manifest', 'stasis_runner_macos.plist.in', 'stasis_mobile_aot_runtime.c', 'stasis_mobile_aot_runtime.h', 'stasis_mobile_runtime.c', 'stasis_mobile_runtime.h', 'stasis_replay_consumer.c', 'stasis_replay_consumer.h', 'stasis_network_join_card.h', 'stasis_platform_storage.c', 'stasis_platform_storage.h', 'stasis_platform_services.c', 'stasis_platform_services.h', 'stb_truetype.h') | ForEach-Object { Copy-Item "runtime/$_" "$out/runtime/" -Force }
          Copy-Item "runtime/third_party" "$out/runtime/" -Recurse -Force
          $prebuiltRuntimeLibDir = "$out/runtime/prebuilt/windows-x64/lib"
          New-Item -ItemType Directory -Force -Path $prebuiltRuntimeLibDir | Out-Null
          Copy-Item "runtime/build_ci/export/lib/*.lib" $prebuiltRuntimeLibDir -Force
          $prebuiltRuntimeIncludeDir = "$out/runtime/prebuilt/windows-x64/include"
          New-Item -ItemType Directory -Force -Path $prebuiltRuntimeIncludeDir | Out-Null
          Copy-Item "runtime/build_ci/export/include/*" $prebuiltRuntimeIncludeDir -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$out/docs" | Out-Null
          Copy-Item docs/agent_workflow.md,docs/mobile_packaging.md,docs/mobile_packaging_abi.md,docs/mobile_aot_artifacts.md,docs/release_provenance.md,docs/sdl3_migration.md,docs/network_supervision.md,docs/web_packaging.md,docs/web_ads.md "$out/docs/" -Force
          Copy-Item docs/knowledge "$out/docs/knowledge" -Recurse -Force
          python tools/ci/windows_signing_manifest.py create `
            --root "$out" `
            --receipt "$out/stasis_windows_signing.json" `
            --source-commit "${{ github.sha }}"
          python tools/generate_release_provenance.py `
            --archive-root "$out" `
            --release-tag "${{ needs.detect.outputs.nightly_tag }}" `
            --source-commit "${{ github.sha }}" `
            --compiler "stasis.exe" `
            --dependency "sdl3=3.4.10-static" `
            --dependency "sdl3_image=3.4.4-static"
          Compress-Archive -Path "$out/*" -DestinationPath "dist/${{ matrix.archive }}.${{ matrix.ext }}" -Force
          python tools/audit_release_bundle.py `
            --root "$out" `
            --platform "${{ matrix.bundle_platform }}" `
            --archive "dist/${{ matrix.archive }}.${{ matrix.ext }}" `
            --output "bundle-audit/${{ matrix.archive }}.json" `
            --max-archive-bytes 41943040

      - name: Verify extracted Windows editor toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 15
        run: |
          $validationRoot = "build/network-supervision-release"
          Expand-Archive -LiteralPath "dist/${{ matrix.archive }}.${{ matrix.ext }}" -DestinationPath $validationRoot -Force
          @(
            "$validationRoot/stasis.exe",
            "$validationRoot/stasis_graphics.dll",
            "$validationRoot/stasis_dynload.dll",
            "$validationRoot/src/stdlib",
            "$validationRoot/stasis_release_provenance.json",
            "$validationRoot/stasis_windows_signing.json"
          ) | ForEach-Object {
            if (-not (Test-Path $_)) { throw "extracted Windows editor toolchain is missing $_" }
          }
          $editorInfoJson = & "$validationRoot/stasis.exe" --json editor-info
          if ($LASTEXITCODE -ne 0) { throw "extracted editor-info probe failed" }
          $editorInfo = $editorInfoJson | ConvertFrom-Json
          if (-not $editorInfo.ok) { throw "extracted editor-info probe failed" }
          if ($editorInfo.result.release_id -ne "${{ needs.detect.outputs.nightly_tag }}") { throw "extracted editor release ID mismatch" }
          if ($editorInfo.result.source_commit -ne "${{ github.sha }}") { throw "extracted editor source commit mismatch" }
          if ($editorInfo.result.build_fingerprint -ne $editorInfo.result.graphics_runtime.build_fingerprint) { throw "extracted editor fingerprint mismatch" }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/test_network_supervision.ps1 `
            -Toolchain "$validationRoot/stasis.exe" `
            -Supervisor "$validationRoot/stasis-network-supervise.exe" `
            -InstalledToolchain

      - name: Smoke test bundled graphics runtime (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item Env:STASIS_RUNTIME_DLL_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:LIB -ErrorAction SilentlyContinue
          Remove-Item Env:CC -ErrorAction SilentlyContinue
          $checkoutRoot = (Get-Location).Path
          $repoNetworkSource = Join-Path $checkoutRoot "crates/stasis_network"
          $repoNetworkBackup = Join-Path $env:RUNNER_TEMP ("stasis-network-source-backup-" + [guid]::NewGuid().ToString())
          Push-Location "dist/${{ matrix.archive }}"
          try {
            .\stasis.exe probe-graphics-runtime
            .\stasis.exe --json editor-info
            .\stasis.exe live --help
            & .\samples\windows_launch_smoke\verify.ps1 -Toolchain (Resolve-Path .\stasis.exe) -ArtifactRoot (Join-Path (Get-Location) 'windows-launch-evidence')
            .\stasis.exe new ci_smoke --dir cli-smoke
            .\stasis.exe --workspace cli-smoke check
            .\stasis.exe --workspace cli-smoke test
            .\stasis.exe --workspace cli-smoke build --mode release
            $smokeProcess = Start-Process -FilePath ".\cli-smoke\build\ci_smoke.exe" -PassThru
            try {
              if ($smokeProcess.WaitForExit(5000)) {
                if ($smokeProcess.ExitCode -ne 0) { throw "ci_smoke exited early with code $($smokeProcess.ExitCode)" }
              } else {
                Stop-Process -Id $smokeProcess.Id -Force -ErrorAction SilentlyContinue
                $smokeProcess.WaitForExit()
              }
            } finally {
              if (-not $smokeProcess.HasExited) {
                Stop-Process -Id $smokeProcess.Id -Force -ErrorAction SilentlyContinue
                $smokeProcess.WaitForExit()
              }
              $smokeProcess.Dispose()
            }
            Set-Content -Path "cli-smoke/src/main.stasis" -Encoding ASCII -Value @(
              "function main(): i32 { return 0; }",
              "function tick(): i32 { return 0; }",
              "function render(): i32 { return 0; }"
            )
            New-Item -ItemType Directory -Force -Path "cli-smoke/assets" | Out-Null
            Set-Content -Path "cli-smoke/assets/manifest.json" -Encoding ASCII -Value '{"schema":"stasis-assets","version":1,"assets":[]}'
            python (Join-Path $checkoutRoot "tools/ci/add_smoke_android_launcher.py") cli-smoke
            python (Join-Path $checkoutRoot "tools/ci/check_package_time.py") `
              --label "Windows desktop" --max-seconds 60 `
              --expect-output "cli-smoke/dist/ci_smoke-desktop/ci_smoke.exe" `
              --expect-log "using prebuilt Windows runtime" -- `
              .\stasis.exe --workspace cli-smoke package --target desktop
            if ($LASTEXITCODE -ne 0) { throw "Windows desktop packaging benchmark failed" }
            python (Join-Path $checkoutRoot "tools/ci/check_package_time.py") `
              --label "Windows desktop repeat" --max-seconds 60 `
              --expect-output "cli-smoke/dist/benchmark-repeat/ci_smoke.exe" `
              --expect-log "using prebuilt Windows runtime" -- `
              .\stasis.exe --workspace cli-smoke package --target desktop --out dist/benchmark-repeat
            if ($LASTEXITCODE -ne 0) { throw "Repeated Windows desktop packaging benchmark failed" }
            if (-not (Test-Path "cli-smoke/dist/ci_smoke-desktop/ci_smoke.exe")) { throw "game package executable missing" }
            if (-not (Test-Path "cli-smoke/dist/ci_smoke-desktop/app/stasis.json")) { throw "game package manifest missing" }
            if (-not (Test-Path "cli-smoke/dist/ci_smoke-desktop/app/stasis_provenance.json")) { throw "game package provenance missing" }
            if (Test-Path "cli-smoke/dist/ci_smoke-desktop/app/ci_smoke.dll") { throw "obsolete game package library present; monolithic Windows package must not contain app/ci_smoke.dll" }
            .\stasis.exe --workspace cli-smoke package-mobile --target android-arm64 --out dist/android
            .\stasis.exe --workspace cli-smoke package-mobile --target ios-arm64 --out dist/ios
            Move-Item $repoNetworkSource $repoNetworkBackup -Force
            if (-not (Test-Path "cli-smoke/dist/android/android/app/src/main/cpp/CMakeLists.txt")) { throw "Android mobile shell missing" }
            if (-not (Test-Path "cli-smoke/dist/ios/ios/StasisMobile.xcodeproj/project.pbxproj")) { throw "iOS mobile shell missing" }
            $networkManifest = Get-Content "cli-smoke/stasis.json" -Raw | ConvertFrom-Json
            $networkManifest | Add-Member -Force -MemberType NoteProperty -Name capabilities -Value ([pscustomobject]@{ network = $true })
            $networkManifest | Add-Member -Force -MemberType NoteProperty -Name libraries -Value ([pscustomobject]@{ selections = [pscustomobject]@{ 'stasis.network' = [pscustomobject]@{ features = @('host') } } })
            $networkManifest | Add-Member -Force -MemberType NoteProperty -Name web -Value ([pscustomobject]@{ entry = "src/main.stasis" })
            $networkManifest | ConvertTo-Json -Depth 8 | Set-Content "cli-smoke/stasis.json"
            .\stasis.exe --workspace cli-smoke package-mobile --target android-arm64 --out dist/network-android
            $networkReceipt = Get-Content "cli-smoke/dist/network-android/stasis_mobile_package.json" -Raw | ConvertFrom-Json
            if (-not $networkReceipt.network) { throw "network Android receipt did not enable network" }
            if (-not (Test-Path "cli-smoke/dist/network-android/android/app/src/main/cpp/network/libstasis_network_v1.so")) { throw "bundled Android network shared library missing" }
            if (-not (Test-Path "cli-smoke/dist/network-android/android/app/src/main/cpp/network/include/stasis_network.h")) { throw "bundled Android network header missing" }
            if (-not (Test-Path "cli-smoke/dist/network-android/android/app/src/main/assets/stasis_game/network_guest.bundle")) { throw "Android guest bundle missing" }
            $networkIosError = .\stasis.exe --workspace cli-smoke package-mobile --target ios-arm64 --out dist/network-ios 2>&1
            if ($LASTEXITCODE -eq 0) { throw "network-enabled iOS packaging unexpectedly succeeded without macOS/Xcode support" }
            if (-not ($networkIosError -match "requires a macOS host with Xcode")) { throw "unexpected network iOS error: $networkIosError" }
          } finally {
            if (Test-Path $repoNetworkBackup) {
              Move-Item $repoNetworkBackup $repoNetworkSource -Force
            }
            Pop-Location
          }
          python tools/verify_package_provenance.py --release-root "dist/${{ matrix.archive }}" --package-root "dist/${{ matrix.archive }}/cli-smoke/dist/ci_smoke-desktop/app" --expect-desktop-package
          python tools/verify_package_provenance.py --release-root "dist/${{ matrix.archive }}" --package-root "dist/${{ matrix.archive }}/cli-smoke/dist/android" --expect-runtime-sources
          python tools/verify_package_provenance.py --release-root "dist/${{ matrix.archive }}" --package-root "dist/${{ matrix.archive }}/cli-smoke/dist/ios" --expect-runtime-sources
          python tools/verify_package_provenance.py --release-root "dist/${{ matrix.archive }}" --package-root "dist/${{ matrix.archive }}/cli-smoke/dist/network-android" --expect-runtime-sources

      - name: Qualify extracted Windows native client package
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = "Stop"
          $checkoutRoot = (Get-Location).Path
          $repoNetworkSource = Join-Path $checkoutRoot "crates/stasis_network"
          $repoNetworkBackup = Join-Path $env:RUNNER_TEMP ("stasis-network-client-source-backup-" + [guid]::NewGuid().ToString())
          try {
            Move-Item $repoNetworkSource $repoNetworkBackup -Force
            powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/test_windows_desktop_network_client_package.ps1 `
              -Toolchain "build/network-supervision-release/stasis.exe" `
              -InstalledToolchain
            if ($LASTEXITCODE -ne 0) { throw "extracted Windows native client package qualification failed" }
          } finally {
            if (Test-Path $repoNetworkBackup) {
              Move-Item $repoNetworkBackup $repoNetworkSource -Force
            }
          }

      - name: Smoke test bundled CLI (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          repo_root="$(pwd)"
          network_source_backup="$(mktemp -d)"
          restore_network_source() {
            if [[ -d "${network_source_backup}/stasis_network" ]]; then
              mv "${network_source_backup}/stasis_network" "${repo_root}/crates/stasis_network"
            fi
          }
          trap restore_network_source EXIT
          pushd "dist/${{ matrix.archive }}"
          ./bin/stasis --json editor-info
          ./bin/stasis live --help
          ./bin/stasis new ci_smoke --dir cli-smoke
          ./bin/stasis --workspace cli-smoke check
          ./bin/stasis --workspace cli-smoke test
          ./bin/stasis --workspace cli-smoke build --mode release
          smoke_executable="./cli-smoke/build/ci_smoke"
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            smoke_executable="./cli-smoke/build/ci_smoke.app/Contents/MacOS/ci_smoke"
          fi
          smoke_driver=(python3)
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            smoke_driver=(xvfb-run -a python3)
          fi
          "${smoke_driver[@]}" - "${smoke_executable}" <<'PY'
          import subprocess
          import sys

          process = subprocess.Popen([sys.argv[1]])
          try:
              return_code = process.wait(timeout=5)
          except subprocess.TimeoutExpired:
              process.terminate()
              try:
                  process.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.wait()
          else:
              if return_code != 0:
                  raise SystemExit(f"ci_smoke exited early with code {return_code}")
          PY
          printf '%s\n' \
            'function main(): i32 { return 0; }' \
            'function tick(): i32 { return 0; }' \
            'function render(): i32 { return 0; }' > cli-smoke/src/main.stasis
          mkdir -p cli-smoke/assets
          printf '%s\n' '{"schema":"stasis-assets","version":1,"assets":[]}' > cli-smoke/assets/manifest.json
          python3 "${repo_root}/tools/ci/add_smoke_android_launcher.py" cli-smoke
          package_executable="cli-smoke/dist/ci_smoke-desktop/ci_smoke"
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            package_executable="cli-smoke/dist/ci_smoke-desktop/ci_smoke.app/Contents/MacOS/ci_smoke"
          fi
          python3 "${repo_root}/tools/ci/check_package_time.py" \
            --label "${RUNNER_OS} desktop" --max-seconds 120 \
            --expect-output "${package_executable}" -- \
            ./bin/stasis --workspace cli-smoke package --target desktop
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            python3 "${repo_root}/tools/ci/check_package_time.py" \
              --label "Linux Android arm64" --max-seconds 120 \
              --expect-output "cli-smoke/dist/android/android/app/src/main/cpp/CMakeLists.txt" -- \
              ./bin/stasis --workspace cli-smoke package --target android-arm64 --out dist/android
            python3 "${repo_root}/tools/ci/check_package_time.py" \
              --label "Linux web" --max-seconds 120 \
              --expect-log "wasm-opt -Oz" \
              --expect-output "cli-smoke/dist/web/index.html" -- \
              ./bin/stasis --workspace cli-smoke package --target web --out dist/web
          else
            ./bin/stasis --workspace cli-smoke package-mobile --target android-arm64 --out dist/android
          fi
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            python3 "${repo_root}/tools/ci/check_package_time.py" \
              --label "macOS iOS arm64" --max-seconds 120 \
              --expect-output "cli-smoke/dist/ios/ios/StasisMobile.xcodeproj/project.pbxproj" -- \
              ./bin/stasis --workspace cli-smoke package-mobile --target ios-arm64 --out dist/ios
          else
            ./bin/stasis --workspace cli-smoke package-mobile --target ios-arm64 --out dist/ios
          fi
          mv "${repo_root}/crates/stasis_network" "${network_source_backup}/"
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("cli-smoke/stasis.json")
          manifest = json.loads(path.read_text())
          manifest["capabilities"] = {"network": True}
          manifest["libraries"] = {
              "selections": {"stasis.network": {"features": ["host"]}}
          }
          manifest["web"] = {"entry": "src/main.stasis"}
          path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          ./bin/stasis --workspace cli-smoke package --target desktop --out dist/network-desktop
          test -f cli-smoke/dist/network-desktop/network_guest.bundle
          test -f cli-smoke/dist/network-desktop/network_guest.bundle.json
          python3 "${repo_root}/tools/verify_package_provenance.py" --release-root . --package-root cli-smoke/dist/network-desktop --expect-desktop-package
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            python3 "${repo_root}/tools/ci/test_linux_desktop_network_package.py" --executable cli-smoke/dist/network-desktop/ci_smoke --result cli-smoke/network-desktop-result.json
          fi
          ./bin/stasis --workspace cli-smoke package-mobile --target android-arm64 --out dist/network-android
          test -f cli-smoke/dist/network-android/android/app/src/main/cpp/network/libstasis_network_v1.so
          test -f cli-smoke/dist/network-android/android/app/src/main/cpp/network/include/stasis_network.h
          test -f cli-smoke/dist/network-android/android/app/src/main/assets/stasis_game/network_guest.bundle
          if [[ "${RUNNER_OS}" != "macOS" ]]; then
            set +e
            network_ios_error="$(./bin/stasis --workspace cli-smoke package-mobile --target ios-arm64 --out dist/network-ios 2>&1)"
            network_ios_status=$?
            set -e
            test "${network_ios_status}" -ne 0
            grep -q "requires a macOS host with Xcode" <<<"${network_ios_error}"
          fi
          restore_network_source
          trap - EXIT
          rmdir "${network_source_backup}"
          popd
          python3 tools/verify_package_provenance.py --release-root "dist/${{ matrix.archive }}" --package-root "dist/${{ matrix.archive }}/cli-smoke/dist/ci_smoke-desktop" --expect-desktop-package
          python3 tools/verify_package_provenance.py --release-root "dist/${{ matrix.archive }}" --package-root "dist/${{ matrix.archive }}/cli-smoke/dist/android" --expect-runtime-sources
          python3 tools/verify_package_provenance.py --release-root "dist/${{ matrix.archive }}" --package-root "dist/${{ matrix.archive }}/cli-smoke/dist/ios" --expect-runtime-sources
          python3 tools/verify_package_provenance.py --release-root "dist/${{ matrix.archive }}" --package-root "dist/${{ matrix.archive }}/cli-smoke/dist/network-android" --expect-runtime-sources

      - name: Upload packaged artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: ${{ matrix.bundle_platform == 'windows' && 'stasis-nightly-win-x64-unsigned' || matrix.archive }}
          path: dist/${{ matrix.archive }}.${{ matrix.ext }}
          if-no-files-found: error

  windows_signing:
    needs: [detect, build]
    if: needs.detect.outputs.should_release == 'true' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    environment: windows-release-signing
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the trusted current main commit
        id: trusted_main
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF -ne "refs/heads/main") {
            throw "Windows release signing is restricted to refs/heads/main"
          }
          $remoteMain = ((git ls-remote origin refs/heads/main) -split "\s+")[0]
          if ($remoteMain -notmatch "^[0-9a-f]{40}$") {
            throw "Could not resolve the current origin/main commit"
          }
          if ($env:GITHUB_SHA -ne $remoteMain) {
            throw "Windows release signing requires the exact current origin/main commit"
          }
          "source_commit=$remoteMain" >> $env:GITHUB_OUTPUT

      - name: Download unsigned Windows toolchain
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stasis-nightly-win-x64-unsigned
          path: unsigned

      - name: Validate unsigned signing manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "dist/stasis-nightly-win-x64"
          Expand-Archive -LiteralPath "unsigned/stasis-nightly-win-x64.zip" -DestinationPath $out -Force
          python tools/ci/windows_signing_manifest.py list `
            --root $out `
            --receipt "$out/stasis_windows_signing.json"
          if ($LASTEXITCODE -ne 0) { throw "Unsigned Windows signing manifest validation failed" }

      - name: Reconfirm trusted current main immediately before signing
        id: trusted_main_final
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF -ne "refs/heads/main") {
            throw "Windows release signing is restricted to refs/heads/main"
          }
          $remoteMain = ((git ls-remote origin refs/heads/main) -split "\s+")[0]
          if ($remoteMain -notmatch "^[0-9a-f]{40}$") {
            throw "Could not resolve the current origin/main commit immediately before signing"
          }
          if ($env:GITHUB_SHA -ne $remoteMain) {
            throw "Windows release signing requires the exact current origin/main commit immediately before signing"
          }
          "source_commit=$remoteMain" >> $env:GITHUB_OUTPUT

      - name: Sign trusted Windows release files
        shell: pwsh
        env:
          STASIS_SIGNING_PFX_BASE64: ${{ secrets.STASIS_SIGNING_PFX_BASE64 }}
          STASIS_SIGNING_PFX_PASSWORD: ${{ secrets.STASIS_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:STASIS_SIGNING_PFX_BASE64) { throw "STASIS_SIGNING_PFX_BASE64 is not configured" }
          if (-not $env:STASIS_SIGNING_PFX_PASSWORD) { throw "STASIS_SIGNING_PFX_PASSWORD is not configured" }
          $out = "dist/stasis-nightly-win-x64"
          $receipt = "$out/stasis_windows_signing.json"
          $signingRoot = Join-Path $env:RUNNER_TEMP "stasis-production-signing"
          $certificate = Join-Path $signingRoot "stasis-release.pfx"
          $identity = Join-Path $signingRoot "identity.json"
          try {
            New-Item -ItemType Directory -Force -Path $signingRoot | Out-Null
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:STASIS_SIGNING_PFX_BASE64))
            & pwsh -NoProfile -NonInteractive -File tools/windows/stasis-signing-identity.ps1 `
              -Certificate $certificate `
              -ExpectedThumbprint "67132CE8553062F2145A1EBD7A88166910CDA7A6" | Set-Content -LiteralPath $identity -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw "Pinned Windows signing identity validation failed" }
            $env:STASIS_SIGNING_CERTIFICATE = $certificate
            $env:STASIS_SIGNING_PROFILE = "production"
            $env:STASIS_SIGNING_ALLOW_PINNED_SELF_SIGNED_VERIFY = "1"
            $env:STASIS_SIGNING_TIMEOUT_SECONDS = "60"
            $env:STASIS_SIGNING_TIMESTAMP_URLS = "http://timestamp.digicert.com;http://timestamp.acs.microsoft.com"
            $signingArtifacts = @(python tools/ci/windows_signing_manifest.py list --root $out --receipt $receipt)
            if ($LASTEXITCODE -ne 0 -or $signingArtifacts.Count -eq 0) { throw "Windows signing manifest produced no inputs" }
            foreach ($artifact in $signingArtifacts) {
              & pwsh -NoProfile -NonInteractive -File tools/windows/stasis-signing.ps1 sign -Artifact $artifact
              if ($LASTEXITCODE -ne 0) { throw "Windows release signing failed: $artifact" }
            }
            python tools/ci/windows_signing_manifest.py finalize `
              --root $out `
              --receipt $receipt `
              --identity $identity `
              --source-commit "${{ steps.trusted_main_final.outputs.source_commit }}"
            if ($LASTEXITCODE -ne 0) { throw "Windows signing receipt generation failed" }
            python tools/generate_release_provenance.py `
              --archive-root $out `
              --release-tag "${{ needs.detect.outputs.nightly_tag }}" `
              --source-commit "${{ steps.trusted_main_final.outputs.source_commit }}" `
              --compiler "stasis.exe" `
              --dependency "sdl3=3.4.10-static" `
              --dependency "sdl3_image=3.4.4-static"
            Compress-Archive -Path "$out/*" -DestinationPath "dist/stasis-nightly-win-x64.zip" -Force
          } finally {
            Remove-Item -LiteralPath $signingRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Verify extracted signed Windows toolchain
        shell: pwsh
        env:
          STASIS_SIGNING_CERT_THUMBPRINT: 67132CE8553062F2145A1EBD7A88166910CDA7A6
          STASIS_SIGNING_PROFILE: production
          STASIS_SIGNING_ALLOW_PINNED_SELF_SIGNED_VERIFY: "1"
          STASIS_SIGNING_TIMEOUT_SECONDS: "60"
        run: |
          $ErrorActionPreference = "Stop"
          $validationRoot = "build/signed-windows-release"
          Expand-Archive -LiteralPath "dist/stasis-nightly-win-x64.zip" -DestinationPath $validationRoot -Force
          $receipt = "$validationRoot/stasis_windows_signing.json"
          python tools/ci/windows_signing_manifest.py verify-files `
            --root $validationRoot `
            --receipt $receipt `
            --source-commit "${{ steps.trusted_main_final.outputs.source_commit }}" `
            --thumbprint $env:STASIS_SIGNING_CERT_THUMBPRINT
          if ($LASTEXITCODE -ne 0) { throw "Extracted Windows signing receipt validation failed" }
          python tools/audit_release_bundle.py `
            --root $validationRoot `
            --platform windows `
            --archive "dist/stasis-nightly-win-x64.zip" `
            --output "bundle-audit/stasis-nightly-win-x64-signed.json" `
            --max-archive-bytes 41943040
          if ($LASTEXITCODE -ne 0) { throw "Signed Windows release bundle audit failed" }
          $signedArtifacts = @(python tools/ci/windows_signing_manifest.py list --root $validationRoot --receipt $receipt)
          foreach ($artifact in $signedArtifacts) {
            & pwsh -NoProfile -NonInteractive -File tools/windows/stasis-signing.ps1 verify -Artifact $artifact
            if ($LASTEXITCODE -ne 0) { throw "Extracted Windows signature verification failed: $artifact" }
          }

      - name: Upload signed Windows toolchain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: stasis-nightly-win-x64
          path: dist/stasis-nightly-win-x64.zip
          if-no-files-found: error

  android_prebuilt_acceptance:
    needs: [detect, build]
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start cold-job timing
        shell: bash
        run: echo "ANDROID_COLD_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Restore matching nightly toolchain
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stasis-nightly-linux-x64
          path: target/android-prebuilt-acceptance
      - name: Record nightly restore timing
        shell: bash
        run: echo "ANDROID_RESTORE_FINISHED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: "8.9"
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools
      - name: Install web optimizer for network guests
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes binaryen
          wasm-opt --version
      - name: Build and audit prebuilt offline, host, and client APKs
        shell: bash
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          setup_finished="$(date +%s)"
          archive="$(find target/android-prebuilt-acceptance -name 'stasis-nightly-linux-x64.tar.gz' -print -quit)"
          test -n "${archive}"
          mkdir -p target/android-prebuilt-toolchain
          tar -xf "${archive}" -C target/android-prebuilt-toolchain
          toolchain="$(find target/android-prebuilt-toolchain -path '*/bin/stasis' -print -quit)"
          test -x "${toolchain}"
          sample="samples/mobile_storage_link"
          python3 - "${sample}" <<'PY'
          import base64, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest_path = root / "stasis.json"
          value = json.loads(manifest_path.read_text())
          value["android"] = {
              "application_id": "com.stasislang.androidruntimeacceptance",
              "label": "Android Runtime Acceptance",
              "orientation": "sensorLandscape",
              "version_code": 1,
              "version_name": "1.0",
              "launcher_resources": "branding/android/res",
          }
          manifest_path.write_text(json.dumps(value, indent=2) + "\n")
          resources = root / "branding/android/res"
          png = base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="
          )
          for density in ("mdpi", "hdpi", "xhdpi", "xxhdpi", "xxxhdpi"):
              destination = resources / f"mipmap-{density}/ic_launcher.png"
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(png)
          foreground = resources / "drawable/icon_foreground.png"
          foreground.parent.mkdir(parents=True, exist_ok=True)
          foreground.write_bytes(png)
          adaptive = resources / "mipmap-anydpi-v26/ic_launcher.xml"
          adaptive.parent.mkdir(parents=True, exist_ok=True)
          adaptive.write_text(
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '  <background android:drawable="@android:color/black" />\n'
              '  <foreground android:drawable="@drawable/icon_foreground" />\n'
              '</adaptive-icon>\n'
          )
          PY
          package_started="$(date +%s)"
          "${toolchain}" --workspace "${sample}" package-mobile --target android-arm64 --out dist/prebuilt-offline
          python3 - "${sample}/stasis.json" host <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          value = json.loads(path.read_text())
          value["manifest_version"] = 3
          value["capabilities"] = {"network": True}
          value["libraries"] = {
              "selections": {"stasis.network": {"features": ["host"]}}
          }
          value["web"] = {"entry": value["entry"]}
          path.write_text(json.dumps(value, indent=2) + "\n")
          PY
          "${toolchain}" --workspace "${sample}" package-mobile --target android-arm64 --out dist/prebuilt-host
          python3 - "${sample}/stasis.json" client <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          value = json.loads(path.read_text())
          value["manifest_version"] = 3
          value["capabilities"] = {"network_client": True}
          value["libraries"] = {
              "selections": {"stasis.network": {"features": ["client"]}}
          }
          value.pop("web", None)
          path.write_text(json.dumps(value, indent=2) + "\n")
          PY
          "${toolchain}" --workspace "${sample}" package-mobile --target android-arm64 --out dist/prebuilt-client
          for legacy_variant in legacy-v1-host legacy-v2-client; do
            python3 - "${sample}/stasis.json" "${legacy_variant}" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          value = json.loads(path.read_text())
          version, role = sys.argv[2].split("-")[1:]
          value["manifest_version"] = int(version[1:])
          value["capabilities"] = {"network" if role == "host" else "network_client": True}
          value.pop("libraries", None)
          if role == "host":
              value["web"] = {"entry": value["entry"]}
          else:
              value.pop("web", None)
          path.write_text(json.dumps(value, indent=2) + "\n")
          PY
            "${toolchain}" --workspace "${sample}" package-mobile --target android-arm64 --out "dist/prebuilt-${legacy_variant}"
          done
          package_finished="$(date +%s)"
          readelf="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "${readelf}"
          for variant in offline host client legacy-v1-host legacy-v2-client; do
            root="${sample}/dist/prebuilt-${variant}"
            runtime_variant="${variant##*-}"
            grep -Fq 'set(STASIS_ANDROID_RUNTIME_MODE "prebuilt")' "${root}/android/app/src/main/cpp/CMakeLists.txt"
            grep -Fq "set(STASIS_ANDROID_RUNTIME_VARIANT \"${runtime_variant}\")" "${root}/android/app/src/main/cpp/CMakeLists.txt"
            python3 tools/verify_package_provenance.py \
              --release-root "$(dirname "$(dirname "${toolchain}")")" \
              --package-root "${root}" \
              --expect-runtime-sources
            apk="${root}/android/app/build/outputs/apk/debug/app-debug.apk"
            python3 tools/ci/check_package_time.py \
              --label "Android ${variant} APK" --max-seconds 120 \
              --expect-output "${apk}" -- \
              gradle -p "${root}/android" :app:assembleDebug --no-daemon --max-workers=2 --console=plain
            test -f "${apk}"
            network_audit=()
            if [[ "${variant}" != "offline" ]]; then
              network_audit=(--network-enabled --readelf "${readelf}")
            fi
            python3 tools/ci/check_android_release_package.py --abi arm64-v8a --required-asset "" "${network_audit[@]}" "${apk}"
            "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/build-tools/35.0.0/apksigner" verify --verbose "${apk}"
          done
          build_finished="$(date +%s)"
          artifact_bytes="$(du -cb ${sample}/dist/prebuilt-*/android/app/build/outputs/apk/debug/app-debug.apk | tail -n1 | cut -f1)"
          {
            echo "### Prebuilt Android cold acceptance timing"
            echo ""
            echo "| Phase | Seconds |"
            echo "| --- | ---: |"
            echo "| Nightly artifact restore | $((ANDROID_RESTORE_FINISHED - ANDROID_COLD_STARTED)) |"
            echo "| Gradle + Android SDK/NDK setup | $((setup_finished - ANDROID_RESTORE_FINISHED)) |"
            echo "| package-mobile (five variants) | $((package_finished - package_started)) |"
            echo "| Gradle configure, CMake shell/AOT link, APK assembly, debug signing, audit | $((build_finished - package_finished)) |"
            echo "| Complete cold acceptance | $((build_finished - ANDROID_COLD_STARTED)) |"
            echo ""
            echo "Five debug APK bytes: ${artifact_bytes}"
            echo ""
            echo "This public acceptance reports hosted phase evidence; it does not claim the private consumer job is under 60 seconds."
          } >> "${GITHUB_STEP_SUMMARY}"

  vscode_extension:
    needs: [detect, build, windows_signing]
    if: needs.detect.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: stasis-nightly-linux-x64
            ext: tar.gz
            executable: bin/stasis
            vsce_target: linux-x64
          - os: windows-latest
            archive: stasis-nightly-win-x64
            ext: zip
            executable: stasis.exe
            vsce_target: win32-x64
          - os: macos-15
            archive: stasis-nightly-osx-arm64
            ext: tar.gz
            executable: bin/stasis
            vsce_target: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      STASIS_E2E_VSCODE_VERSION: "1.96.0"
      STASIS_TOOLCHAIN_DIR: ${{ github.workspace }}/target/vscode-nightly/${{ matrix.archive }}
      STASIS_TOOLCHAIN_EXECUTABLE: ${{ matrix.executable }}
      STASIS_E2E_EXECUTABLE: ${{ github.workspace }}/target/vscode-nightly/${{ matrix.archive }}/${{ matrix.executable }}
      STASIS_E2E_SCREENSHOT: ${{ github.workspace }}/target/vscode-e2e/frame.png
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: "24"
          cache: npm
          cache-dependency-path: vscode-stasis/package-lock.json

      - name: Install graphics and display dependencies (linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes xvfb libx11-dev
          libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
          libxss-dev libxtst-dev libxkbcommon-dev

      - name: Install graphics dependencies (macos)
        if: runner.os == 'macOS'
        run: brew install pkg-config

      - name: Download matching nightly toolchain
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.archive }}
          path: target/vscode-nightly

      - name: Extract and probe nightly toolchain
        shell: pwsh
        run: |
          $extractRoot = if ($env:RUNNER_OS -eq "Windows") {
            $env:STASIS_TOOLCHAIN_DIR
          } else {
            "target/vscode-nightly"
          }
          New-Item -ItemType Directory -Force $extractRoot | Out-Null
          tar -xf "target/vscode-nightly/${{ matrix.archive }}.${{ matrix.ext }}" -C $extractRoot
          if (-not (Test-Path $env:STASIS_E2E_EXECUTABLE)) { throw "toolchain executable missing" }
          & $env:STASIS_E2E_EXECUTABLE --json editor-info

      - name: Install extension dependencies
        working-directory: vscode-stasis
        run: npm ci

      - name: Test extension protocols
        working-directory: vscode-stasis
        run: npm test

      - name: Stamp nightly extension version
        working-directory: vscode-stasis
        run: npm version --no-git-tag-version "0.2.${{ github.run_number }}"

      - name: Test installed VSIX in VS Code
        if: runner.os == 'Linux'
        working-directory: vscode-stasis
        run: |
          mkdir -p ../target/vscode-e2e
          xvfb-run -a npm run test:e2e

      - name: Package platform VSIX
        working-directory: vscode-stasis
        run: npm run package -- --target ${{ matrix.vsce_target }}

      - name: Name platform VSIX
        shell: pwsh
        run: Move-Item vscode-stasis/.vsix/stasislang.stasis.vsix "vscode-stasis/.vsix/stasislang.stasis-${{ matrix.vsce_target }}.vsix" -Force

      - name: Assemble atomic editor release
        shell: pwsh
        run: |
          $releaseRoot = "target/stasis-editor-release-${{ matrix.vsce_target }}"
          node tools/assemble_editor_release.mjs `
            --vsix "vscode-stasis/.vsix/stasislang.stasis-${{ matrix.vsce_target }}.vsix" `
            --out $releaseRoot `
            --release-id "${{ needs.detect.outputs.nightly_tag }}" `
            --platform "${{ matrix.vsce_target }}"
          Compress-Archive -Path "$releaseRoot/*" -DestinationPath "target/stasis-editor-release-${{ matrix.vsce_target }}.zip" -Force
          $editorArchive = Get-Item "target/stasis-editor-release-${{ matrix.vsce_target }}.zip"
          if ($editorArchive.Length -gt 41943040) { throw "Editor archive exceeds 40 MiB: $($editorArchive.Length) bytes" }
          Write-Host "Editor archive: $($editorArchive.Length) bytes"

      - name: Upload atomic editor release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: stasis-editor-release-${{ matrix.vsce_target }}
          path: target/stasis-editor-release-${{ matrix.vsce_target }}.zip
          if-no-files-found: error

  staged_archive_desktop_acceptance:
    needs: [detect, build, windows_signing]
    if: ${{ always() && needs.detect.outputs.should_release == 'true' && needs.build.result == 'success' && (needs.windows_signing.result == 'success' || (github.ref != 'refs/heads/main' && needs.windows_signing.result == 'skipped')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
            archive: stasis-nightly-linux-x64
            ext: tar.gz
          - target: windows
            os: windows-2022
            archive: stasis-nightly-win-x64
            ext: zip
          - target: macos
            os: macos-15
            archive: stasis-nightly-osx-arm64
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: "24"

      - name: Install Linux desktop acceptance dependencies
        if: matrix.target == 'linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes xvfb pkg-config libx11-dev
          libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev
          libxtst-dev libxkbcommon-dev libegl1 libgl1-mesa-dri

      - name: Install macOS desktop acceptance dependencies
        if: matrix.target == 'macos'
        run: brew install pkg-config

      - name: Locate and verify hosted Chrome on Windows
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          STASIS_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          $chrome = switch ($env:STASIS_TARGET) {
            "windows" { "C:/Program Files/Google/Chrome/Application/chrome.exe" }
            default { throw "No staged Windows browser path is defined for $($env:STASIS_TARGET)" }
          }
          if (-not (Test-Path -LiteralPath $chrome -PathType Leaf)) {
            throw "Hosted Google Chrome is missing for $($env:STASIS_TARGET): $chrome"
          }
          $productVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($chrome).ProductVersion
          if ($productVersion -notmatch '^\d+(?:\.\d+){2,3}$') {
            throw "Unexpected Google Chrome executable product version for $($env:STASIS_TARGET): $productVersion"
          }
          $version = "Google Chrome $productVersion"
          Write-Host "Verified hosted Google Chrome ($($env:STASIS_TARGET)): $version"
          New-Item -ItemType Directory -Path "target/staged-acceptance" -Force | Out-Null
          Set-Content -LiteralPath "target/staged-acceptance/hosted-chrome-version.txt" -Value $version -Encoding utf8
          "STASIS_BROWSER_EXECUTABLE=$chrome" >> $env:GITHUB_ENV

      - name: Locate and verify hosted Chrome on Linux and macOS
        if: matrix.target != 'windows'
        shell: bash
        env:
          STASIS_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          trim_ascii_whitespace() {
            local value="$1"
            local edge
            while [[ -n "$value" ]]; do
              edge="${value:0:1}"
              case "$edge" in
                ' '|$'\t'|$'\n'|$'\r'|$'\v'|$'\f') value="${value:1}" ;;
                *) break ;;
              esac
            done
            while [[ -n "$value" ]]; do
              edge="${value:$((${#value} - 1)):1}"
              case "$edge" in
                ' '|$'\t'|$'\n'|$'\r'|$'\v'|$'\f') value="${value%?}" ;;
                *) break ;;
              esac
            done
            printf '%s' "$value"
          }
          is_branded_chrome_version() {
            [[ "$1" =~ ^Google\ Chrome(\ for\ Testing)?\ [0-9]+(\.[0-9]+){2,3}$ ]]
          }
          case "$STASIS_TARGET" in
            linux)
              candidates=(/usr/bin/google-chrome /usr/bin/google-chrome-stable /opt/google/chrome/chrome)
              for name in google-chrome google-chrome-stable; do
                if resolved="$(command -v "$name" 2>/dev/null)"; then
                  candidates+=("$resolved")
                fi
              done
              ;;
            macos) candidates=("/Applications/Google Chrome.app/Contents/MacOS/Google Chrome") ;;
            *) echo "No staged Unix browser path is defined for $STASIS_TARGET" >&2; exit 1 ;;
          esac
          chrome=""
          version=""
          for candidate in "${candidates[@]}"; do
            printf 'Google Chrome candidate: %s\n' "$candidate"
            if [[ ! -x "$candidate" ]]; then
              printf 'Candidate is missing or not executable: %s\n' "$candidate"
              continue
            fi
            if version_output="$("$candidate" --version 2>&1)"; then
              version_status=0
            else
              version_status=$?
            fi
            printf 'Google Chrome version probe: path=%s exit=%s raw=%q\n' \
              "$candidate" "$version_status" "$version_output"
            version_normalized="$(trim_ascii_whitespace "$version_output")"
            printf 'Google Chrome normalized version: %q\n' "$version_normalized"
            if [[ "$version_status" -ne 0 ]]; then
              continue
            fi
            if is_branded_chrome_version "$version_normalized"; then
              chrome="$candidate"
              version="$version_normalized"
              break
            fi
            printf 'Candidate did not report a branded Google Chrome version: %s\n' "$candidate"
          done
          if [[ -z "$chrome" ]]; then
            echo "::error::No executable branded Google Chrome was found for $STASIS_TARGET" >&2
            exit 1
          fi
          printf 'Verified hosted Google Chrome (%s): %s\n' "$STASIS_TARGET" "$version"
          mkdir -p target/staged-acceptance
          printf '%s\n' "$version" > target/staged-acceptance/hosted-chrome-version.txt
          printf 'STASIS_BROWSER_EXECUTABLE=%s\n' "$chrome" >> "$GITHUB_ENV"

      - name: Setup MSVC dev environment
        if: matrix.target == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Download signed Windows archive
        if: matrix.target == 'windows' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stasis-nightly-win-x64
          path: target/staged-archive

      - name: Download candidate unsigned Windows archive
        if: matrix.target == 'windows' && github.ref != 'refs/heads/main'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stasis-nightly-win-x64-unsigned
          path: target/staged-archive

      - name: Download Linux or macOS archive
        if: matrix.target != 'windows'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.archive }}
          path: target/staged-archive

      - name: Extract and qualify the exact staged archive
        id: qualify
        shell: pwsh
        env:
          STASIS_TARGET: ${{ matrix.target }}
          STASIS_ARCHIVE: target/staged-archive/${{ matrix.archive }}.${{ matrix.ext }}
          STASIS_ARTIFACT_NAME: ${{ matrix.target == 'windows' && github.ref == 'refs/heads/main' && 'stasis-nightly-win-x64' || matrix.target == 'windows' && 'stasis-nightly-win-x64-unsigned' || matrix.archive }}
          STASIS_RELEASE_ID: ${{ needs.detect.outputs.nightly_tag }}
          STASIS_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $archiveFile = Join-Path $env:GITHUB_WORKSPACE $env:STASIS_ARCHIVE
          $archiveParent = Join-Path $env:GITHUB_WORKSPACE "target"
          New-Item -ItemType Directory -Force -Path $archiveParent | Out-Null
          if ($env:STASIS_TARGET -eq "windows") {
            $archiveRoot = Join-Path $env:GITHUB_WORKSPACE "target/staged-toolchain"
            New-Item -ItemType Directory -Force -Path $archiveRoot | Out-Null
            Expand-Archive -LiteralPath $archiveFile -DestinationPath $archiveRoot -Force
          } else {
            tar -xf $archiveFile -C $archiveParent
            if ($LASTEXITCODE -ne 0) { throw "Archive extraction failed" }
            $archiveRoot = Join-Path $archiveParent $env:STASIS_ARTIFACT_NAME
            if (-not (Test-Path $archiveRoot -PathType Container)) {
              throw "Archive root does not match artifact name: $($env:STASIS_ARTIFACT_NAME)"
            }
          }
          $arguments = @(
            "tools/ci/qualify_staged_archive.py",
            "--archive-root", $archiveRoot,
            "--archive-file", $archiveFile,
            "--target", $env:STASIS_TARGET,
            "--artifact-name", $env:STASIS_ARTIFACT_NAME,
            "--release-id", $env:STASIS_RELEASE_ID,
            "--source-commit", $env:STASIS_SOURCE_COMMIT,
            "--repository", $env:GITHUB_REPOSITORY,
            "--run-id", $env:GITHUB_RUN_ID,
            "--evidence-dir", "target/staged-acceptance"
          )
          if (-not $env:STASIS_BROWSER_EXECUTABLE) { throw "Verified hosted Chrome path is missing" }
          $arguments += "--browser"
          python @arguments
          if ($LASTEXITCODE -ne 0) { throw "Staged archive consumer qualification failed" }

      - name: Collect staged archive review evidence
        if: always()
        shell: pwsh
        env:
          STASIS_TARGET: ${{ matrix.target }}
          STASIS_STAGED_LANE_PASSED: ${{ steps.qualify.outcome == 'success' }}
          STASIS_ARCHIVE_ROOT: ${{ github.workspace }}/target/${{ matrix.target == 'windows' && 'staged-toolchain' || matrix.archive }}
        run: |
          python tools/ci/collect_staged_archive_evidence.py `
            --target $env:STASIS_TARGET `
            --staged-root target/staged-acceptance `
            --archive-root $env:STASIS_ARCHIVE_ROOT `
            --output target/staged-release-evidence
          if ($LASTEXITCODE -ne 0) { throw "Staged release evidence is incomplete" }

      - name: Upload desktop staged archive review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: staged-release-evidence-${{ matrix.target }}
          path: target/staged-release-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop staged archive receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: staged-release-receipt-${{ matrix.target }}
          path: target/staged-acceptance/staged-archive-receipt.json
          if-no-files-found: error
          retention-days: 14

  staged_android_archive_acceptance:
    needs: [detect, build]
    if: needs.detect.outputs.should_release == 'true'
    uses: ./.github/workflows/staged-android-archive-acceptance.yml
    secrets:
      android_test_keystore_base64: ${{ secrets.STASIS_ANDROID_TEST_KEYSTORE_BASE64 }}
      android_test_store_password: ${{ secrets.STASIS_ANDROID_TEST_STORE_PASSWORD }}
      android_test_key_password: ${{ secrets.STASIS_ANDROID_TEST_KEY_PASSWORD }}
    with:
      release_id: ${{ needs.detect.outputs.nightly_tag }}
      source_commit: ${{ github.sha }}
      run_id: ${{ format('{0}', github.run_id) }}

  staged_ios_archive_acceptance:
    needs: [detect, build]
    if: needs.detect.outputs.should_release == 'true'
    uses: ./.github/workflows/staged-ios-archive-acceptance.yml
    with:
      release_id: ${{ needs.detect.outputs.nightly_tag }}
      source_commit: ${{ github.sha }}
      run_id: ${{ format('{0}', github.run_id) }}

  release:
    needs: [detect, build, windows_signing, android_prebuilt_acceptance, vscode_extension, integration_seams, android_device_seams, performance_benchmarks, network_browser_acceptance, staged_archive_desktop_acceptance, staged_android_archive_acceptance, staged_ios_archive_acceptance]
    if: ${{ always() && needs.detect.outputs.should_release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download Linux toolchain release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stasis-nightly-linux-x64
          path: dist

      - name: Download signed Windows toolchain release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stasis-nightly-win-x64
          path: dist

      - name: Download macOS toolchain release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stasis-nightly-osx-arm64
          path: dist

      - name: Download editor releases
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: stasis-editor-release-*
          path: dist
          merge-multiple: true

      - name: Download staged archive qualification receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: staged-release-receipt-*
          path: target/staged-receipts

      - name: Require every release readiness lane and verify exact archive receipts
        env:
          REQUIRED_RESULTS: >-
            build=${{ needs.build.result }}
            windows_signing=${{ needs.windows_signing.result }}
            android_prebuilt_acceptance=${{ needs.android_prebuilt_acceptance.result }}
            vscode_extension=${{ needs.vscode_extension.result }}
            integration_seams=${{ needs.integration_seams.result }}
            android_device_seams=${{ needs.android_device_seams.result }}
            performance_benchmarks=${{ needs.performance_benchmarks.result }}
            network_browser_acceptance=${{ needs.network_browser_acceptance.result }}
            staged_archive_desktop_acceptance=${{ needs.staged_archive_desktop_acceptance.result }}
            staged_android_archive_acceptance=${{ needs.staged_android_archive_acceptance.result }}
            staged_ios_archive_acceptance=${{ needs.staged_ios_archive_acceptance.result }}
        shell: bash
        run: |
          set -euo pipefail
          for lane in ${REQUIRED_RESULTS}; do
            result="${lane#*=}"
            if [[ "${result}" != "success" ]]; then
              echo "Release readiness lane did not succeed: ${lane}" >&2
              exit 1
            fi
          done
          python tools/ci/verify_staged_archive_receipts.py \
            --receipts target/staged-receipts \
            --archive-dir dist \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" \
            --release-id "${{ needs.detect.outputs.nightly_tag }}" \
            --source-commit "${GITHUB_SHA}" \
            --require-signed-windows
          if [[ "${?}" -ne 0 ]]; then
            echo "Staged archive publication verification failed" >&2
            exit 1
          fi

      - name: Create GitHub prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_TAG: ${{ needs.detect.outputs.nightly_tag }}
          LAST_TAG: ${{ needs.detect.outputs.last_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release publication is restricted to refs/heads/main" >&2
            exit 1
          fi
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ ! "${remote_main}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve the current origin/main commit before publication" >&2
            exit 1
          fi
          if [[ "${GITHUB_SHA}" != "${remote_main}" ]]; then
            echo "Release publication requires the exact current origin/main commit" >&2
            exit 1
          fi
          notes="$(printf 'Automated nightly build.')"
          if [ -n "${LAST_TAG}" ]; then
            notes="$(printf 'Automated nightly build.\n\nChanges since %s: https://github.com/%s/compare/%s...%s' "${LAST_TAG}" "${GITHUB_REPOSITORY}" "${LAST_TAG}" "${GITHUB_SHA}")"
          else
            notes="$(printf 'Automated nightly build.\n\nFirst nightly tag in this repository.')"
          fi

          mapfile -d '' -t release_assets < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          if ((${#release_assets[@]} == 0)); then
            echo "No regular release assets found directly under dist" >&2
            exit 1
          fi
          gh release create "${NIGHTLY_TAG}" "${release_assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Nightly ${NIGHTLY_TAG}" \
            --notes "${notes}" \
            --prerelease

  no_changes:
    needs: detect
    if: needs.detect.outputs.should_release != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip release
        run: |
          echo "No code changes detected since last nightly tag: ${{ needs.detect.outputs.last_tag }}"
          echo "Skipping nightly release."
