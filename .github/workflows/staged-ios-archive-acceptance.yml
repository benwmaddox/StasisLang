name: Staged iOS Archive Acceptance

on:
  workflow_call:
    inputs:
      release_id:
        description: Exact release identity stamped into the staged archive
        required: true
        type: string
      source_commit:
        description: Exact source commit stamped into the staged archive
        required: true
        type: string
      run_id:
        description: Calling nightly-release workflow run
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  accept:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      STASIS_RELEASE_ID: ${{ inputs.release_id }}
      STASIS_SOURCE_COMMIT: ${{ inputs.source_commit }}
      STASIS_CLI_EXECUTABLE: ${{ github.workspace }}/target/staged-macos/bin/stasis
      STASIS_RUNTIME_LIBRARY_PATH: ${{ github.workspace }}/target/staged-macos/bin/libstasis_graphics.dylib
      STASIS_IOS_SIMULATOR_ACCEPTANCE: generics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download exact macOS archive bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stasis-nightly-osx-arm64
          path: target/macos-archive

      - name: Extract and qualify archive consumers
        shell: bash
        env:
          STASIS_ARTIFACT_FILE: ${{ github.workspace }}/target/macos-archive/stasis-nightly-osx-arm64.tar.gz
        run: |
          set -euo pipefail
          mkdir -p target/staged-macos
          tar -xf "$STASIS_ARTIFACT_FILE" -C target/staged-macos --strip-components=1
          python tools/ci/qualify_staged_archive.py \
            --archive-root target/staged-macos \
            --archive-file "$STASIS_ARTIFACT_FILE" \
            --target ios \
            --artifact-name stasis-nightly-osx-arm64 \
            --release-id "${STASIS_RELEASE_ID}" \
            --source-commit "${STASIS_SOURCE_COMMIT}" \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${{ inputs.run_id }}" \
            --evidence-dir target/staged-ios-acceptance

      - name: Build and run bundled and generated consumers on iOS Simulator
        shell: bash
        env:
          STASIS_IOS_ACCEPTANCE_ROOT: ${{ github.workspace }}/target/staged-ios-acceptance/consumers
        run: |
          set -euo pipefail
          for consumer in bundled-generics generated-generics; do
            project="${STASIS_IOS_ACCEPTANCE_ROOT}/${consumer}"
            mkdir -p "${project}/target/ios-archive-acceptance"
            STASIS_IOS_BUILD_ROOT="${project}/target/ios-archive-acceptance" \
              bash tools/ci/build_ios_package.sh \
                "${project}" "dist/staged-ios-${consumer}" \
                2>&1 | tee "${project}/target/ios-archive-acceptance/helper.log"
          done

      - name: Bind iOS runtime evidence to the exact archive
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci/record_staged_archive_runtime.py \
            --receipt target/staged-ios-acceptance/staged-archive-receipt.json \
            --target ios \
            --bundled-root target/staged-ios-acceptance/consumers/bundled-generics \
            --generated-root target/staged-ios-acceptance/consumers/generated-generics \
            --release-id "${STASIS_RELEASE_ID}" \
            --source-commit "${STASIS_SOURCE_COMMIT}"

      - name: Upload staged iOS archive receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: staged-release-receipt-ios
          path: target/staged-ios-acceptance/staged-archive-receipt.json
          if-no-files-found: error
          retention-days: 14
