name: CI (PR pending status)

on:
  pull_request_target:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to mark pending (for manual testing)"
        required: false
        type: string

permissions:
  contents: read
  statuses: write

jobs:
  pending:
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR pending for scheduled CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          api="https://api.github.com"
          auth_header="Authorization: Bearer ${GITHUB_TOKEN}"
          accept_header="Accept: application/vnd.github+json"

          sha_input="${{ inputs.sha }}"
          if [ -n "$sha_input" ]; then
            pr_sha="$sha_input"
          else
            pr_sha="${{ github.event.pull_request.head.sha }}"
          fi

          next_run_utc=$(date -u -d 'next hour' +"%Y-%m-%d %H:00 UTC")
          desc="Waiting for scheduled CI (~20 min). Next run: $next_run_utc"

          curl -s -X POST -H "$auth_header" -H "$accept_header" \
            "$api/repos/$repo/statuses/$pr_sha" \
            -d "{\"state\":\"pending\",\"context\":\"ci/quiet\",\"description\":\"$desc\"}" > /dev/null

          echo "Marked ci/quiet pending for $pr_sha"
