name: Nightly Validation

env:
  CARGO_INCREMENTAL: "0"

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: nightly-validation-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ always() }}
    needs:
      - pr-ci-preflight
      - pr-ci-cargo-workspace
      - pr-ci-cargo-stasis-library
      - pr-ci-cargo-stasis-test-harness
      - pr-ci-cargo-stasis-main
      - pr-ci-cargo-stasis-provenance
      - pr-ci-cargo-stasis-integration
      - pr-ci-generics-cross-platform
      - pr-ci-browser-compiler
      - bootstrap-smoke-windows
      - vscode-extension-e2e
      - android-package-link
    runs-on: ubuntu-latest
    steps:
      - name: Verify required nightly validation lanes
        env:
          PREFLIGHT_RESULT: ${{ needs.pr-ci-preflight.result }}
          WORKSPACE_RESULT: ${{ needs.pr-ci-cargo-workspace.result }}
          STASIS_LIBRARY_RESULT: ${{ needs.pr-ci-cargo-stasis-library.result }}
          STASIS_TEST_HARNESS_RESULT: ${{ needs.pr-ci-cargo-stasis-test-harness.result }}
          STASIS_MAIN_RESULT: ${{ needs.pr-ci-cargo-stasis-main.result }}
          STASIS_PROVENANCE_RESULT: ${{ needs.pr-ci-cargo-stasis-provenance.result }}
          STASIS_INTEGRATION_RESULT: ${{ needs.pr-ci-cargo-stasis-integration.result }}
          GENERICS_CROSS_PLATFORM_RESULT: ${{ needs.pr-ci-generics-cross-platform.result }}
          BROWSER_COMPILER_RESULT: ${{ needs.pr-ci-browser-compiler.result }}
          BOOTSTRAP_SMOKE_RESULT: ${{ needs.bootstrap-smoke-windows.result }}
          VSCODE_EXTENSION_RESULT: ${{ needs.vscode-extension-e2e.result }}
          ANDROID_PACKAGE_LINK_RESULT: ${{ needs.android-package-link.result }}
        shell: bash
        run: |
          required_lanes=(
            "Nightly validation preflight=$PREFLIGHT_RESULT"
            "Nightly validation workspace Cargo=$WORKSPACE_RESULT"
            "Nightly validation Stasis library Cargo=$STASIS_LIBRARY_RESULT"
            "Nightly validation Stasis test harness=$STASIS_TEST_HARNESS_RESULT"
            "Nightly validation Stasis main Cargo=$STASIS_MAIN_RESULT"
            "Nightly validation Stasis provenance Cargo=$STASIS_PROVENANCE_RESULT"
            "Nightly validation Stasis integration Cargo=$STASIS_INTEGRATION_RESULT"
            "Generics compiler matrix=$GENERICS_CROSS_PLATFORM_RESULT"
            "Nightly validation browser compiler=$BROWSER_COMPILER_RESULT"
            "Windows bootstrap smoke=$BOOTSTRAP_SMOKE_RESULT"
            "VS Code extension E2E=$VSCODE_EXTENSION_RESULT"
            "Android package link=$ANDROID_PACKAGE_LINK_RESULT"
          )
          for lane in "${required_lanes[@]}"; do
            result="${lane#*=}"
            if [[ "$result" != "success" ]]; then
              echo "A required nightly validation lane finished with result: $lane"
              exit 1
            fi
          done

  pr-ci-preflight:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Nightly validation preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: "24"

      - name: Install VS Code unit-test dependencies
        run: npm ci --prefix vscode-stasis

      - name: Check Stasis src layout
        run: |
          python tools/ci/check_stasis_src_layout.py
          python tools/ci/check_action_versions.py
          python -m unittest tools.ci.test_action_versions
          python -m unittest tools.ci.test_check_stasis_src_layout
          python tools/ci/check_deterministic_live_simulation_roadmap.py
          python -m unittest tools.ci.test_deterministic_live_simulation_roadmap
          python tools/ci/check_sdl3_migration.py
          python tools/ci/check_windows_vs_generator.py
          python tools/ci/check_runtime_abi_contract.py
          python tools/ci/check_host_runtime_contract.py
          python -m unittest tools.ci.test_cargo_cache
          python -m unittest tools.ci.test_pr_ci_cargo_policy
          python -m unittest tools.ci.test_android_emulator_seams
          python -m unittest tools.ci.test_generate_asset_load_fixture
          python -m unittest tools.ci.test_runtime_abi_contract
          python -m unittest tools.ci.test_host_runtime_contract
          python -m unittest tools.ci.test_run_android_release_shell_seam
          python -m unittest tools.ci.test_verify_android_native_library
          python -m unittest tools.ci.test_sdl3_migration
          python -m unittest tools.ci.test_windows_vs_generator
          python -m unittest tools.ci.test_windows_signing_manifest
          python -m unittest tools.ci.test_windows_signing_policy
          python -m unittest tools.ci.test_windows_signing_provision
          python -m unittest tools.ci.test_nightly_network_support
          python -m unittest tools.ci.test_build_android_runtime
          python -m unittest tools.ci.test_nightly_freshness tools.ci.test_removed_ai_surface
          python -m unittest tools.ci.test_pr_ci_seam_placement


      - name: Test release provenance
        run: python -m unittest tools.ci.test_release_provenance tools.ci.test_audio_stream_native_acceptance tools.ci.test_release_bundle_size tools.ci.test_check_package_time tools.ci.test_assemble_editor_release tools.ci.test_copy_release_samples

      - name: Test Android verified asset cache
        run: python tools/ci/test_android_asset_cache.py

      - name: Test Android project baseline policy
        run: python tools/ci/test_android_project_baseline_policy.py

      - name: Test render parity fixture and capture gate
        run: |
          python -m unittest tools.ci.test_verify_android_render_performance
          python -m unittest tools.ci.test_verify_render_parity
          python -m unittest tools.ci.test_verify_android_workshop_seam
          python tools/ci/verify_render_parity.py

      - name: Test web runtime seams
        run: node --test runtime/web/tests/*.test.mjs

      - name: Test native render contract and lifecycle matrix
        run: |
          cmake -S runtime -B target/render-parity-native -DSTASIS_GRAPHICS_BUILD_SHARED=OFF -DSTASIS_GRAPHICS_BUILD_STATIC=OFF -DSTASIS_BUILD_RUNNER=OFF -DSTASIS_BUILD_SYS=OFF -DSTASIS_MOBILE_RUNTIME_BUILD_TESTS=ON
          cmake --build target/render-parity-native --config Release
          ctest --test-dir target/render-parity-native -C Release --output-on-failure

      - name: Test bounded audio ring
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iruntime runtime/stasis_audio_ring.c runtime/tests/stasis_audio_ring_test.c -o /tmp/stasis_audio_ring_test
          /tmp/stasis_audio_ring_test

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Run default architecture characterization gate
        run: |
          python tools/ci/run_architecture_characterization.py --check
          python -m unittest tools.ci.test_run_architecture_characterization
          python tools/ci/run_architecture_characterization.py --run-fast

  pr-ci-browser-compiler:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Nightly validation browser compiler
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: "24"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Test in-memory compiler contract
        run: python tools/cargo_cache.py run -- cargo test -p stasis_browser_compiler -- --test-threads=1

      - name: Build browser compiler core
        run: python tools/cargo_cache.py run -- cargo build -p stasis_browser_compiler --target wasm32-unknown-unknown --release

      - name: Stage browser compiler Worker bundle
        run: node tools/stage_browser_compiler.mjs build/codex-cargo-target/wasm32-unknown-unknown/release/stasis_browser_compiler.wasm target/browser-compiler-bundle

      - name: Prove offline Worker compilation in Chromium
        run: node tools/run_browser_compiler_smoke.mjs target/browser-compiler-bundle

  pr-ci-cargo-workspace:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Nightly validation workspace Cargo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Run workspace Cargo tests
        # The in-process JIT test runner mutates process-global dispatch tables; keep CI deterministic.
        timeout-minutes: 15
        run: python tools/cargo_cache.py run -- cargo test --workspace --exclude stasis --all-targets -- --test-threads=1

  pr-ci-cargo-stasis-library:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Nightly validation Stasis library Cargo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build Stasis test executable
        # Some isolated app tests launch the sibling CLI; make that prerequisite explicit.
        timeout-minutes: 15
        run: python tools/cargo_cache.py run -- cargo build -p stasis --bin stasis

      - name: Run Stasis unit Cargo tests
        # The library tests need the sibling CLI built by the preceding step.
        timeout-minutes: 15
        run: python tools/cargo_cache.py run -- cargo test -p stasis --lib -- --test-threads=1

  pr-ci-cargo-stasis-main:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Nightly validation Stasis main Cargo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build Stasis test executable
        # The desktop editor's isolated tests launch the sibling CLI; make that prerequisite explicit.
        timeout-minutes: 15
        run: python tools/cargo_cache.py run -- cargo build -p stasis --bin stasis

      - name: Run Stasis main Cargo tests
        timeout-minutes: 15
        run: >-
          python tools/cargo_cache.py run -- cargo test -p stasis --bin stasis --
          --skip toolchain_cli::tests::release_provenance_rejects_substituted_renderer_sources
          --test-threads=1

  pr-ci-cargo-stasis-test-harness:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Nightly validation Stasis test harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build Stasis provenance test harness
        # Compile the full main test target once so the slow provenance test does not recompile it.
        timeout-minutes: 15
        run: python tools/cargo_cache.py run -- cargo test -p stasis --bin stasis --no-run

      - name: Stage Stasis provenance test harness
        shell: bash
        run: |
          set -euo pipefail
          test_binary="$(find build/codex-cargo-target/debug/deps -maxdepth 1 -type f -name 'stasis-*' -executable -print -quit)"
          test -n "$test_binary"
          mkdir -p target/pr-ci-stasis
          cp "$test_binary" target/pr-ci-stasis/provenance-test-harness

      - name: Upload Stasis provenance test harness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: stasis-provenance-test-harness
          if-no-files-found: error
          path: target/pr-ci-stasis/provenance-test-harness

  pr-ci-cargo-stasis-provenance:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Nightly validation Stasis provenance Cargo
    needs: pr-ci-cargo-stasis-test-harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Download Stasis provenance test harness
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stasis-provenance-test-harness
          path: target/pr-ci-stasis

      - name: Prepare Stasis provenance test harness
        shell: bash
        run: chmod +x target/pr-ci-stasis/provenance-test-harness

      - name: Run isolated Stasis provenance Cargo test
        timeout-minutes: 15
        run: >-
          ./target/pr-ci-stasis/provenance-test-harness
          toolchain_cli::tests::release_provenance_rejects_substituted_renderer_sources
          --exact --test-threads=1

  pr-ci-cargo-stasis-integration:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Nightly validation Stasis integration Cargo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Run Stasis integration Cargo tests
        timeout-minutes: 15
        shell: bash
        run: |
          test_args=()
          while IFS= read -r test_file; do
            test_name="$(basename "${test_file}" .rs)"
            # The replay browser acceptance runs in the packaged-generics lane with a matching native runtime.
            if [[ "$test_name" == "web_replay_acceptance" ]]; then continue; fi
            # Web packaging has its own bounded step below; retain the shared Cargo build.
            if [[ "$test_name" == "web_package" ]]; then continue; fi
            test_args+=(--test "$test_name")
          done < <(find apps/stasis/tests -maxdepth 1 -type f -name '*.rs' | sort)
          test "${#test_args[@]}" -gt 0
          python tools/cargo_cache.py run -- cargo test -p stasis "${test_args[@]}" -- --test-threads=1

      - name: Run Stasis Web package Cargo tests
        timeout-minutes: 15
        run: python tools/cargo_cache.py run -- cargo test -p stasis --test web_package -- --test-threads=1

  pr-ci-generics-cross-platform:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Generics compiler (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            evidence: linux-x64
            runtime_library: libstasis_graphics.so
            expected_arch: x86_64
          - name: Windows
            os: windows-latest
            evidence: windows-x64
            runtime_library: stasis_graphics.dll
            expected_arch: x86_64
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      STASIS_RELEASE_ID: ci-generics-desktop-${{ github.run_id }}
      STASIS_SOURCE_COMMIT: ${{ github.sha }}
      STASIS_GENERICS_DESKTOP_EVIDENCE_DIR: ${{ github.workspace }}/target/generics-desktop-${{ matrix.evidence }}
      STASIS_EXPECTED_HOST_ARCH: ${{ matrix.expected_arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Setup MSVC dev environment for native generics acceptance
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install Linux graphics and display dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y xvfb pkg-config libx11-dev
          libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
          libxss-dev libxtst-dev libxkbcommon-dev libegl1 libgl1-mesa-dri

      - name: Run generic JIT, Wasm, and diagnostic harness
        timeout-minutes: 15
        run: python tools/cargo_cache.py run -- cargo test -p stasis_compiler --test generics_collections_jit_aot_wasm -- --test-threads=1

      - name: Run linked native generics execution and trap acceptance
        timeout-minutes: 15
        run: python tools/cargo_cache.py run -- cargo test -p stasis_compiler --test generics_collections_aot_seam -- --test-threads=1 --nocapture

      - name: Compute packaged generics toolchain identity
        shell: pwsh
        run: |
          $fingerprint = (python tools/compute_toolchain_fingerprint.py --source-commit $env:STASIS_SOURCE_COMMIT --release-id $env:STASIS_RELEASE_ID).Trim()
          "STASIS_BUILD_FINGERPRINT=$fingerprint" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build matching packaged Web runtime
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $generator = (& powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tools/windows/select-cmake-vs-generator.ps1).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Visual Studio generator detection failed." }
          cmake -S runtime -B target/generics-web-runtime -G $generator -A x64 -DSTASIS_GRAPHICS_BUNDLE_SDL=ON -DSTASIS_GRAPHICS_BUILD_STATIC=OFF -DSTASIS_BUILD_RUNNER=ON -DSTASIS_BUILD_SYS=OFF -DSTASIS_RELEASE_ID="$env:STASIS_RELEASE_ID" -DSTASIS_BUILD_FINGERPRINT="$env:STASIS_BUILD_FINGERPRINT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build target/generics-web-runtime --config Release --target stasis_graphics stasis_runner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdlSource = Resolve-Path "target/generics-web-runtime/_deps/stasis_sdl3-src"
          $sdlImageSource = Resolve-Path "target/generics-web-runtime/_deps/stasis_sdl3_image-src"
          if (-not (Test-Path -LiteralPath $sdlSource -PathType Container) -or
              -not (Test-Path -LiteralPath $sdlImageSource -PathType Container)) {
            throw "CMake did not populate the pinned SDL source cache"
          }
          "STASIS_SDL3_SOURCE=$($sdlSource.Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STASIS_SDL3_IMAGE_SOURCE=$($sdlImageSource.Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STASIS_RUNTIME_DLL_PATH=$((Resolve-Path 'target/generics-web-runtime/bin/Release/stasis_graphics.dll').Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STASIS_RUNTIME_LIBRARY_PATH=$((Resolve-Path 'target/generics-web-runtime/bin/Release/stasis_graphics.dll').Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STASIS_RUNTIME_RUNNER_PATH=$((Resolve-Path 'target/generics-web-runtime/bin/Release/stasis_runner.exe').Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build matching packaged desktop runtime on Unix
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cmake -S runtime -B target/generics-desktop-runtime \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTASIS_GRAPHICS_BUILD_SHARED=ON \
            -DSTASIS_GRAPHICS_BUILD_STATIC=OFF \
            -DSTASIS_GRAPHICS_BUNDLE_SDL=ON \
            -DSTASIS_BUILD_RUNNER=ON \
            -DSTASIS_BUILD_SYS=OFF \
            -DSTASIS_MOBILE_RUNTIME_BUILD_TESTS=ON \
            -DSTASIS_RELEASE_ID="$STASIS_RELEASE_ID" \
            -DSTASIS_BUILD_FINGERPRINT="$STASIS_BUILD_FINGERPRINT"
          cmake --build target/generics-desktop-runtime --config Release --target stasis_graphics stasis_runner \
            stasis_runner_package_graphics stasis_runner_package_game \
            stasis_runner_package_lifecycle_graphics stasis_runner_package_lifecycle_game
          ctest --test-dir target/generics-desktop-runtime --output-on-failure --no-tests=error -R stasis_runner_packaged_unix_contract
          runtime="$GITHUB_WORKSPACE/target/generics-desktop-runtime/bin/${{ matrix.runtime_library }}"
          test -f "$runtime"
          echo "STASIS_RUNTIME_LIBRARY_PATH=$runtime" >> "$GITHUB_ENV"
          runner="$GITHUB_WORKSPACE/target/generics-desktop-runtime/bin/Release/stasis_runner"
          test -x "$runner"
          echo "STASIS_RUNTIME_RUNNER_PATH=$runner" >> "$GITHUB_ENV"

      - name: Run packaged generics desktop acceptance on Unix
        if: runner.os != 'Windows'
        timeout-minutes: 15
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            xvfb-run -a python tools/cargo_cache.py run -- cargo test -p stasis --features packaged-desktop-acceptance --test generics_collections_desktop -- --exact full_generics_desktop_package_launches_with_provenance_and_digest_frame --test-threads=1 --nocapture
          else
            python tools/cargo_cache.py run -- cargo test -p stasis --features packaged-desktop-acceptance --test generics_collections_desktop -- --exact full_generics_desktop_package_launches_with_provenance_and_digest_frame --test-threads=1 --nocapture
          fi

      - name: Build isolated presentation-poison runtime on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 15
        shell: bash
        run: |
          presentation_release_id="ci-presentation-desktop-${GITHUB_RUN_ID}"
          presentation_fingerprint="$(python tools/compute_toolchain_fingerprint.py \
            --source-commit "$STASIS_SOURCE_COMMIT" \
            --release-id "$presentation_release_id")"
          cmake -S runtime -B target/presentation-desktop-runtime \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTASIS_GRAPHICS_BUILD_SHARED=ON \
            -DSTASIS_GRAPHICS_BUILD_STATIC=OFF \
            -DSTASIS_GRAPHICS_BUNDLE_SDL=ON \
            -DSTASIS_BUILD_RUNNER=ON \
            -DSTASIS_BUILD_SYS=OFF \
            -DSTASIS_TEST_PRESENTATION_POISON=ON \
            -DSTASIS_RELEASE_ID="$presentation_release_id" \
            -DSTASIS_BUILD_FINGERPRINT="$presentation_fingerprint"
          cmake --build target/presentation-desktop-runtime --config Release \
            --target stasis_graphics stasis_runner
          instrumented_runtime="$GITHUB_WORKSPACE/target/presentation-desktop-runtime/bin/libstasis_graphics.so"
          instrumented_runner="$GITHUB_WORKSPACE/target/presentation-desktop-runtime/bin/Release/stasis_runner"
          normal_runtime="$GITHUB_WORKSPACE/target/generics-desktop-runtime/bin/libstasis_graphics.so"
          normal_runner="$GITHUB_WORKSPACE/target/generics-desktop-runtime/bin/Release/stasis_runner"
          test -f "$instrumented_runtime"
          test -x "$instrumented_runner"
          evidence="$GITHUB_WORKSPACE/target/presentation-baseline-linux-x64"
          mkdir -p "$evidence"
          nm -D "$instrumented_runtime" > "$evidence/instrumented-runtime-symbols.txt"
          nm -D "$normal_runtime" > "$evidence/default-off-runtime-symbols.txt"
          strings "$instrumented_runner" > "$evidence/instrumented-runner-strings.txt"
          strings "$normal_runner" > "$evidence/default-off-runner-strings.txt"
          grep -Fq 'stasis_test_poison_physical_target' \
            "$evidence/instrumented-runtime-symbols.txt"
          grep -Fq 'stasis_test_presentation_poison_target_kind' \
            "$evidence/instrumented-runtime-symbols.txt"
          grep -Fq 'STASIS_TEST_PRESENTATION_POISON_ONCE' \
            "$evidence/instrumented-runner-strings.txt"
          if grep -Eq 'stasis_test_(poison_physical_target|presentation_poison_target_kind)' \
              "$evidence/default-off-runtime-symbols.txt"; then
            echo "default-OFF production runtime unexpectedly exports presentation poison seams" >&2
            exit 1
          fi
          if grep -Fq 'STASIS_TEST_PRESENTATION_POISON_ONCE' \
              "$evidence/default-off-runner-strings.txt"; then
            echo "default-OFF production runner unexpectedly contains the presentation poison hook" >&2
            exit 1
          fi
          echo "STASIS_PRESENTATION_RELEASE_ID=$presentation_release_id" >> "$GITHUB_ENV"
          echo "STASIS_PRESENTATION_BUILD_FINGERPRINT=$presentation_fingerprint" >> "$GITHUB_ENV"
          sha256sum "$instrumented_runtime" "$instrumented_runner" \
            > "$evidence/instrumented-runtime-hashes.txt"
          sha256sum "$normal_runtime" "$normal_runner" \
            > "$evidence/default-off-runtime-hashes.txt"
          grep -E '^(STASIS_(BUILD_FINGERPRINT|RELEASE_ID)|STASIS_TEST_PRESENTATION_POISON):' \
            target/presentation-desktop-runtime/CMakeCache.txt \
            > "$evidence/instrumented-runtime-identity.txt"
          grep -E '^(STASIS_(BUILD_FINGERPRINT|RELEASE_ID)|STASIS_TEST_PRESENTATION_POISON):' \
            target/generics-desktop-runtime/CMakeCache.txt \
            > "$evidence/default-off-runtime-identity.txt"

      - name: Run packaged presentation baseline on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 15
        shell: bash
        env:
          STASIS_PRESENTATION_DESKTOP_EVIDENCE_DIR: ${{ github.workspace }}/target/presentation-baseline-linux-x64
          STASIS_RUNTIME_LIBRARY_PATH: ${{ github.workspace }}/target/presentation-desktop-runtime/bin/libstasis_graphics.so
          STASIS_RUNTIME_RUNNER_PATH: ${{ github.workspace }}/target/presentation-desktop-runtime/bin/Release/stasis_runner
        run: |
          set -o pipefail
          STASIS_RELEASE_ID="$STASIS_PRESENTATION_RELEASE_ID" \
          STASIS_BUILD_FINGERPRINT="$STASIS_PRESENTATION_BUILD_FINGERPRINT" \
          xvfb-run -a python tools/cargo_cache.py run -- cargo test -p stasis \
            --features packaged-desktop-acceptance \
            --test presentation_baseline_desktop \
            -- --exact packaged_presentation_baseline_initializes_poisoned_target_without_guest_clear \
            --test-threads=1 --nocapture \
            2>&1 | tee "$STASIS_PRESENTATION_DESKTOP_EVIDENCE_DIR/presentation-linux-test.log"

      - name: Verify presentation baseline evidence on Linux
        if: ${{ always() && runner.os == 'Linux' }}
        shell: bash
        run: |
          evidence="$GITHUB_WORKSPACE/target/presentation-baseline-linux-x64"
          required=(
            instrumented-runtime-hashes.txt
            instrumented-runtime-identity.txt
            instrumented-runtime-symbols.txt
            instrumented-runner-strings.txt
            default-off-runtime-hashes.txt
            default-off-runtime-identity.txt
            default-off-runtime-symbols.txt
            default-off-runner-strings.txt
            presentation-linux-test.log
            presentation-desktop-frame.png
            presentation-desktop-provenance.json
            presentation-desktop-runtime.log
            presentation-desktop-receipt.json
          )
          for file in "${required[@]}"; do
            test -s "$evidence/$file" || {
              echo "required Linux presentation evidence is missing: $evidence/$file" >&2
              exit 1
            }
          done

      - name: Upload Linux presentation baseline evidence
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: presentation-baseline-linux-x64-${{ github.run_id }}
          if-no-files-found: error
          path: target/presentation-baseline-linux-x64/**

      - name: Run packaged Web replay acceptance on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 15
        shell: bash
        run: xvfb-run -a python tools/cargo_cache.py run -- cargo test -p stasis --test web_replay_acceptance -- --test-threads=1 --nocapture

      - name: Run packaged generics desktop acceptance on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          python tools/cargo_cache.py run -- cargo test -p stasis --features packaged-desktop-acceptance --test generics_collections_desktop -- --exact full_generics_desktop_package_launches_with_provenance_and_digest_frame --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run packaged generics Web acceptance
        if: matrix.os == 'windows-latest'
        timeout-minutes: 15
        shell: pwsh
        run: |
          python tools/cargo_cache.py run -- cargo test -p stasis --test generics_collections_package -- --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/cargo_cache.py run -- cargo run -p stasis -- --workspace samples/generics_collections package --target web --development-build --out build/web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/run_generics_collections_browser_acceptance.mjs samples/generics_collections/build/web target/generics-collections-browser

      - name: Upload packaged generics desktop and Web evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: generics-collections-${{ matrix.evidence }}-evidence
          if-no-files-found: error
          path: |
            target/generics-desktop-${{ matrix.evidence }}/**
            target/generics-collections-browser/**
            samples/generics_collections/build/web/stasis_provenance.json

  bootstrap-smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      STASIS_RELEASE_ID: ci-${{ github.sha }}
      STASIS_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute shared toolchain fingerprint
        shell: pwsh
        run: |
          $fingerprint = (python tools/compute_toolchain_fingerprint.py --source-commit $env:STASIS_SOURCE_COMMIT --release-id $env:STASIS_RELEASE_ID).Trim()
          "STASIS_BUILD_FINGERPRINT=$fingerprint" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check Stasis src layout
        run: python tools/ci/check_stasis_src_layout.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Provision ephemeral CI signing certificate
        shell: pwsh
        env:
          STASIS_SIGNING_CERTIFICATE: ${{ runner.temp }}\stasis-ci-signing\stasis-ci-signing.pfx
          STASIS_SIGNING_EPHEMERAL_PFX: "1"
          STASIS_SIGNING_TIMEOUT_SECONDS: "120"
          STASIS_SIGNING_LOCAL_RECORD: ${{ runner.temp }}\stasis-ci-signing-thumbprint.txt
          STASIS_REQUIRE_SIGNED_EXECUTION: "1"
          STASIS_SIGNING_MODE: required
        run: |
          $ErrorActionPreference = "Stop"
          $boundedPowerShell = (Resolve-Path -LiteralPath ./tools/windows/invoke-bounded-powershell.ps1).Path
          $signingScript = (Resolve-Path -LiteralPath ./tools/windows/stasis-signing.ps1).Path
          $pfxScript = (Resolve-Path -LiteralPath ./tools/windows/provision-ci-signing-pfx.ps1).Path
          $pfxJson = @(& $boundedPowerShell -ScriptPath $pfxScript -Command provision -TimeoutSeconds 120)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pfx = ($pfxJson -join "`n") | ConvertFrom-Json
          $expectedCertificate = [IO.Path]::GetFullPath($env:STASIS_SIGNING_CERTIFICATE)
          $actualCertificate = [IO.Path]::GetFullPath([string]$pfx.certificate)
          if ($actualCertificate -ne $expectedCertificate -or
              [string]::IsNullOrWhiteSpace([string]$pfx.password) -or
              [string]$pfx.thumbprint -notmatch '^[0-9A-Fa-f]{40}$') {
            throw "ephemeral CI signing PFX output was invalid"
          }
          $pfxPassword = [string]$pfx.password
          "::add-mask::$pfxPassword"
          $env:STASIS_SIGNING_PFX_PASSWORD = $pfxPassword
          $statusJson = @(& $boundedPowerShell -ScriptPath $signingScript -Command status -TimeoutSeconds 120)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $status = ($statusJson -join "`n") | ConvertFrom-Json
          if (-not $status.certificate_configured -or -not $status.required -or [string]::IsNullOrWhiteSpace([string]$status.signer)) {
            throw "ephemeral CI signing certificate was not configured for required signing"
          }
          $smokeDirectory = Split-Path -Parent $env:STASIS_SIGNING_CERTIFICATE
          $smokeSource = Join-Path $smokeDirectory 'ephemeral-signing-smoke.c'
          $smokeObject = Join-Path $smokeDirectory 'ephemeral-signing-smoke.obj'
          $smokeArtifact = Join-Path $smokeDirectory 'ephemeral-signing-smoke.exe'
          Set-Content -LiteralPath $smokeSource -Value 'int main(void) { return 0; }' -Encoding ascii
          try {
            & cl.exe /nologo /W4 /WX "/Fo$smokeObject" "/Fe$smokeArtifact" $smokeSource
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $boundedPowerShell -ScriptPath $signingScript -Command sign -ScriptArguments @('-Artifact', $smokeArtifact) -TimeoutSeconds 120
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $boundedPowerShell -ScriptPath $signingScript -Command verify -ScriptArguments @('-Artifact', $smokeArtifact) -TimeoutSeconds 120
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -LiteralPath $smokeArtifact -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $smokeObject -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $smokeSource -Force -ErrorAction SilentlyContinue
          }
          "STASIS_SIGNING_LOCAL_RECORD=$env:STASIS_SIGNING_LOCAL_RECORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STASIS_SIGNING_CERTIFICATE=$env:STASIS_SIGNING_CERTIFICATE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STASIS_SIGNING_PFX_PASSWORD=$pfxPassword" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STASIS_SIGNING_EPHEMERAL_PFX=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STASIS_SIGNING_TIMEOUT_SECONDS=120" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STASIS_REQUIRE_SIGNED_EXECUTION=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STASIS_SIGNING_MODE=required" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Capture the real Windows SDL parity fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $generator = (& powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tools/windows/select-cmake-vs-generator.ps1).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Visual Studio generator detection failed." }
          $env:STASIS_CMAKE_GENERATOR = $generator
          cmake -S runtime -B target/render-parity-runtime -G $generator -A x64 -DSTASIS_GRAPHICS_BUNDLE_SDL=ON -DSTASIS_GRAPHICS_BUILD_STATIC=OFF -DSTASIS_GRAPHICS_BUILD_TESTS=ON -DSTASIS_BUILD_RUNNER=ON -DSTASIS_BUILD_SYS=OFF -DSTASIS_RELEASE_ID="$env:STASIS_RELEASE_ID" -DSTASIS_BUILD_FINGERPRINT="$env:STASIS_BUILD_FINGERPRINT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build target/render-parity-runtime --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir target/render-parity-runtime -C Release -R '^stasis_(sprite_atlas_reservation_test|console_launch_contract)$' --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runner = (Resolve-Path "target/render-parity-runtime/bin/Release/stasis_runner.exe").Path
          $runnerManifest = Join-Path $PWD "target/render-parity-runtime/stasis_runner.embedded.manifest"
          & mt.exe -nologo "-inputresource:$runner;#1" "-out:$runnerManifest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifestText = Get-Content -LiteralPath $runnerManifest -Raw
          if ($manifestText -notmatch '<dpiAware[^>]*>true/pm</dpiAware>' -or
              $manifestText -notmatch '<dpiAwareness[^>]*>PerMonitorV2, PerMonitor</dpiAwareness>') {
            throw "stasis_runner.exe is missing its per-monitor-v2 DPI manifest"
          }
          New-Item -ItemType Directory -Force target/render-parity-ci | Out-Null
          $env:STASIS_RUNTIME_DLL_PATH = (Resolve-Path "target/render-parity-runtime/bin/Release/stasis_graphics.dll")
          $env:STASIS_RUNTIME_RUNNER_PATH = (Resolve-Path "target/render-parity-runtime/bin/Release/stasis_runner.exe")
          $env:STASIS_GFX_LOG_SPRITES = "1"
          $env:STASIS_PARITY_CAPTURE_STAGE = "second_frame"
          python tools/cargo_cache.py run -- cargo run -p stasis -- --workspace samples/render_parity prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/cargo_cache.py run -- cargo run -p stasis -- play samples/render_parity/main.stasis --watch-dir samples/render_parity --ticks 2 --screenshot target/render-parity-ci/frame.png --screenshot-frame 2 --exit-after-screenshot 2>&1 | Tee-Object target/render-parity-ci/runtime.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ci/verify_render_parity.py --capture target/render-parity-ci/frame.png --runtime-log target/render-parity-ci/runtime.log --evidence target/render-parity-ci/evidence.json --write-evidence --require-load-details --profile portable --stage second_frame
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/cargo_cache.py run -- cargo test -p stasis --test windows_game_launch -- --test-threads=1 --nocapture

      - name: Build isolated presentation-poison runtime for Windows seams
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $generator = (& powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tools/windows/select-cmake-vs-generator.ps1).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Visual Studio generator detection failed." }
          $env:STASIS_CMAKE_GENERATOR = $generator
          # Release/fingerprint are the shared source compatibility context; binary identity is the separate path, poison option, exports, and hash.
          $presentationReleaseId = $env:STASIS_RELEASE_ID
          $presentationFingerprint = $env:STASIS_BUILD_FINGERPRINT
          if ([string]::IsNullOrWhiteSpace($presentationReleaseId) -or [string]::IsNullOrWhiteSpace($presentationFingerprint)) {
            throw "job release/fingerprint context is required for the presentation-poison runtime"
          }
          cmake -S runtime -B target/presentation-poison-runtime -G $generator -A x64 -DSTASIS_GRAPHICS_BUILD_SHARED=ON -DSTASIS_GRAPHICS_BUILD_STATIC=OFF -DSTASIS_GRAPHICS_BUNDLE_SDL=ON -DSTASIS_GRAPHICS_BUILD_TESTS=ON -DSTASIS_BUILD_RUNNER=OFF -DSTASIS_BUILD_SYS=OFF -DSTASIS_TEST_PRESENTATION_POISON=ON "-DSTASIS_RELEASE_ID=$presentationReleaseId" "-DSTASIS_BUILD_FINGERPRINT=$presentationFingerprint"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build target/presentation-poison-runtime --config Release --target stasis_graphics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $normalRuntime = (Resolve-Path "target/render-parity-runtime/bin/Release/stasis_graphics.dll").Path
          $poisonRuntime = (Resolve-Path "target/presentation-poison-runtime/bin/Release/stasis_graphics.dll").Path
          if ([IO.Path]::GetFullPath($normalRuntime) -eq [IO.Path]::GetFullPath($poisonRuntime)) {
            throw "ordinary and presentation-poison runtime paths must be distinct"
          }
          $normalCache = Get-Content -LiteralPath target/render-parity-runtime/CMakeCache.txt -Raw
          $poisonCache = Get-Content -LiteralPath target/presentation-poison-runtime/CMakeCache.txt -Raw
          foreach ($setting in @(
              @{ Cache = $normalCache; Pattern = '^STASIS_TEST_PRESENTATION_POISON:BOOL=OFF\r?$'; Label = 'ordinary poison option OFF' },
              @{ Cache = $poisonCache; Pattern = '^STASIS_TEST_PRESENTATION_POISON:BOOL=ON\r?$'; Label = 'test poison option ON' },
              @{ Cache = $normalCache; Pattern = '^STASIS_GRAPHICS_BUNDLE_SDL:BOOL=ON\r?$'; Label = 'ordinary bundled SDL' },
              @{ Cache = $poisonCache; Pattern = '^STASIS_GRAPHICS_BUNDLE_SDL:BOOL=ON\r?$'; Label = 'test bundled SDL' },
              @{ Cache = $normalCache; Pattern = '^STASIS_GRAPHICS_BUILD_SHARED:BOOL=ON\r?$'; Label = 'ordinary shared graphics DLL' },
              @{ Cache = $poisonCache; Pattern = '^STASIS_GRAPHICS_BUILD_SHARED:BOOL=ON\r?$'; Label = 'test shared graphics DLL' }
          )) {
            if ($setting.Cache -notmatch "(?m)$($setting.Pattern)") { throw "CMake cache is missing $($setting.Label)" }
          }
          $normalRelease = [regex]::Match($normalCache, '(?m)^STASIS_RELEASE_ID:STRING=(.*)$').Groups[1].Value.Trim()
          $poisonRelease = [regex]::Match($poisonCache, '(?m)^STASIS_RELEASE_ID:STRING=(.*)$').Groups[1].Value.Trim()
          $normalFingerprint = [regex]::Match($normalCache, '(?m)^STASIS_BUILD_FINGERPRINT:STRING=(.*)$').Groups[1].Value.Trim()
          $poisonFingerprint = [regex]::Match($poisonCache, '(?m)^STASIS_BUILD_FINGERPRINT:STRING=(.*)$').Groups[1].Value.Trim()
          if ($normalRelease -ne $env:STASIS_RELEASE_ID -or $poisonRelease -ne $env:STASIS_RELEASE_ID -or
              $normalFingerprint -ne $env:STASIS_BUILD_FINGERPRINT -or $poisonFingerprint -ne $env:STASIS_BUILD_FINGERPRINT) {
            throw "ordinary and presentation-poison runtimes must share the exact job source compatibility identity"
          }

          $poisonSymbols = @(
            'stasis_test_fail_next_text_preparation',
            'stasis_test_get_presentation_baseline_state',
            'stasis_test_poison_physical_target',
            'stasis_test_presentation_poison_target_kind',
            'stasis_test_read_physical_target_pixel'
          )
          $normalExports = (& dumpbin.exe /exports $normalRuntime | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for the ordinary runtime" }
          $poisonExports = (& dumpbin.exe /exports $poisonRuntime | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for the presentation-poison runtime" }
          $evidenceDirectory = 'target/presentation-poison-runtime/ci-evidence'
          New-Item -ItemType Directory -Force $evidenceDirectory | Out-Null
          Set-Content -LiteralPath (Join-Path $evidenceDirectory 'ordinary-runtime-exports.txt') -Value $normalExports -Encoding utf8
          Set-Content -LiteralPath (Join-Path $evidenceDirectory 'presentation-poison-runtime-exports.txt') -Value $poisonExports -Encoding utf8
          foreach ($symbol in $poisonSymbols) {
            if ($poisonExports -notmatch "(?m)\b$([regex]::Escape($symbol))\b") {
              throw "presentation-poison runtime is missing required export $symbol"
            }
            if ($normalExports -match "(?m)\b$([regex]::Escape($symbol))\b") {
              throw "ordinary runtime unexpectedly exports presentation-poison hook $symbol"
            }
          }
          $normalHash = (Get-FileHash -LiteralPath $normalRuntime -Algorithm SHA256).Hash.ToLowerInvariant()
          $poisonHash = (Get-FileHash -LiteralPath $poisonRuntime -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($normalHash -eq $poisonHash) { throw "ordinary and presentation-poison runtime DLL hashes must differ" }
          @(
            "ordinary_path=$normalRuntime",
            "ordinary_release_id=$normalRelease",
            "ordinary_build_fingerprint=$normalFingerprint",
            "ordinary_poison_option=OFF",
            "ordinary_sha256=$normalHash",
            "presentation_poison_path=$poisonRuntime",
            "presentation_poison_release_id=$poisonRelease",
            "presentation_poison_build_fingerprint=$poisonFingerprint",
            "presentation_poison_option=ON",
            "binary_identity=separate_path_and_compile_flag_and_exports_and_hash",
            "presentation_poison_sha256=$poisonHash"
          ) | Set-Content -LiteralPath (Join-Path $evidenceDirectory 'runtime-identities-and-hashes.txt') -Encoding utf8

      - name: Test Windows desktop SDL seam suite
        shell: pwsh
        run: |
          $env:STASIS_RUNTIME_DLL_PATH = (Resolve-Path "target/render-parity-runtime/bin/Release/stasis_graphics.dll").Path
          $env:STASIS_PRESENTATION_POISON_RUNTIME_DLL_PATH = (Resolve-Path "target/presentation-poison-runtime/bin/Release/stasis_graphics.dll").Path
          python tools/ci/run_windows_platform_seams.py --suite DesktopSdl

      - name: Test Windows mobile runtime seam suite
        shell: pwsh
        run: |
          $env:STASIS_RUNTIME_DLL_PATH = (Resolve-Path "target/render-parity-runtime/bin/Release/stasis_graphics.dll")
          python tools/ci/run_windows_platform_seams.py --suite MobileRuntime

      - name: Bootstrap Compile Smoke (compiler .stasis)
        # Compiler/JIT tests share process-global dispatch and runtime registration state.
        run: python tools/cargo_cache.py run -- cargo test -p stasis_compiler -- --test-threads=1 --nocapture

      - name: Upload Windows platform seam evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: windows-platform-seam-evidence
          if-no-files-found: warn
          path: |
            target/render-parity-ci/frame.png
            target/render-parity-ci/runtime.log
            target/render-parity-ci/evidence.json
            target/windows-platform-seams/**/*.log
            target/presentation-poison-runtime/ci-evidence/
            build/codex-cargo-target/seam-tests/

      - name: Cleanup ephemeral CI signing certificate
        if: always()
        shell: pwsh
        run: |
          $certificate = $env:STASIS_SIGNING_CERTIFICATE
          if ($certificate -and (Test-Path -LiteralPath $certificate -PathType Leaf)) {
            Remove-Item -LiteralPath $certificate -Force -ErrorAction SilentlyContinue
          }
          $directory = if ($certificate) { Split-Path -Parent $certificate } else { $null }
          if ($directory -and (Split-Path -Leaf $directory) -eq 'stasis-ci-signing' -and (Test-Path -LiteralPath $directory -PathType Container)) {
            Remove-Item -LiteralPath $directory -Recurse -Force -ErrorAction SilentlyContinue
          }
          if ($env:STASIS_SIGNING_LOCAL_RECORD -and (Test-Path -LiteralPath $env:STASIS_SIGNING_LOCAL_RECORD -PathType Leaf)) {
            Remove-Item -LiteralPath $env:STASIS_SIGNING_LOCAL_RECORD -Force -ErrorAction SilentlyContinue
          }

  vscode-extension-e2e:
    name: VS Code E2E (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            runtime_library: libstasis_graphics.so
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      STASIS_RELEASE_ID: ci-${{ github.sha }}
      STASIS_SOURCE_COMMIT: ${{ github.sha }}
      STASIS_E2E_VSCODE_VERSION: "1.96.0"
      STASIS_RUNTIME_LIBRARY_PATH: ${{ github.workspace }}/target/vscode-e2e-runtime/bin/${{ matrix.runtime_library }}
      STASIS_TOOLCHAIN_DIR: ${{ github.workspace }}/target/vscode-e2e-toolchain
      STASIS_TOOLCHAIN_EXECUTABLE: bin/stasis
      STASIS_E2E_EXECUTABLE: ${{ github.workspace }}/target/vscode-e2e-toolchain/bin/stasis
      STASIS_E2E_SCREENSHOT: ${{ github.workspace }}/target/vscode-e2e/frame.png
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute shared toolchain fingerprint
        shell: bash
        run: |
          fingerprint="$(python3 tools/compute_toolchain_fingerprint.py --source-commit "$STASIS_SOURCE_COMMIT" --release-id "$STASIS_RELEASE_ID")"
          echo "STASIS_BUILD_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: "24"
          cache: npm
          cache-dependency-path: vscode-stasis/package-lock.json

      - name: Install Linux graphics and display dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y xvfb libx11-dev
          libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
          libxss-dev libxtst-dev libxkbcommon-dev

      - name: Build native graphics runtime
        shell: bash
        run: |
          cmake -S runtime -B target/vscode-e2e-runtime \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTASIS_GRAPHICS_BUILD_SHARED=ON \
            -DSTASIS_GRAPHICS_BUILD_STATIC=OFF \
            -DSTASIS_GRAPHICS_BUNDLE_SDL=ON \
            -DSTASIS_BUILD_RUNNER=OFF \
            -DSTASIS_BUILD_SYS=OFF \
            -DSTASIS_RELEASE_ID="$STASIS_RELEASE_ID" \
            -DSTASIS_BUILD_FINGERPRINT="$STASIS_BUILD_FINGERPRINT"
          cmake --build target/vscode-e2e-runtime --config Release --target stasis_graphics
          test -f "$STASIS_RUNTIME_LIBRARY_PATH"

      - name: Build and probe Stasis runtime loading
        shell: bash
        run: |
          python tools/cargo_cache.py run -- cargo test -p stasis_dynload -- --test-threads=1
          python tools/cargo_cache.py run -- cargo build -p stasis
          mkdir -p target/vscode-e2e-toolchain/bin
          cp build/codex-cargo-target/debug/stasis target/vscode-e2e-toolchain/bin/
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            # DWARF pushes the debug executable beyond Node's string limit in the VSIX secret scanner.
            strip --strip-debug target/vscode-e2e-toolchain/bin/stasis
          fi
          cp "$STASIS_RUNTIME_LIBRARY_PATH" target/vscode-e2e-toolchain/bin/
          cp -R src target/vscode-e2e-toolchain/
          "$STASIS_E2E_EXECUTABLE" --json editor-info

      - name: Install extension dependencies
        working-directory: vscode-stasis
        run: npm ci

      - name: Test installed VSIX in VS Code
        working-directory: vscode-stasis
        shell: bash
        run: |
          mkdir -p ../target/vscode-e2e
          set -o pipefail
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            xvfb-run -a npm run test:e2e 2>&1 | tee ../target/vscode-e2e/extension-host.log
          else
            npm run test:e2e 2>&1 | tee ../target/vscode-e2e/extension-host.log
          fi

      - name: Upload VS Code E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: vscode-e2e-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: warn
          path: |
            target/vscode-e2e/frame.png
            target/vscode-e2e/extension-host.log
            vscode-stasis/.vsix/stasislang.stasis.vsix

  android-package-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stasis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: "8.9"

      - name: Checkout SDL3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: libsdl-org/SDL
          ref: 8e37db5e797b6167f3a00d697d816a684bd259c7
          path: target/android-link-deps/SDL

      - name: Checkout SDL3_image
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: libsdl-org/SDL_image
          ref: bec9134a26c7d0f31b36d6083c25296e04cabff5
          path: target/android-link-deps/SDL_image

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Package and link generated Android game
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          STASIS_SDL3_SOURCE: ${{ github.workspace }}/target/android-link-deps/SDL
          STASIS_SDL3_IMAGE_SOURCE: ${{ github.workspace }}/target/android-link-deps/SDL_image
        run: |
          python tools/cargo_cache.py run -- cargo run -p stasis -- --workspace samples/mobile_storage_link package-mobile --target android-arm64 --out dist/android --development-build
          gradle -p samples/mobile_storage_link/dist/android/android :app:assembleDebug --no-daemon --max-workers=2 --console=plain
          test -f samples/mobile_storage_link/dist/android/android/app/build/outputs/apk/debug/app-debug.apk
          native_library=$(find samples/mobile_storage_link/dist/android/android/app/build/intermediates/cxx/Debug -path '*/obj/arm64-v8a/libmain.so' -print -quit)
          link_map=$(find samples/mobile_storage_link/dist/android/android/app/.cxx/Debug -name libmain.map -print -quit)
          test -n "$native_library"
          test -n "$link_map"
          python tools/ci/verify_android_native_library.py \
            --library "$native_library" \
            --bundle-manifest samples/mobile_storage_link/dist/android/aot/mobile_aot_bundle_manifest.json \
            --link-map "$link_map" \
            --readelf "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            --evidence target/android-native-link-evidence.json

      - name: Upload Android native-link evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: android-native-link-evidence
          path: target/android-native-link-evidence.json

      - name: Package and link generic collections Android game
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          STASIS_SDL3_SOURCE: ${{ github.workspace }}/target/android-link-deps/SDL
          STASIS_SDL3_IMAGE_SOURCE: ${{ github.workspace }}/target/android-link-deps/SDL_image
        run: |
          python tools/cargo_cache.py run -- cargo run -p stasis -- --workspace samples/generics_collections package-mobile --target android-arm64 --out dist/generics-android --development-build
          gradle -p samples/generics_collections/dist/generics-android/android :app:assembleDebug --no-daemon --max-workers=2 --console=plain
          test -f samples/generics_collections/dist/generics-android/android/app/build/outputs/apk/debug/app-debug.apk
          native_library=$(find samples/generics_collections/dist/generics-android/android/app/build/intermediates/cxx/Debug -path '*/obj/arm64-v8a/libmain.so' -print -quit)
          link_map=$(find samples/generics_collections/dist/generics-android/android/app/.cxx/Debug -name libmain.map -print -quit)
          test -n "$native_library"
          test -n "$link_map"
          python tools/ci/verify_android_native_library.py \
            --library "$native_library" \
            --bundle-manifest samples/generics_collections/dist/generics-android/aot/mobile_aot_bundle_manifest.json \
            --link-map "$link_map" \
            --readelf "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            --evidence target/generics-android-native-link-evidence.json

      - name: Upload generic Android native-link evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: generics-android-native-link-evidence
          path: target/generics-android-native-link-evidence.json

      - name: Package and link numeric-text Android game
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          STASIS_SDL3_SOURCE: ${{ github.workspace }}/target/android-link-deps/SDL
          STASIS_SDL3_IMAGE_SOURCE: ${{ github.workspace }}/target/android-link-deps/SDL_image
        run: |
          numeric_text_workspace=target/numeric-text-android-workspace
          rm -rf "$numeric_text_workspace"
          mkdir -p "$numeric_text_workspace/vendor/stasis/src"
          cp -R samples/android_numeric_text_seam/. "$numeric_text_workspace/"
          cp -R src/stdlib "$numeric_text_workspace/vendor/stasis/src/stdlib"
          python tools/cargo_cache.py run -- cargo run -p stasis -- --workspace "$numeric_text_workspace" package-mobile --target android-arm64 --out dist/numeric-text-android --development-build
          gradle -p "$numeric_text_workspace/dist/numeric-text-android/android" :app:assembleDebug --no-daemon --max-workers=2 --console=plain
          test -f "$numeric_text_workspace/dist/numeric-text-android/android/app/build/outputs/apk/debug/app-debug.apk"
          native_library=$(find "$numeric_text_workspace/dist/numeric-text-android/android/app/build/intermediates/cxx/Debug" -path '*/obj/arm64-v8a/libmain.so' -print -quit)
          link_map=$(find "$numeric_text_workspace/dist/numeric-text-android/android/app/.cxx/Debug" -name libmain.map -print -quit)
          test -n "$native_library"
          test -n "$link_map"
          python tools/ci/verify_android_native_library.py \
            --library "$native_library" \
            --bundle-manifest "$numeric_text_workspace/dist/numeric-text-android/aot/mobile_aot_bundle_manifest.json" \
            --link-map "$link_map" \
            --readelf "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            --evidence target/numeric-text-android-native-link-evidence.json

      - name: Upload numeric-text Android native-link evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: numeric-text-android-native-link-evidence
          path: target/numeric-text-android-native-link-evidence.json
