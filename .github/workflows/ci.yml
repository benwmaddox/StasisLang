name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v4

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install LLVM (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang

      - name: Install LLVM (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install -y llvm

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Stasis.sln

      - name: Build
        run: dotnet build Stasis.sln -c Release --no-restore

      - name: Validate SVG assets
        run: |
          if [ -d "assets_src" ] && find assets_src -name "*.svg" -type f | head -1 | grep -q .; then
            dotnet run --project Stasis.SvgValidator/Stasis.SvgValidator.csproj -c Release --no-build -- --dir assets_src
          else
            echo "No SVG files to validate"
          fi
        shell: bash

      - name: Test
        run: dotnet test Stasis.sln -c Release --no-build

      - name: Emit sample IR artifacts
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p artifacts
          dotnet run --project Stasis.Cli/Stasis.Cli.csproj -- run samples/basic.stasis --emit-ir > artifacts/basic.ll
          dotnet run --project Stasis.Cli/Stasis.Cli.csproj -- test samples/tests.stasis --emit-ir > artifacts/tests.ll

      - name: Upload IR artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: llvm-ir
          path: artifacts/*.ll
