name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  precheck:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Decide if CI should run
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          api="https://api.github.com"
          auth_header="Authorization: Bearer ${GITHUB_TOKEN}"
          accept_header="Accept: application/vnd.github+json"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            latest_sha="${{ github.event.pull_request.head.sha }}"
            latest_commit_json=$(curl -s -H "$auth_header" -H "$accept_header" \
              "$api/repos/$repo/commits/$latest_sha")
            latest_date=$(echo "$latest_commit_json" | jq -r '.commit.committer.date')

            last_success_json=$(curl -s -H "$auth_header" -H "$accept_header" \
              "$api/repos/$repo/actions/workflows/ci.yml/runs?event=pull_request&status=success&per_page=1")
            last_success_sha=$(echo "$last_success_json" | jq -r '.workflow_runs[0].head_sha // empty')
          else
            latest_commit_json=$(curl -s -H "$auth_header" -H "$accept_header" \
              "$api/repos/$repo/commits/main")
            latest_sha=$(echo "$latest_commit_json" | jq -r '.sha')
            latest_date=$(echo "$latest_commit_json" | jq -r '.commit.committer.date')

            last_success_json=$(curl -s -H "$auth_header" -H "$accept_header" \
              "$api/repos/$repo/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1")
            last_success_sha=$(echo "$last_success_json" | jq -r '.workflow_runs[0].head_sha // empty')
          fi

          now_epoch=$(date +%s)
          latest_epoch=$(date -d "$latest_date" +%s)
          age_minutes=$(( (now_epoch - latest_epoch) / 60 ))

          if [ -n "$last_success_sha" ] && [ "$last_success_sha" = "$latest_sha" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "No new commits since last successful CI on PR head ($latest_sha)."
            else
              echo "No new commits since last successful CI on main ($latest_sha)."
            fi
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=no_new_commits" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$age_minutes" -lt 30 ]; then
            echo "Latest commit is ${age_minutes} minutes old (<30)."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=quiet_period" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "reason=ready" >> "$GITHUB_OUTPUT"

  build-test:
    needs: precheck
    if: needs.precheck.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Stasis.sln

      - name: Build
        run: dotnet build Stasis.sln -c Release --no-restore

      - name: Install LLVM 20 tooling (ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release ca-certificates
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          mkdir -p .tools/llvm-20/bin
          ln -sf "$(command -v clang-20)" .tools/llvm-20/bin/clang
          ln -sf "$(command -v clang++-20)" .tools/llvm-20/bin/clang++
          ln -sf "$(command -v lli-20)" .tools/llvm-20/bin/lli
          echo "PATH=${PWD}/.tools/llvm-20/bin:${PATH}" >> "$GITHUB_ENV"
          echo "clang: $(command -v clang)"
          clang --version

      - name: Install clang (windows)
        if: runner.os == 'Windows'
        run: |
          choco install llvm -y --no-progress
          echo "C:\\Program Files\\LLVM\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "C:\\Program Files\\LLVM\\bin;$env:PATH"
          if (-not (Test-Path "C:\\Program Files\\LLVM\\bin\\clang.exe")) { throw "clang.exe missing after choco install llvm" }
          clang --version

      - name: Build cranelift-aot (rust)
        run: cargo build -p stasis-cranelift-aot --release
        working-directory: tools/cranelift-aot

      - name: Build cranelift-jit-runner (rust)
        run: cargo build -p stasis-cranelift-jit-runner --release
        working-directory: tools/cranelift-jit-runner

      - name: Build stasis_runner (headless)
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S runtime -B runtime/build -DSTASIS_GRAPHICS_BUILD_SHARED=OFF -DSTASIS_GRAPHICS_BUILD_STATIC=OFF -DSTASIS_BUILD_RUNNER=ON -DSTASIS_BUILD_SYS=ON
          cmake --build runtime/build --config Release
          mkdir -p build
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp runtime/build/bin/Release/stasis_runner.exe ./stasis_runner.exe
            cp runtime/build/bin/Release/stasis_runner.exe ./build/stasis_runner.exe
            cp runtime/build/Release/stasis_sys_static.lib ./stasis_sys_static.lib
            cp runtime/build/Release/stasis_sys_static.lib ./build/stasis_sys_static.lib
          else
            # For non-multi-config generators, the binary lives under bin/.
            if [ -f runtime/build/bin/stasis_runner ]; then
              cp runtime/build/bin/stasis_runner ./stasis_runner
              cp runtime/build/bin/stasis_runner ./build/stasis_runner
            else
              cp runtime/build/bin/Release/stasis_runner ./stasis_runner
              cp runtime/build/bin/Release/stasis_runner ./build/stasis_runner
            fi

            if [ -f runtime/build/Release/libstasis_sys_static.a ]; then
              cp runtime/build/Release/libstasis_sys_static.a ./libstasis_sys_static.a
              cp runtime/build/Release/libstasis_sys_static.a ./build/libstasis_sys_static.a
            fi
          fi

      - name: Test
        run: dotnet test Stasis.sln -c Release --no-build
