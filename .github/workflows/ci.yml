name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v4

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install LLVM (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libsdl2-dev libglew-dev

      - name: Install LLVM (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install -y llvm

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Stasis.sln

      - name: Build
        run: dotnet build Stasis.sln -c Release --no-restore

      - name: Validate SVG assets
        run: |
          if [ -d "assets_src" ] && find assets_src -name "*.svg" -type f | head -1 | grep -q .; then
            dotnet run --project Stasis.SvgValidator/Stasis.SvgValidator.csproj -c Release --no-build -- --dir assets_src
          else
            echo "No SVG files to validate"
          fi
        shell: bash

      - name: Run test script (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: ./test.sh

      - name: Run test script (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          .\\build.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\\test.bat

      - name: Compile runtime C sources (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          clang --version
          clang -D_POSIX_C_SOURCE=200809L -I runtime -std=c11 -c runtime/cJSON.c -o cjson.o
          clang -D_POSIX_C_SOURCE=200809L -I runtime -std=c11 -c runtime/stasis_data.c -o stasis_data.o
          clang -D_POSIX_C_SOURCE=200809L -I runtime -std=c11 -c runtime/stasis_runner.c -o stasis_runner.o

      - name: Compile runtime C sources (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $clangcl = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clangcl) { $clangcl = \"C:\\Program Files\\LLVM\\bin\\clang-cl.exe\" }
          if (-not (Test-Path $clangcl)) { throw \"clang-cl not found (tried PATH and $clangcl)\" }
          & $clangcl --version
          & $clangcl /I runtime /std:c11 /c runtime\\cJSON.c
          & $clangcl /I runtime /std:c11 /c runtime\\stasis_data.c
          & $clangcl /I runtime /std:c11 /c runtime\\stasis_runner.c

      - name: Emit sample IR artifacts
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p artifacts
          dotnet run --project Stasis.Cli/Stasis.Cli.csproj -- run samples/basic.stasis --emit-ir > artifacts/basic.ll
          dotnet run --project Stasis.Cli/Stasis.Cli.csproj -- test samples/tests.stasis --emit-ir > artifacts/tests.ll

      - name: Upload IR artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: llvm-ir
          path: artifacts/*.ll
