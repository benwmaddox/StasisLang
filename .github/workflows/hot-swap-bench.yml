name: hot-swap-bench

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch: {}

jobs:
  hot-swap:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - uses: dtolnay/rust-toolchain@stable

      - name: MSVC dev cmd
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Tools (clang) [Windows]
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm -y
          }
          clang --version

      - name: Tools (clang/lld) [Linux]
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld
          clang --version
          ld.lld --version

      - name: Build cranelift-aot (release)
        shell: pwsh
        run: |
          cargo build -p stasis-cranelift-aot --release --manifest-path tools/cranelift-aot/Cargo.toml

      - name: Build native runner + sys runtime (no SDL) [Windows]
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path runtime/build/bin/Release | Out-Null
          New-Item -ItemType Directory -Force -Path runtime/build/Release | Out-Null
          cl /nologo /O2 /W1 /D _CRT_SECURE_NO_WARNINGS runtime/stasis_runner.c runtime/stasis_data.c runtime/cJSON.c /Fe:runtime/build/bin/Release/stasis_runner.exe
          cl /nologo /O2 /W1 /D _CRT_SECURE_NO_WARNINGS /c runtime/stasis_sys.c /Fo:runtime/build/Release/stasis_sys_static.obj
          lib /nologo /OUT:runtime/build/Release/stasis_sys_static.lib runtime/build/Release/stasis_sys_static.obj
          Copy-Item -Force runtime/build/bin/Release/stasis_runner.exe build/stasis_runner.exe
          Copy-Item -Force runtime/build/bin/Release/stasis_runner.exe stasis_runner.exe
          Copy-Item -Force runtime/build/Release/stasis_sys_static.lib build/stasis_sys_static.lib
          Copy-Item -Force runtime/build/Release/stasis_sys_static.lib stasis_sys_static.lib

      - name: Build native runner + sys runtime (no SDL) [Linux]
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p runtime/build/bin/Release runtime/build/Release build
          clang -O2 -Wno-unused-function -D_CRT_SECURE_NO_WARNINGS \
            runtime/stasis_runner.c runtime/stasis_data.c runtime/cJSON.c \
            -ldl -o runtime/build/bin/Release/stasis_runner
          clang -O2 -D_CRT_SECURE_NO_WARNINGS -c runtime/stasis_sys.c -o runtime/build/Release/stasis_sys_static.o
          ar rcs runtime/build/Release/libstasis_sys_static.a runtime/build/Release/stasis_sys_static.o
          cp -f runtime/build/bin/Release/stasis_runner build/stasis_runner
          cp -f runtime/build/bin/Release/stasis_runner stasis_runner
          cp -f runtime/build/Release/libstasis_sys_static.a build/libstasis_sys_static.a
          cp -f runtime/build/Release/libstasis_sys_static.a libstasis_sys_static.a

      - name: Build C# compiler (release)
        shell: pwsh
        run: |
          dotnet build Stasis.Cli/Stasis.Cli.csproj -c Release

      - name: Hot swap benchmark
        shell: pwsh
        run: |
          ./scripts/ci_hot_swap.ps1 -Iterations 5 -Fps 60 -SleepAfterEditMs 6000 -SwapTimeoutMs 60000

      - name: Hot swap thresholds (warn>=250ms fail>=500ms)
        shell: pwsh
        run: |
          ./scripts/ci_hot_swap_check.ps1 -Iterations 5 -WarnMs 250 -FailMs 500
