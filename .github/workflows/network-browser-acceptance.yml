name: Network browser acceptance

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  portable-lan:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Test native LAN policy and existing transport
        run: python tools/cargo_cache.py run -- cargo test -p stasis_network --lib --tests

  android-native-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-linux-android
      - name: Test native join component policy
        run: python tools/ci/test_android_network_join_policy.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native client Android ABI integration
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ndk: 27.0.12077973
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python tools/ci/test_android_network_client.py --serial emulator-5554 --ndk "$ANDROID_HOME/ndk/27.0.12077973"
      - name: Upload Android native client result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: android-native-client
          if-no-files-found: error
          path: target/android-network-client/result.txt

  unix-desktop-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install Linux graphics and display dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y pkg-config xvfb libx11-dev
          libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
          libxss-dev libxtst-dev libxkbcommon-dev libegl1 libgl1-mesa-dri
      - name: Test native library link and host/client lifecycle
        timeout-minutes: 15
        run: bash tools/ci/test_desktop_network_link.sh
      - name: Test shared host lifecycle and join-card controls
        timeout-minutes: 15
        run: |
          cmake -S runtime -B target/desktop-network-runtime -DSTASIS_GRAPHICS_BUILD_SHARED=OFF -DSTASIS_GRAPHICS_BUILD_STATIC=OFF -DSTASIS_BUILD_RUNNER=OFF -DSTASIS_BUILD_SYS=OFF -DSTASIS_MOBILE_RUNTIME_BUILD_TESTS=ON
          cmake --build target/desktop-network-runtime --config Release --target stasis_mobile_runtime_network_test stasis_network_join_card_test
          ctest --test-dir target/desktop-network-runtime -C Release -R "stasis_(mobile_runtime_network_lifecycle|network_join_card_contract)" --output-on-failure --no-tests=error
      - name: Test native client protocol and lifecycle
        timeout-minutes: 15
        run: python3 tools/cargo_cache.py run -- cargo test -p stasis_network --test native_client
      - name: Test desktop network package and linker configuration
        timeout-minutes: 15
        run: |
          python3 tools/cargo_cache.py run -- cargo test -p stasis --lib network
          python3 tools/cargo_cache.py run -- cargo test -p stasis --lib macos_packaged_runner
          python3 tools/cargo_cache.py run -- cargo test -p stasis --bin stasis network
      - name: Test native release provenance
        timeout-minutes: 15
        run: python3 -m unittest tools.ci.test_release_provenance
      - name: Build and audit native desktop host and browser guest package
        timeout-minutes: 15
        run: bash tools/ci/test_unix_desktop_network_package.sh
      - name: Upload native package lifecycle evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-network-package-linux
          if-no-files-found: error
          archive: true
          path: target/desktop-network-package.*/result.json

  apple-network-artifacts:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Test macOS dylib link and host/client lifecycle
        timeout-minutes: 15
        run: bash tools/ci/test_desktop_network_link.sh
      - name: Build iOS device and simulator static ABI artifacts
        timeout-minutes: 15
        run: |
          python3 tools/cargo_cache.py run -- cargo build -p stasis_network --release --target aarch64-apple-ios
          python3 tools/cargo_cache.py run -- cargo build -p stasis_network --release --target aarch64-apple-ios-sim
          test -f build/codex-cargo-target/aarch64-apple-ios/release/libstasis_network.a
          test -f build/codex-cargo-target/aarch64-apple-ios-sim/release/libstasis_network.a
      - name: Test Apple package adapters and nested signing order
        timeout-minutes: 15
        run: |
          python3 tools/cargo_cache.py run -- cargo test -p stasis --lib macos_packaged_runner
          python3 tools/cargo_cache.py run -- cargo test -p stasis --bin stasis mobile_shells_are_platform_projects_over_one_shared_runtime
          bash tools/ci/test_unix_desktop_network_package.sh
      - name: Upload macOS package evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-network-package-macos
          if-no-files-found: error
          archive: true
          path: target/desktop-network-package.*/result.json

  windows-desktop-package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Test native client protocol and lifecycle
        run: python tools/cargo_cache.py run -- cargo test -p stasis_network --test native_client
      - name: Test optional desktop network configuration
        run: python tools/cargo_cache.py run -- cargo test -p stasis --lib desktop_monolith_network_configuration_is_explicit_and_optional
      - name: Test desktop network package contents and support lookup
        run: python tools/cargo_cache.py run -- cargo test -p stasis --bin stasis network
      - name: Test desktop package root layout
        run: python tools/cargo_cache.py run -- cargo test -p stasis --bin stasis windows_desktop_package_keeps_only_the_launcher_at_root
      - name: Test release provenance rejects substituted artifacts
        run: python tools/cargo_cache.py run -- cargo test -p stasis --bin stasis release_provenance_rejects_substituted_renderer_sources

  windows-production-supervision:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      STASIS_RELEASE_ID: ci-network-supervision-${{ github.run_id }}
      STASIS_SOURCE_COMMIT: ${{ github.sha }}
      STASIS_BUILD_TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Compute matching supervision toolchain fingerprint
        shell: pwsh
        run: |
          $fingerprint = (python tools/compute_toolchain_fingerprint.py --source-commit $env:STASIS_SOURCE_COMMIT --release-id $env:STASIS_RELEASE_ID).Trim()
          if ($LASTEXITCODE -ne 0 -or $fingerprint -notmatch '^[0-9a-f]{64}$') { throw "Failed to compute supervision toolchain fingerprint" }
          "STASIS_BUILD_FINGERPRINT=$fingerprint" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build matching supervision graphics runtime and runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $generator = (& powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tools/windows/select-cmake-vs-generator.ps1).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Visual Studio generator detection failed" }
          $runtimeBuild = "target/network-supervision-runtime"
          cmake -S runtime -B $runtimeBuild -G $generator -A x64 `
            -DSTASIS_GRAPHICS_BUNDLE_SDL=ON `
            -DSTASIS_GRAPHICS_BUILD_SHARED=ON `
            -DSTASIS_GRAPHICS_BUILD_STATIC=OFF `
            -DSTASIS_BUILD_RUNNER=ON `
            -DSTASIS_BUILD_SYS=OFF `
            -DSTASIS_RELEASE_ID="$env:STASIS_RELEASE_ID" `
            -DSTASIS_BUILD_FINGERPRINT="$env:STASIS_BUILD_FINGERPRINT"
          if ($LASTEXITCODE -ne 0) { throw "Matching supervision runtime configuration failed" }
          cmake --build $runtimeBuild --config Release --target stasis_graphics stasis_runner
          if ($LASTEXITCODE -ne 0) { throw "Matching supervision runtime build failed" }
          $runtime = (Resolve-Path "$runtimeBuild/bin/Release/stasis_graphics.dll").Path
          $runner = (Resolve-Path "$runtimeBuild/bin/Release/stasis_runner.exe").Path
          "STASIS_RUNTIME_DLL_PATH=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STASIS_RUNTIME_LIBRARY_PATH=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STASIS_RUNTIME_RUNNER_PATH=$runner" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test supervisor command bounds
        run: python tools/cargo_cache.py run -- cargo test -p stasis_network --test supervision
      - name: Test packaged authority and external socket peer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/test_network_supervision.ps1

  windows-browser-guest:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: "24"
      - name: Test desktop package native network link and lifecycle
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/test_desktop_network_link.ps1
      - name: Test generated Windows native client package
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/test_windows_desktop_network_client_package.ps1
      - name: Test Windows LAN and firewall diagnostics
        shell: pwsh
        run: python -m unittest tools.ci.test_desktop_network_diagnostics
      - name: Build native host acceptance fixture
        shell: pwsh
        run: python tools/cargo_cache.py run -- cargo build -p stasis_network --example browser_acceptance_host
      - name: Ensure browser evidence encoder
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            npm install --no-save --package-lock=false @ffmpeg-installer/ffmpeg@1.1.0 @ffprobe-installer/ffprobe@2.1.2
            $ffmpegPath = node -e "process.stdout.write(require('@ffmpeg-installer/ffmpeg').path)"
            $ffprobePath = node -e "process.stdout.write(require('@ffprobe-installer/ffprobe').path)"
            "STASIS_FFMPEG_EXECUTABLE=$ffmpegPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "STASIS_FFPROBE_EXECUTABLE=$ffprobePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $env:STASIS_FFMPEG_EXECUTABLE = $ffmpegPath
            $env:STASIS_FFPROBE_EXECUTABLE = $ffprobePath
          }
          if ($env:STASIS_FFMPEG_EXECUTABLE) {
            & $env:STASIS_FFMPEG_EXECUTABLE -version
            & $env:STASIS_FFPROBE_EXECUTABLE -version
          } else {
            Get-Command ffmpeg -ErrorAction Stop
            Get-Command ffprobe -ErrorAction Stop
          }
      - name: Test browser video encoding dimensions
        shell: pwsh
        run: node --test tools/ci/network_browser_video.test.mjs
      - name: Test bounded browser startup
        shell: pwsh
        run: node --test tools/ci/network_browser_startup.test.mjs
      - name: Run real browser protocol acceptance
        shell: pwsh
        env:
          STASIS_NETWORK_HOST_EXECUTABLE: ${{ github.workspace }}/build/codex-cargo-target/debug/examples/browser_acceptance_host.exe
        run: node tools/run_network_browser_acceptance.mjs
      - name: Upload secret-safe browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: network-browser-acceptance-windows
          if-no-files-found: error
          path: |
            target/network-browser-acceptance/browser.png
            target/network-browser-acceptance/browser.mp4
            target/network-browser-acceptance/result.json
