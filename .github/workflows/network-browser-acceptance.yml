name: Network browser acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/network-browser-acceptance.yml"
      - "Cargo.lock"
      - "docs/portable_lan.md"
      - ".github/workflows/nightly-release.yml"
      - ".github/workflows/bootstrap-artifacts.yml"
      - "apps/stasis/**"
      - "crates/stasis_network/**"
      - "crates/stasis_jit/**"
      - "mobile/shells/**"
      - "runtime/**"
      - "tests/fixtures/network_supervision/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-lan:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test native LAN policy and existing transport
        run: python tools/cargo_cache.py run -- cargo test -p stasis_network --lib --tests

  android-native-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - name: Test native join component policy
        run: python tools/ci/test_android_network_join_policy.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native client Android ABI integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ndk: 27.0.12077973
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python tools/ci/test_android_network_client.py --serial emulator-5554 --ndk "$ANDROID_HOME/ndk/27.0.12077973"
      - name: Upload Android native client result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-client
          if-no-files-found: error
          path: target/android-network-client/result.txt

  unix-desktop-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux graphics and display dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y pkg-config xvfb libx11-dev
          libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
          libxss-dev libxtst-dev libxkbcommon-dev libegl1 libgl1-mesa-dri
      - name: Test native library link and host/client lifecycle
        timeout-minutes: 15
        run: bash tools/ci/test_desktop_network_link.sh
      - name: Test shared host lifecycle and join-card controls
        timeout-minutes: 15
        run: |
          cmake -S runtime -B target/desktop-network-runtime -DSTASIS_GRAPHICS_BUILD_SHARED=OFF -DSTASIS_GRAPHICS_BUILD_STATIC=OFF -DSTASIS_BUILD_RUNNER=OFF -DSTASIS_BUILD_SYS=OFF -DSTASIS_MOBILE_RUNTIME_BUILD_TESTS=ON
          cmake --build target/desktop-network-runtime --config Release --target stasis_mobile_runtime_network_test stasis_network_join_card_test
          ctest --test-dir target/desktop-network-runtime -C Release -R "stasis_(mobile_runtime_network_lifecycle|network_join_card_contract)" --output-on-failure --no-tests=error
      - name: Test native client protocol and lifecycle
        timeout-minutes: 15
        run: python3 tools/cargo_cache.py run -- cargo test -p stasis_network --test native_client
      - name: Test desktop network package and linker configuration
        timeout-minutes: 15
        run: |
          python3 tools/cargo_cache.py run -- cargo test -p stasis --lib network
          python3 tools/cargo_cache.py run -- cargo test -p stasis --lib macos_packaged_runner
          python3 tools/cargo_cache.py run -- cargo test -p stasis --bin stasis network
      - name: Test native release provenance
        timeout-minutes: 15
        run: python3 -m unittest tools.ci.test_release_provenance
      - name: Build and audit native desktop host and browser guest package
        timeout-minutes: 15
        run: bash tools/ci/test_unix_desktop_network_package.sh
      - name: Upload native package lifecycle evidence
        uses: actions/upload-artifact@v4
        with:
          name: desktop-network-package-${{ matrix.os }}
          if-no-files-found: error
          path: target/desktop-network-package.*/result.json

  windows-desktop-package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test native client protocol and lifecycle
        run: python tools/cargo_cache.py run -- cargo test -p stasis_network --test native_client
      - name: Test optional desktop network configuration
        run: python tools/cargo_cache.py run -- cargo test -p stasis --lib desktop_monolith_network_configuration_is_explicit_and_optional
      - name: Test desktop network package contents and support lookup
        run: python tools/cargo_cache.py run -- cargo test -p stasis --bin stasis network
      - name: Test desktop package root layout
        run: python tools/cargo_cache.py run -- cargo test -p stasis --bin stasis windows_desktop_package_keeps_only_the_launcher_at_root
      - name: Test release provenance rejects substituted artifacts
        run: python tools/cargo_cache.py run -- cargo test -p stasis --bin stasis release_provenance_rejects_substituted_renderer_sources

  windows-production-supervision:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Test supervisor command bounds
        run: python tools/cargo_cache.py run -- cargo test -p stasis_network --test supervision
      - name: Test packaged authority and external socket peer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/test_network_supervision.ps1

  windows-browser-guest:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test desktop package native network link and lifecycle
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/test_desktop_network_link.ps1
      - name: Test Windows LAN and firewall diagnostics
        shell: pwsh
        run: python -m unittest tools.ci.test_desktop_network_diagnostics
      - name: Build native host acceptance fixture
        shell: pwsh
        run: python tools/cargo_cache.py run -- cargo build -p stasis_network --example browser_acceptance_host
      - name: Ensure browser evidence encoder
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          Get-Command ffmpeg -ErrorAction Stop
      - name: Test browser video encoding dimensions
        shell: pwsh
        run: node --test tools/ci/network_browser_video.test.mjs
      - name: Test bounded browser startup
        shell: pwsh
        run: node --test tools/ci/network_browser_startup.test.mjs
      - name: Run real browser protocol acceptance
        shell: pwsh
        env:
          STASIS_NETWORK_HOST_EXECUTABLE: ${{ github.workspace }}/build/codex-cargo-target/debug/examples/browser_acceptance_host.exe
        run: node tools/run_network_browser_acceptance.mjs
      - name: Upload secret-safe browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-browser-acceptance-windows
          if-no-files-found: error
          path: |
            target/network-browser-acceptance/browser.png
            target/network-browser-acceptance/browser.mp4
            target/network-browser-acceptance/result.json
