name: Staged Android Archive Acceptance

on:
  workflow_call:
    inputs:
      release_id:
        description: Exact release identity stamped into the staged archive
        required: true
        type: string
      source_commit:
        description: Exact source commit stamped into the staged archive
        required: true
        type: string
      run_id:
        description: Calling nightly-release workflow run
        required: true
        type: string
    secrets:
      android_test_keystore_base64:
        required: true
      android_test_store_password:
        required: true
      android_test_key_password:
        required: true

permissions:
  actions: read
  contents: read

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      STASIS_RELEASE_ID: ${{ inputs.release_id }}
      STASIS_SOURCE_COMMIT: ${{ inputs.source_commit }}
      STASIS_CLI_EXECUTABLE: ${{ github.workspace }}/target/stasis-nightly-linux-x64/bin/stasis
      STASIS_RUNTIME_LIBRARY_PATH: ${{ github.workspace }}/target/stasis-nightly-linux-x64/bin/libstasis_graphics.so
      STASIS_SDL3_SOURCE: ${{ github.workspace }}/target/android-link-deps/SDL
      STASIS_SDL3_IMAGE_SOURCE: ${{ github.workspace }}/target/android-link-deps/SDL_image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Install Android production package toolchain
        shell: bash
        run: |
          sdkmanager "emulator" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Enable and verify hardware KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          udev_settle_status=0
          if sudo udevadm settle --timeout=30; then
            echo "KVM udev settle: passed"
          else
            udev_settle_status=$?
            echo "KVM udev settle: failed (exit $udev_settle_status)"
          fi
          echo "KVM device metadata:"
          stat --printf='type=%F mode=%a uid=%u gid=%g path=%n\n' /dev/kvm || echo "::warning::could not stat /dev/kvm"
          echo "Runner identity:"
          id || echo "::warning::could not read runner identity"
          if command -v getfacl >/dev/null 2>&1; then
            getfacl --absolute-names /dev/kvm || echo "::warning::getfacl failed for /dev/kvm"
          else
            echo "getfacl is not installed"
          fi
          kvm_readable=0
          if test -r /dev/kvm; then
            kvm_readable=1
            echo "KVM read probe: passed"
          else
            echo "KVM read probe: failed"
          fi
          kvm_writable=0
          if test -w /dev/kvm; then
            kvm_writable=1
            echo "KVM write probe: passed"
          else
            echo "KVM write probe: failed"
          fi
          emulator="${ANDROID_HOME:-}/emulator/emulator"
          if [[ ! -x "$emulator" ]]; then
            echo "::error::Android SDK emulator is missing or not executable: $emulator"
            exit 1
          fi
          accel_output="$(mktemp "${RUNNER_TEMP:-/tmp}/staged-kvm-accel-check.XXXXXX")"
          trap 'rm -f "$accel_output"' EXIT
          accel_status=0
          if "$emulator" -accel-check >"$accel_output" 2>&1; then
            :
          else
            accel_status=$?
          fi
          cat "$accel_output"
          kvm_usable_report=0
          if grep -Eq '^KVM .* is installed and usable\.?$' "$accel_output"; then
            kvm_usable_report=1
          fi
          if [[ "$udev_settle_status" -ne 0 || "$kvm_readable" -ne 1 || "$kvm_writable" -ne 1 || "$accel_status" -ne 0 || "$kvm_usable_report" -ne 1 ]]; then
            printf '::error::KVM checks failed: udev_settle_exit=%s readable=%s writable=%s accel_exit=%s usable_report=%s\n' \
              "$udev_settle_status" "$kvm_readable" "$kvm_writable" "$accel_status" "$kvm_usable_report"
            exit 1
          fi

      - name: Materialize the documented Android test key in runner temp
        shell: bash
        env:
          STASIS_ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.android_test_keystore_base64 }}
        run: |
          set -euo pipefail
          python tools/ci/materialize_android_test_signing.py \
            --runner-temp "$RUNNER_TEMP" \
            --workspace "$GITHUB_WORKSPACE" \
            --github-env "$GITHUB_ENV"

      - name: Checkout pinned SDL3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: libsdl-org/SDL
          ref: 8e37db5e797b6167f3a00d697d816a684bd259c7
          path: target/android-link-deps/SDL

      - name: Checkout pinned SDL3_image
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: libsdl-org/SDL_image
          ref: bec9134a26c7d0f31b36d6083c25296e04cabff5
          path: target/android-link-deps/SDL_image

      - name: Download exact Linux archive bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stasis-nightly-linux-x64
          path: target/linux-archive

      - name: Extract and qualify archive consumers
        id: qualify
        shell: bash
        env:
          STASIS_ARTIFACT_FILE: ${{ github.workspace }}/target/linux-archive/stasis-nightly-linux-x64.tar.gz
        run: |
          set -euo pipefail
          mkdir -p target
          tar -xf "$STASIS_ARTIFACT_FILE" -C target
          python tools/ci/qualify_staged_archive.py \
            --archive-root target/stasis-nightly-linux-x64 \
            --archive-file "$STASIS_ARTIFACT_FILE" \
            --target android \
            --artifact-name stasis-nightly-linux-x64 \
            --release-id "${STASIS_RELEASE_ID}" \
            --source-commit "${STASIS_SOURCE_COMMIT}" \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${{ inputs.run_id }}" \
            --evidence-dir target/staged-android-acceptance

      - name: Export the accepted archive runtime fingerprint
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          receipt = json.loads(Path("target/staged-android-acceptance/staged-archive-receipt.json").read_text())
          fingerprint = receipt["toolchain"]["build_fingerprint"]
          if len(fingerprint) != 64 or any(char not in "0123456789abcdef" for char in fingerprint):
              raise SystemExit("archive runtime fingerprint is malformed")
          print(f"STASIS_BUILD_FINGERPRINT={fingerprint}")
          PY

      - name: Run shipped Android packages on the x86_64 emulator
        id: emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          STASIS_ANDROID_TEST_STORE_PASSWORD: ${{ secrets.android_test_store_password }}
          STASIS_ANDROID_TEST_KEY_PASSWORD: ${{ secrets.android_test_key_password }}
          STASIS_EXPECTED_ANDROID_TEST_SIGNER_SHA256: f115a250a33dc3e49b3b7f939075f6db118ce95e139e8c2703c437b1b3f37cc0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 4096M
          ndk: 27.0.12077973
          cmake: 3.22.1
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          emulator-options: >-
            -accel on -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -camera-back none
          script: pwsh -NoProfile -File tools/ci/run_staged_android_archive_acceptance.ps1

      - name: Package and link the shipping Android arm64 consumers
        id: shipping
        shell: bash
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          STASIS_ANDROID_TEST_STORE_PASSWORD: ${{ secrets.android_test_store_password }}
          STASIS_ANDROID_TEST_KEY_PASSWORD: ${{ secrets.android_test_key_password }}
          STASIS_EXPECTED_ANDROID_TEST_SIGNER_SHA256: f115a250a33dc3e49b3b7f939075f6db118ce95e139e8c2703c437b1b3f37cc0
        run: |
          set -euo pipefail
          apksigner="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/build-tools/35.0.0/apksigner"
          test -x "$apksigner"
          for label in bundled generated; do
            project="target/staged-android-acceptance/consumers/${label}-generics"
            shipping="target/android-runtime/${label}/shipping"
            package="${project}/dist/staged-android-arm64"
            mkdir -p "${project}/branding/android/res" "$shipping"
            python - "$project" "$label" <<'PY'
          import base64
          import json
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          label = sys.argv[2]
          manifest_path = root / "stasis.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["android"] = {
              "application_id": f"com.stasislang.archiveacceptance.{label}",
              "label": f"Staged {label.title()} acceptance",
              "orientation": "sensorLandscape",
              "version_code": 1,
              "version_name": "1.0",
              "launcher_resources": "branding/android/res",
          }
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          resources = root / "branding/android/res"
          png = base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="
          )
          for density in ("mdpi", "hdpi", "xhdpi", "xxhdpi", "xxxhdpi"):
              destination = resources / f"mipmap-{density}/ic_launcher.png"
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(png)
          foreground = resources / "drawable/icon_foreground.png"
          foreground.parent.mkdir(parents=True, exist_ok=True)
          foreground.write_bytes(png)
          adaptive = resources / "mipmap-anydpi-v26/ic_launcher.xml"
          adaptive.parent.mkdir(parents=True, exist_ok=True)
          adaptive.write_text(
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '  <background android:drawable="@android:color/black" />\n'
              '  <foreground android:drawable="@drawable/icon_foreground" />\n'
              '</adaptive-icon>\n',
              encoding="utf-8",
          )
          PY
            "$STASIS_CLI_EXECUTABLE" --workspace "$project" package-mobile \
              --target android-arm64 --out dist/staged-android-arm64
            python tools/verify_package_provenance.py \
              --release-root target/stasis-nightly-linux-x64 \
              --package-root "$package" \
              --expect-runtime-sources 2>&1 | tee "$shipping/package-provenance.log"
            python tools/ci/verify_staged_android_shipping_runtime.py \
              --archive-root target/stasis-nightly-linux-x64 \
              --package-root "$package" \
              --release-id "$STASIS_RELEASE_ID" \
              --source-commit "$STASIS_SOURCE_COMMIT" \
              --build-fingerprint "$STASIS_BUILD_FINGERPRINT" \
              2>&1 | tee "$shipping/runtime-kit-identity.log"
            gradle --init-script "$STASIS_GRADLE_INIT_SCRIPT" -p "$package/android" :app:assembleDebug \
              --no-daemon --max-workers=2 --console=plain 2>&1 | tee "$shipping/gradle-link.log"
            apk="$package/android/app/build/outputs/apk/debug/app-debug.apk"
            test -s "$apk"
            python tools/ci/check_android_release_package.py \
              --abi arm64-v8a --required-asset "" "$apk" \
              2>&1 | tee "$shipping/android-apk-audit.log"
            "$apksigner" verify --verbose --print-certs "$apk" 2>&1 | tee "$shipping/apksigner.log"
            python tools/ci/verify_android_test_signer.py \
              --apk "$apk" --apksigner "$apksigner" \
              --expected-sha256 "$STASIS_EXPECTED_ANDROID_TEST_SIGNER_SHA256" \
              --output "$shipping/apksigner-receipt.json"
            cp -R "$package" "$shipping/package"
            cp "$apk" "$shipping/app-debug.apk"
          done

      - name: Bind Android runtime evidence to the exact archive
        id: record
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci/record_staged_archive_runtime.py \
            --receipt target/staged-android-acceptance/staged-archive-receipt.json \
            --target android \
            --bundled-root target/android-runtime/bundled \
            --generated-root target/android-runtime/generated \
            --release-id "${STASIS_RELEASE_ID}" \
            --source-commit "${STASIS_SOURCE_COMMIT}"

      - name: Remove the temporary Android test keystore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/stasis-android-test.keystore"
          case "$key_path" in
            "$RUNNER_TEMP"/*) rm -f -- "$key_path" ;;
            *) echo "Refusing to remove a keystore outside runner temp" >&2; exit 1 ;;
          esac

      - name: Collect staged Android review evidence
        if: always()
        shell: bash
        env:
          STASIS_STAGED_LANE_PASSED: ${{ steps.qualify.outcome == 'success' && steps.emulator.outcome == 'success' && steps.shipping.outcome == 'success' && steps.record.outcome == 'success' }}
        run: |
          python tools/ci/collect_staged_archive_evidence.py \
            --target android \
            --staged-root target/staged-android-acceptance \
            --archive-root target/stasis-nightly-linux-x64 \
            --runtime-root target/android-runtime \
            --output target/staged-release-evidence

      - name: Upload staged Android review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: staged-release-evidence-android
          path: target/staged-release-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Upload staged Android archive receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: staged-release-receipt-android
          path: target/staged-android-acceptance/staged-archive-receipt.json
          if-no-files-found: error
          retention-days: 14
