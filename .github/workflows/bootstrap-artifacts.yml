name: Bootstrap Artifacts

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build-rust-stasis:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC dev environment (windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build stasis (release)
        run: cargo build -p stasis --release

      - name: Build Cranelift AOT helper (release)
        run: cargo build -p stasis-cranelift-aot --release
        working-directory: tools/cranelift-aot

      - name: Build stasis_graphics runtime (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot -or -not (Test-Path (Join-Path $vcpkgRoot "vcpkg.exe"))) {
            if (Test-Path "C:\\vcpkg\\vcpkg.exe") {
              $vcpkgRoot = "C:\\vcpkg"
            }
          }
          if (-not $vcpkgRoot -or -not (Test-Path (Join-Path $vcpkgRoot "vcpkg.exe"))) {
            throw "vcpkg.exe not found (expected VCPKG_INSTALLATION_ROOT or C:\\vcpkg)."
          }

          $triplet = "x64-windows-static"
          & (Join-Path $vcpkgRoot "vcpkg.exe") install "sdl2:$triplet" "sdl2-image:$triplet" "glew:$triplet" --recurse

          $buildDir = "runtime/build_ci"
          cmake -S runtime -B $buildDir -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$triplet" `
            -DSTASIS_GRAPHICS_BUILD_SHARED=ON `
            -DSTASIS_GRAPHICS_BUILD_STATIC=OFF `
            -DSTASIS_BUILD_RUNNER=OFF `
            -DSTASIS_BUILD_SYS=OFF

          cmake --build $buildDir --config Release --target stasis_graphics

      - name: Assemble bundle (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          out="dist/stasis-release-${{ runner.os }}"
          mkdir -p "${out}/bin"
          cp "target/release/stasis" "${out}/bin/"
          cp "tools/cranelift-aot/target/release/stasis-cranelift-aot" "${out}/bin/"
          cp README.md "${out}/"
          cp LICENSE "${out}/"
          cp -R src "${out}/"
          cp -R samples "${out}/"
          tar -C dist -czf "dist/stasis-release-${{ runner.os }}.tar.gz" "stasis-release-${{ runner.os }}"

      - name: Assemble bundle (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "dist/stasis-release-${{ runner.os }}"
          New-Item -ItemType Directory -Force -Path "$out/bin" | Out-Null
          Copy-Item "target/release/stasis.exe" "$out/bin/" -Force
          Copy-Item "tools/cranelift-aot/target/release/stasis-cranelift-aot.exe" "$out/bin/" -Force
          # Include the graphics runtime DLL so `stasis play` works out of the box on Windows.
          Copy-Item "runtime/build_ci/bin/Release/*.dll" "$out/bin/" -Force
          Copy-Item README.md "$out/" -Force
          Copy-Item LICENSE "$out/" -Force
          Copy-Item src "$out/" -Recurse -Force
          Copy-Item samples "$out/" -Recurse -Force
          Compress-Archive -Path "$out/*" -DestinationPath "dist/stasis-release-${{ runner.os }}.zip" -Force

      - name: Smoke test bundled graphics runtime (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item Env:STASIS_RUNTIME_DLL_PATH -ErrorAction SilentlyContinue
          Push-Location "dist/stasis-release-${{ runner.os }}/bin"
          .\stasis.exe probe-graphics-runtime
          .\stasis-cranelift-aot.exe --help | Out-Null
          Pop-Location

      - name: Upload artifact (unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: stasis-release-${{ runner.os }}
          path: dist/stasis-release-${{ runner.os }}.tar.gz
          if-no-files-found: error

      - name: Upload artifact (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: stasis-release-${{ runner.os }}
          path: dist/stasis-release-${{ runner.os }}.zip
          if-no-files-found: error
