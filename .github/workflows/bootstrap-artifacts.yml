name: Bootstrap Artifacts

env:
  CARGO_INCREMENTAL: "0"

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build-rust-stasis:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC dev environment (windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build stasis (release)
        run: cargo build -p stasis --release

      - name: Build native AOT bridge (unix)
        if: runner.os != 'Windows'
        run: cargo rustc -p stasis_dynload --release -- --crate-type staticlib

      - name: Build native AOT bridge (windows)
        if: runner.os == 'Windows'
        run: cargo build -p stasis_dynload --release

      - name: Install SDL development packages (linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes pkg-config
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev
          libxi-dev libxss-dev libxtst-dev libxkbcommon-dev

      - name: Install SDL development packages (macos)
        if: runner.os == 'macOS'
        run: brew install pkg-config

      - name: Build stasis_graphics runtime (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          runner_build=OFF
          build_targets=(stasis_graphics)
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            runner_build=ON
            build_targets+=(stasis_runner)
          fi
          cmake -S runtime -B runtime/build_ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTASIS_GRAPHICS_BUILD_SHARED=ON \
            -DSTASIS_GRAPHICS_BUILD_STATIC=OFF \
            -DSTASIS_GRAPHICS_BUNDLE_SDL=ON \
            -DSTASIS_GRAPHICS_SDL_ONLY=ON \
            -DSTASIS_BUILD_RUNNER="${runner_build}" \
            -DSTASIS_BUILD_SYS=OFF
          cmake --build runtime/build_ci --config Release --target "${build_targets[@]}"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            test "$(plutil -extract NSHighResolutionCapable raw runtime/build_ci/bin/Release/stasis_runner.app/Contents/Info.plist)" = "true"
          fi

      - name: Build stasis_graphics runtime (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $buildDir = "runtime/build_ci"
          $generator = (& powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tools/windows/select-cmake-vs-generator.ps1).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Visual Studio generator detection failed." }
          cmake -S runtime -B $buildDir -G $generator -A x64 `
            -DSTASIS_GRAPHICS_BUNDLE_SDL=ON `
            -DSTASIS_GRAPHICS_BUILD_SHARED=ON `
            -DSTASIS_GRAPHICS_BUILD_STATIC=OFF `
            -DSTASIS_GRAPHICS_SDL_ONLY=ON `
            -DSTASIS_MOBILE_RUNTIME_BUILD_TESTS=ON `
            -DSTASIS_BUILD_RUNNER=ON `
            -DSTASIS_BUILD_SYS=OFF

          cmake --build $buildDir --config Release --target stasis_graphics stasis_runner stasis_render_contract_test stasis_asset_path_test
          ctest --test-dir $buildDir -C Release -R "stasis_(render_command|asset_path)_contract" --output-on-failure

      - name: Assemble bundle (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          out="dist/stasis-release-${{ runner.os }}"
          mkdir -p "${out}/bin"
          cp "target/release/stasis" "${out}/bin/"
          cp "target/release/libstasis_dynload.a" "${out}/bin/"
          find runtime/build_ci/bin -maxdepth 2 -type f \( -name 'libstasis_graphics.so' -o -name 'libstasis_graphics.dylib' \) -exec cp {} "${out}/bin/" \;
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            cp -R runtime/build_ci/bin/Release/stasis_runner.app "${out}/bin/"
          fi
          cp README.md "${out}/"
          cp LICENSE "${out}/"
          cp -R src "${out}/"
          cp -R samples "${out}/"
          mkdir -p "${out}/mobile"
          cp -R mobile/shells "${out}/mobile/"
          mkdir -p "${out}/runtime"
          cp runtime/CMakeLists.txt runtime/MINIMP3-LICENSE.txt runtime/minimp3.h runtime/minimp3_ex.h runtime/stasis_svg.cpp runtime/stasis_svg.h runtime/stasis_asset_path.h runtime/stasis_display_scale.h runtime/stasis_render_contract.h runtime/stasis_renderer_lifecycle.h runtime/stasis_performance_metrics.h runtime/stasis_audio_assets.c runtime/stasis_audio_assets.h runtime/stasis_graphics.c runtime/stasis_runner.manifest runtime/stasis_runner_macos.plist.in runtime/stasis_mobile_aot_runtime.c runtime/stasis_mobile_aot_runtime.h runtime/stasis_mobile_runtime.c runtime/stasis_mobile_runtime.h runtime/stasis_platform_storage.c runtime/stasis_platform_storage.h runtime/stb_truetype.h "${out}/runtime/"
          cp -R runtime/third_party "${out}/runtime/"
          mkdir -p "${out}/docs"
          cp docs/agent_workflow.md docs/mobile_packaging.md docs/mobile_packaging_abi.md docs/mobile_aot_artifacts.md docs/release_provenance.md docs/sdl3_migration.md "${out}/docs/"
          cp -R docs/knowledge "${out}/docs/"
          release_tag="${{ github.event.release.tag_name }}"
          development_flag=()
          if [ -z "${release_tag}" ]; then
            release_tag="development-bootstrap-${{ github.run_id }}"
            development_flag=(--development-build)
          fi
          python3 tools/generate_release_provenance.py \
            --archive-root "${out}" \
            --release-tag "${release_tag}" \
            --source-commit "${{ github.sha }}" \
            --compiler "bin/stasis" \
            --dependency "sdl3=3.4.10-static" \
            --dependency "sdl3_image=3.4.4-static" \
            "${development_flag[@]}"
          tar -C dist -czf "dist/stasis-release-${{ runner.os }}.tar.gz" "stasis-release-${{ runner.os }}"

      - name: Assemble bundle (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "dist/stasis-release-${{ runner.os }}"
          New-Item -ItemType Directory -Force -Path "$out/bin" | Out-Null
          Copy-Item "target/release/stasis.exe" "$out/" -Force
          Copy-Item "target/release/stasis_dynload.dll" "$out/" -Force
          Copy-Item "target/release/stasis_dynload.dll.lib" "$out/" -Force
          $rustLld = Join-Path (rustc --print sysroot) "lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe"
          Copy-Item $rustLld "$out/lld-link.exe" -Force
          $clangCl = (Get-Command clang-cl.exe -ErrorAction Stop).Source
          Copy-Item $clangCl "$out/clang-cl.exe" -Force
          $rustCopyright = Join-Path (rustc --print sysroot) "share/doc/rust/COPYRIGHT.html"
          Copy-Item $rustCopyright "$out/RUST-LLVM-COPYRIGHT.html" -Force
          $vsWhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $vsRoot = & $vsWhere -latest -property installationPath
          $vsNotice = Get-ChildItem (Join-Path $vsRoot "Licenses") -Recurse -Filter "ThirdPartyNotices.txt" | Select-Object -First 1
          if (-not $vsNotice) { throw "Visual Studio LLVM third-party notices not found" }
          Copy-Item $vsNotice.FullName "$out/LLVM-THIRD-PARTY-NOTICES.txt" -Force
          # Keep the runtime DLL beside stasis.exe so `stasis.exe play ...` works from the archive root.
          Copy-Item "runtime/build_ci/bin/Release/*.dll" "$out/" -Force
          Copy-Item "runtime/build_ci/bin/Release/stasis_runner.exe" "$out/" -Force
          Copy-Item README.md "$out/" -Force
          Copy-Item LICENSE "$out/" -Force
          Copy-Item THIRD_PARTY_NOTICES.md "$out/" -Force
          New-Item -ItemType Directory -Force -Path "$out/tools/windows" | Out-Null
          Copy-Item tools/windows/stasis-signing.ps1 "$out/tools/windows/" -Force
          Copy-Item src "$out/" -Recurse -Force
          Copy-Item samples "$out/" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$out/mobile" | Out-Null
          Copy-Item mobile/shells "$out/mobile/" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$out/runtime" | Out-Null
          @('CMakeLists.txt', 'MINIMP3-LICENSE.txt', 'minimp3.h', 'minimp3_ex.h', 'stasis_svg.cpp', 'stasis_svg.h', 'stasis_asset_path.h', 'stasis_display_scale.h', 'stasis_render_contract.h', 'stasis_renderer_lifecycle.h', 'stasis_performance_metrics.h', 'stasis_audio_assets.c', 'stasis_audio_assets.h', 'stasis_graphics.c', 'stasis_runner.manifest', 'stasis_runner_macos.plist.in', 'stasis_mobile_aot_runtime.c', 'stasis_mobile_aot_runtime.h', 'stasis_mobile_runtime.c', 'stasis_mobile_runtime.h', 'stasis_platform_storage.c', 'stasis_platform_storage.h', 'stb_truetype.h') | ForEach-Object { Copy-Item "runtime/$_" "$out/runtime/" -Force }
          Copy-Item "runtime/third_party" "$out/runtime/" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$out/docs" | Out-Null
          Copy-Item docs/agent_workflow.md,docs/mobile_packaging.md,docs/mobile_packaging_abi.md,docs/mobile_aot_artifacts.md,docs/release_provenance.md,docs/sdl3_migration.md "$out/docs/" -Force
          Copy-Item docs/knowledge "$out/docs/knowledge" -Recurse -Force
          $releaseTag = "${{ github.event.release.tag_name }}"
          $developmentFlag = @()
          if (-not $releaseTag) {
            $releaseTag = "development-bootstrap-${{ github.run_id }}"
            $developmentFlag = @("--development-build")
          }
          python tools/generate_release_provenance.py `
            --archive-root "$out" `
            --release-tag "$releaseTag" `
            --source-commit "${{ github.sha }}" `
            --compiler "stasis.exe" `
            --dependency "sdl3=3.4.10-static" `
            --dependency "sdl3_image=3.4.4-static" `
            @developmentFlag
          Compress-Archive -Path "$out/*" -DestinationPath "dist/stasis-release-${{ runner.os }}.zip" -Force

      - name: Smoke test bundled graphics runtime (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item Env:STASIS_RUNTIME_DLL_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:LIB -ErrorAction SilentlyContinue
          Remove-Item Env:CC -ErrorAction SilentlyContinue
          Push-Location "dist/stasis-release-${{ runner.os }}"
          .\stasis.exe probe-graphics-runtime
          & .\samples\windows_launch_smoke\verify.ps1 -Toolchain (Resolve-Path .\stasis.exe) -ArtifactRoot (Join-Path (Get-Location) 'windows-launch-evidence')
          .\stasis.exe new ci_smoke --dir cli-smoke
          .\stasis.exe --workspace cli-smoke check
          .\stasis.exe --workspace cli-smoke test
          .\stasis.exe --workspace cli-smoke build --mode release
          $smokeProcess = Start-Process -FilePath ".\cli-smoke\build\ci_smoke.exe" -PassThru
          try {
            if ($smokeProcess.WaitForExit(5000)) {
              if ($smokeProcess.ExitCode -ne 0) { throw "ci_smoke exited early with code $($smokeProcess.ExitCode)" }
            } else {
              Stop-Process -Id $smokeProcess.Id -Force -ErrorAction SilentlyContinue
              $smokeProcess.WaitForExit()
            }
          } finally {
            if (-not $smokeProcess.HasExited) {
              Stop-Process -Id $smokeProcess.Id -Force -ErrorAction SilentlyContinue
              $smokeProcess.WaitForExit()
            }
            $smokeProcess.Dispose()
          }
          Set-Content -Path "cli-smoke/src/main.stasis" -Encoding ASCII -Value @(
            "function main(): i32 { return 0; }",
            "function tick(): i32 { return 0; }",
            "function render(): i32 { return 0; }"
          )
          New-Item -ItemType Directory -Force -Path "cli-smoke/assets" | Out-Null
          Set-Content -Path "cli-smoke/assets/manifest.json" -Encoding ASCII -Value '{"schema":"stasis-assets","version":1,"assets":[]}'
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            .\stasis.exe --workspace cli-smoke package --target desktop --development-build
          } else {
            .\stasis.exe --workspace cli-smoke package --target desktop
          }
          if (-not (Test-Path "cli-smoke/dist/ci_smoke-desktop/ci_smoke.exe")) { throw "game package runner missing" }
          if (-not (Test-Path "cli-smoke/dist/ci_smoke-desktop/app/stasis.json")) { throw "game package manifest missing" }
          if (-not (Test-Path "cli-smoke/dist/ci_smoke-desktop/app/stasis_provenance.json")) { throw "game package provenance missing" }
          if (Test-Path "cli-smoke/dist/ci_smoke-desktop/app/ci_smoke.dll") { throw "obsolete game package library present; monolithic Windows package must not contain app/ci_smoke.dll" }
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            .\stasis.exe --workspace cli-smoke package-mobile --target android-arm64 --out dist/android --development-build
            .\stasis.exe --workspace cli-smoke package-mobile --target ios-arm64 --out dist/ios --development-build
          } else {
            .\stasis.exe --workspace cli-smoke package-mobile --target android-arm64 --out dist/android
            .\stasis.exe --workspace cli-smoke package-mobile --target ios-arm64 --out dist/ios
          }
          if (-not (Test-Path "cli-smoke/dist/android/android/app/src/main/cpp/CMakeLists.txt")) { throw "Android mobile shell missing" }
          if (-not (Test-Path "cli-smoke/dist/ios/ios/StasisMobile.xcodeproj/project.pbxproj")) { throw "iOS mobile shell missing" }
          Pop-Location
          if ("${{ github.event_name }}" -ne "workflow_dispatch") {
            python tools/verify_package_provenance.py --release-root "dist/stasis-release-${{ runner.os }}" --package-root "dist/stasis-release-${{ runner.os }}/cli-smoke/dist/ci_smoke-desktop/app"
            python tools/verify_package_provenance.py --release-root "dist/stasis-release-${{ runner.os }}" --package-root "dist/stasis-release-${{ runner.os }}/cli-smoke/dist/android" --expect-runtime-sources
            python tools/verify_package_provenance.py --release-root "dist/stasis-release-${{ runner.os }}" --package-root "dist/stasis-release-${{ runner.os }}/cli-smoke/dist/ios" --expect-runtime-sources
          }

      - name: Smoke test bundled CLI (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          pushd "dist/stasis-release-${{ runner.os }}"
          ./bin/stasis new ci_smoke --dir cli-smoke
          ./bin/stasis --workspace cli-smoke check
          ./bin/stasis --workspace cli-smoke test
          ./bin/stasis --workspace cli-smoke build --mode release
          smoke_executable="./cli-smoke/build/ci_smoke"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            smoke_executable="./cli-smoke/build/ci_smoke.app/Contents/MacOS/ci_smoke"
          fi
          python3 - "${smoke_executable}" <<'PY'
          import subprocess
          import sys

          process = subprocess.Popen([sys.argv[1]])
          try:
              return_code = process.wait(timeout=5)
          except subprocess.TimeoutExpired:
              process.terminate()
              try:
                  process.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.wait()
          else:
              if return_code != 0:
                  raise SystemExit(f"ci_smoke exited early with code {return_code}")
          PY
          printf '%s\n' \
            'function main(): i32 { return 0; }' \
            'function tick(): i32 { return 0; }' \
            'function render(): i32 { return 0; }' > cli-smoke/src/main.stasis
          mkdir -p cli-smoke/assets
          printf '%s\n' '{"schema":"stasis-assets","version":1,"assets":[]}' > cli-smoke/assets/manifest.json
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            package_flag=(--development-build)
          else
            package_flag=()
          fi
          ./bin/stasis --workspace cli-smoke package --target desktop "${package_flag[@]}"
          desktop_diagnostics="$(./cli-smoke/dist/ci_smoke-desktop/ci_smoke 2>&1)"
          grep -q 'Stasis package provenance:' <<<"${desktop_diagnostics}"
          ./bin/stasis --workspace cli-smoke package-mobile --target android-arm64 --out dist/android "${package_flag[@]}"
          ./bin/stasis --workspace cli-smoke package-mobile --target ios-arm64 --out dist/ios "${package_flag[@]}"
          popd
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            python3 tools/verify_package_provenance.py --release-root "dist/stasis-release-${{ runner.os }}" --package-root "dist/stasis-release-${{ runner.os }}/cli-smoke/dist/ci_smoke-desktop"
            python3 tools/verify_package_provenance.py --release-root "dist/stasis-release-${{ runner.os }}" --package-root "dist/stasis-release-${{ runner.os }}/cli-smoke/dist/android" --expect-runtime-sources
            python3 tools/verify_package_provenance.py --release-root "dist/stasis-release-${{ runner.os }}" --package-root "dist/stasis-release-${{ runner.os }}/cli-smoke/dist/ios" --expect-runtime-sources
          fi

      - name: Upload artifact (unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: stasis-release-${{ runner.os }}
          path: dist/stasis-release-${{ runner.os }}.tar.gz
          if-no-files-found: error

      - name: Upload artifact (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: stasis-release-${{ runner.os }}
          path: dist/stasis-release-${{ runner.os }}.zip
          if-no-files-found: error
