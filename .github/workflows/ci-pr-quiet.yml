name: CI (PR quiet dispatcher)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write
  statuses: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch PR CI runs after quiet period
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          api="https://api.github.com"
          auth_header="Authorization: Bearer ${GITHUB_TOKEN}"
          accept_header="Accept: application/vnd.github+json"

          prs_json=$(curl -s -H "$auth_header" -H "$accept_header" \
            "$api/repos/$repo/pulls?state=open&per_page=100")
          pr_count=$(echo "$prs_json" | jq -r 'length')

          if [ "$pr_count" = "0" ]; then
            echo "No open PRs."
            exit 0
          fi

          runs_json=$(curl -s -H "$auth_header" -H "$accept_header" \
            "$api/repos/$repo/actions/workflows/ci.yml/runs?per_page=100")

          now_epoch=$(date +%s)
          next_run_utc=$(date -u -d 'next hour' +"%Y-%m-%d %H:00 UTC")

          echo "$prs_json" | jq -c '.[]' | while read -r pr; do
            pr_number=$(echo "$pr" | jq -r '.number')
            head_sha=$(echo "$pr" | jq -r '.head.sha')
            head_ref=$(echo "$pr" | jq -r '.head.ref')
            head_repo=$(echo "$pr" | jq -r '.head.repo.full_name')

            if [ "$head_repo" != "$repo" ]; then
              echo "PR #$pr_number is from a fork ($head_repo); skipping."
              continue
            fi

            commit_json=$(curl -s -H "$auth_header" -H "$accept_header" \
              "$api/repos/$repo/commits/$head_sha")
            commit_date=$(echo "$commit_json" | jq -r '.commit.committer.date')
            commit_epoch=$(date -d "$commit_date" +%s)
            age_minutes=$(( (now_epoch - commit_epoch) / 60 ))

            has_success=$(echo "$runs_json" | jq -r --arg sha "$head_sha" '
              any(.workflow_runs[]; .head_sha == $sha and .conclusion == "success")
            ')

            if [ "$has_success" != "true" ]; then
              desc="Waiting for scheduled CI (~20 min). Next run: $next_run_utc"
              curl -s -X POST -H "$auth_header" -H "$accept_header" \
                "$api/repos/$repo/statuses/$head_sha" \
                -d "{\"state\":\"pending\",\"context\":\"ci/quiet\",\"description\":\"$desc\"}" > /dev/null
            fi

            if [ "$age_minutes" -lt 30 ]; then
              echo "PR #$pr_number head is ${age_minutes} minutes old (<30); skipping."
              continue
            fi

            if [ "$has_success" = "true" ]; then
              echo "PR #$pr_number head already passed CI ($head_sha); skipping."
              continue
            fi

            has_active=$(echo "$runs_json" | jq -r --arg sha "$head_sha" '
              any(.workflow_runs[]; .head_sha == $sha and (.status == "queued" or .status == "in_progress"))
            ')
            if [ "$has_active" = "true" ]; then
              echo "PR #$pr_number head already queued/in progress ($head_sha); skipping."
              continue
            fi

            payload=$(printf '{"ref":"%s","inputs":{"ref":"%s"}}' "$head_ref" "$head_ref")
            curl -s -X POST -H "$auth_header" -H "$accept_header" \
              "$api/repos/$repo/actions/workflows/ci.yml/dispatches" \
              -d "$payload" > /dev/null

            echo "Dispatched CI for PR #$pr_number at $head_ref ($head_sha)."
          done
