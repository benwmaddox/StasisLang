[package]
name = "stasis-cranelift-aot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.95"
clap = { version = "4.5.23", features = ["derive"] }
cranelift-codegen = "0.126.1"
cranelift-frontend = "0.126.1"
cranelift-module = "0.126.1"
cranelift-object = "0.126.1"
target-lexicon = "0.13.2"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
strip = "symbols"
