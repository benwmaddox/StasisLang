[package]
name = "stasis_compiler"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["native"]
native = [
  "dep:atomic-write-file",
  "dep:cranelift-codegen",
  "dep:cranelift-frontend",
  "dep:cranelift-jit",
  "dep:cranelift-module",
  "dep:cranelift-native",
  "dep:cranelift-object",
  "dep:stasis_dynload",
  "dep:stasis_jit",
  "dep:target-lexicon",
]
browser-core = []

[dependencies]
cranelift-codegen = { workspace = true, optional = true }
cranelift-frontend = { workspace = true, optional = true }
cranelift-jit = { workspace = true, optional = true }
cranelift-module = { workspace = true, optional = true }
cranelift-native = { workspace = true, optional = true }
cranelift-object = { workspace = true, optional = true }
target-lexicon = { workspace = true, optional = true }
stasis_jit = { path = "../stasis_jit", optional = true }
stasis_dynload = { path = "../stasis_dynload", features = ["network"], optional = true }
serde.workspace = true
serde_json.workspace = true
atomic-write-file = { workspace = true, optional = true }
sha2.workspace = true

[dev-dependencies]
cc = "1.2"
object = "0.36"
serde_json.workspace = true
