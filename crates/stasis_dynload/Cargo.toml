[package]
name = "stasis_dynload"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
network = ["dep:stasis_network"]
cross-atlas-research = []

[dependencies]
stasis_network = { path = "../stasis_network", optional = true }

[build-dependencies]
cc = "1.2"

[[example]]
name = "cross_atlas_benchmark"
required-features = ["cross-atlas-research"]

