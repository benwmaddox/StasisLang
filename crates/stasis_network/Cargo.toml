[package]
name = "stasis_network"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[[example]]
name = "supervision_peer"
path = "../../tests/fixtures/network_supervision/peer/src/main.rs"

[[example]]
name = "supervision_live_ttt_peer"
path = "../../tests/fixtures/network_supervision/live_ttt/peer/src/main.rs"

[[bin]]
name = "stasis-network-supervise"
path = "src/supervise_main.rs"
required-features = ["supervision-cli"]

[features]
supervision-cli = ["dep:serde_json", "dep:stasis_runner"]

[dependencies]
sha2.workspace = true
socket2.workspace = true
thiserror.workspace = true
tungstenite.workspace = true
getrandom.workspace = true
if-addrs = "0.13"
serde_json = { workspace = true, optional = true }
stasis_runner = { path = "../stasis_runner", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
